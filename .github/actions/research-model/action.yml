name: Prepare existing research inference boundary
description: Install a checksum-verified CPU model for the existing pipeline, plus the small local multilingual embedding model used by hybrid retrieval.
runs:
  using: composite
  steps:
    - name: Select an approved local model and immutable cache
      if: env.PCT_LLM_PROVIDER == 'local_llama_cpp'
      shell: bash
      run: |
        python3 - <<'PY'
        import os,pathlib
        models={'Qwen/Qwen2.5-3B-Instruct-GGUF':('qwen2.5-3b','nabou-qwen2.5-3b-q4km-7dabda4d-v2'),
                'Qwen/Qwen2.5-7B-Instruct-GGUF':('qwen2.5-7b','nabou-official-qwen2.5-7b-q4km-bb5d59e0-v2'),
                'Qwen/Qwen3-8B-GGUF':('qwen3-8b','nabou-official-qwen3-8b-q4km-7c41481f-v1')}
        repo=os.getenv('PCT_LOCAL_MODEL_REPOSITORY') or os.getenv('PCT_LLM_MODEL') or 'Qwen/Qwen2.5-3B-Instruct-GGUF'
        folder,key=models[repo]
        with open(os.environ['GITHUB_ENV'],'a') as out:
            out.write('PCT_LOCAL_MODEL_REPOSITORY='+repo+'\n')
            out.write('NABOU_MODEL_CACHE_DIR='+str(pathlib.Path.home()/'.cache/nabou-models'/folder)+'\n')
            out.write('NABOU_MODEL_CACHE_KEY='+key+'\n')
        PY
    - uses: actions/cache/restore@v4
      if: env.PCT_LLM_PROVIDER == 'local_llama_cpp'
      id: model-cache
      with:
        path: ${{ env.NABOU_MODEL_CACHE_DIR }}
        key: ${{ env.NABOU_MODEL_CACHE_KEY }}
    # llama-cpp-python 0.3.16 is compiled from source on the runner (~2 min).
    # Keep the built wheel (and its pinned dependency wheels) in an Actions
    # cache. The key includes the runner image, Python version and a hash of
    # the CPU model+flags, because the default build is tuned to the host CPU:
    # a wheel is only ever reused on an identical CPU, so builds and outputs
    # stay the same as a fresh install. Any cache problem falls back to the
    # original install command.
    - name: Key the CPU inference wheel cache to this runner
      if: env.PCT_LLM_PROVIDER == 'local_llama_cpp'
      id: wheel-key
      shell: bash
      run: |
        py=$(python3 -c 'import sys;print("%d.%d.%d"%sys.version_info[:3])')
        cpu=$( (grep -m1 '^model name' /proc/cpuinfo; grep -m1 '^flags' /proc/cpuinfo) | sha256sum | cut -c1-16)
        echo "key=nabou-wheels-llama-cpp-python-0.3.16-hfhub-0.36.0-${ImageOS:-linux}-${ImageVersion:-0}-py${py}-cpu${cpu}-v1" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v4
      if: env.PCT_LLM_PROVIDER == 'local_llama_cpp'
      id: wheel-cache
      continue-on-error: true
      with:
        path: ~/.cache/nabou-wheels
        key: ${{ steps.wheel-key.outputs.key }}
    - name: Install CPU inference dependencies
      if: env.PCT_LLM_PROVIDER == 'local_llama_cpp'
      id: wheel-install
      shell: bash
      env:
        CMAKE_BUILD_PARALLEL_LEVEL: '2'
        WHEEL_CACHE_HIT: ${{ steps.wheel-cache.outputs.cache-hit }}
      run: |
        dir="$HOME/.cache/nabou-wheels"
        pkgs=('llama-cpp-python==0.3.16' 'huggingface-hub==0.36.0')
        index=(--extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu)
        if [ "$WHEEL_CACHE_HIT" = "true" ] && python3 -m pip install --quiet --no-index --find-links "$dir" "${pkgs[@]}"; then
          echo "CPU_INFERENCE_WHEELS_FROM_CACHE"
          exit 0
        fi
        rm -rf "$dir"; mkdir -p "$dir"
        if python3 -m pip wheel --quiet --wheel-dir "$dir" "${index[@]}" "${pkgs[@]}" \
           && python3 -m pip install --quiet --no-index --find-links "$dir" "${pkgs[@]}"; then
          echo "save=true" >> "$GITHUB_OUTPUT"
          echo "CPU_INFERENCE_WHEELS_BUILT"
        else
          echo "CPU_INFERENCE_WHEEL_CACHE_UNAVAILABLE: original install"
          rm -rf "$dir"
          python3 -m pip install --quiet 'llama-cpp-python==0.3.16' --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu 'huggingface-hub==0.36.0'
        fi
    - uses: actions/cache/save@v4
      if: env.PCT_LLM_PROVIDER == 'local_llama_cpp' && steps.wheel-install.outputs.save == 'true'
      continue-on-error: true
      with:
        path: ~/.cache/nabou-wheels
        key: ${{ steps.wheel-key.outputs.key }}
    - name: Verify every model shard against the official immutable revision
      if: env.PCT_LLM_PROVIDER == 'local_llama_cpp'
      shell: bash
      run: python3 tools/prepare_local_research_model.py --destination "$NABOU_MODEL_CACHE_DIR"
    - uses: actions/cache/save@v4
      if: env.PCT_LLM_PROVIDER == 'local_llama_cpp' && steps.model-cache.outputs.cache-hit != 'true'
      with:
        path: ${{ env.NABOU_MODEL_CACHE_DIR }}
        key: ${{ env.NABOU_MODEL_CACHE_KEY }}
    # Local multilingual embeddings for hybrid retrieval (tools/local_embeddings.py):
    # multilingual-e5-small, ONNX int8, ~135 MB, CPU, pinned revision + SHA-256.
    # Any failure here only means hybrid retrieval falls back to char n-grams.
    - uses: actions/cache/restore@v4
      id: embed-cache
      continue-on-error: true
      with:
        path: ~/.cache/nabou-models/multilingual-e5-small
        key: nabou-embed-multilingual-e5-small-onnx-int8-761b726d-v1
    - name: Prepare the local multilingual embedding model (fallback-safe)
      id: embed-model
      continue-on-error: true
      shell: bash
      run: |
        dir="$HOME/.cache/nabou-models/multilingual-e5-small"
        python3 -m pip install --quiet 'onnxruntime>=1.18,<2' 'tokenizers>=0.19,<1'
        python3 tools/local_embeddings.py --download "$dir"
        echo "PCT_EMBED_MODEL_DIR=$dir" >> "$GITHUB_ENV"
    - uses: actions/cache/save@v4
      if: steps.embed-model.outcome == 'success' && steps.embed-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      with:
        path: ~/.cache/nabou-models/multilingual-e5-small
        key: nabou-embed-multilingual-e5-small-onnx-int8-761b726d-v1
