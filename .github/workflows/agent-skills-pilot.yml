name: Agent Skills Pilot Tests
on:
  push:
    paths:
      - 'tools/agent_skills/**'
      - 'tests/test_agent_skills.py'
      - '.github/workflows/agent-skills-pilot.yml'
  pull_request:
    paths:
      - 'tools/agent_skills/**'
      - 'tests/test_agent_skills.py'
      - '.github/workflows/agent-skills-pilot.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_agent_skills.py' -v
