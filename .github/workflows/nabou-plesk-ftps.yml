name: NABOU Plesk FTPS deployment
on:
  push:
    branches: [main]
    paths: ['ops_ftps_requests/nabou-existing-host.json']
  pull_request:
    paths:
      - '.github/workflows/nabou-plesk-ftps.yml'
      - 'tools/gateway/deploy_ftps.py'
      - 'server/command-center-live/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose diagnosis (read-only) or deployment'
        required: true
        type: choice
        options:
          - diagnose
          - deploy
        default: diagnose
      confirm:
        description: 'Type DEPLOY-NABOU to authorize production backend-only deployment'
        required: true
        type: string
      payload:
        description: 'Backend files, or explicitly requested existing host-local evidence storage'
        type: choice
        options: [backend, evidence_storage]
        default: backend
      storage_confirmation:
        description: 'For storage only: INSTALL-EXISTING-EVIDENCE-SCHEMA'
        type: string
        required: false
      replay_runs:
        description: 'Optional numeric existing run IDs, comma-separated'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: nabou-production-ftps
  cancel-in-progress: false

jobs:
  validate:
    outputs:
      authorized_push: ${{ steps.request.outputs.authorized }}
      tls_server_name: ${{ steps.request.outputs.tls_server_name }}
      payload: ${{ steps.request.outputs.payload }}
      storage_confirmation: ${{ steps.request.outputs.storage_confirmation }}
      replay_runs: ${{ steps.request.outputs.replay_runs }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit existing-host deployment request
        id: request
        if: github.event_name == 'push'
        run: |
          python3 - <<'PYREQUEST'
          import json,os,re
          from pathlib import Path
          request=json.loads(Path('ops_ftps_requests/nabou-existing-host.json').read_text())
          assert request.get('schema')=='nabou-existing-ftps-deployment-request-v1'
          assert request.get('mode')=='deploy'
          assert request.get('application')=='server/command-center-live'
          assert request.get('backend_only') is True
          assert request.get('confirmation')=='DEPLOY-NABOU'
          name=request.get('tls_server_name','')
          assert isinstance(name,str) and len(name)<=253
          assert not name or re.fullmatch(r'[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?',name)
          payload=request.get('payload','backend')
          assert payload in ('backend','evidence_storage')
          confirmation=request.get('storage_confirmation','')
          assert confirmation in ('','INSTALL-EXISTING-EVIDENCE-SCHEMA')
          if payload=='evidence_storage':assert confirmation=='INSTALL-EXISTING-EVIDENCE-SCHEMA'
          runs=request.get('replay_runs',[])
          assert isinstance(runs,list) and len(runs)<=10
          assert all(isinstance(run,str) and re.fullmatch(r'\d+',run) for run in runs)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('authorized=true\n')
              out.write('tls_server_name='+name+'\n')
              out.write('payload='+payload+'\n')
              out.write('storage_confirmation='+confirmation+'\n')
              out.write('replay_runs='+','.join(runs)+'\n')
          PYREQUEST
      - name: Check backend syntax and tests (no credentials, no deployment)
        run: |
          set -euo pipefail
          node --check server/command-center-live/app.js
          node --check server/command-center-live/historical-evidence.js
          node --check server/command-center-live/pdf-evidence.js
          python3 -m py_compile server/command-center-live/pdf-evidence.py tools/gateway/deploy_ftps.py
          node server/command-center-live/self-test.js
          php -l tools/storage/historical_evidence.php
          php -l tools/storage/evidence_schema_request.php
          php -l tools/storage/pct_research_store.php
  diagnose:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose' }}
    runs-on: ubuntu-latest
    environment: nabou-production
    timeout-minutes: 5
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose FTPS directories (read-only)
        run: python3 tools/gateway/diagnose_ftps.py
  deploy:
    permissions:
      contents: write
      id-token: write
    needs: validate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy' && inputs.confirm == 'DEPLOY-NABOU') || (github.event_name == 'push' && needs.validate.outputs.authorized_push == 'true') }}
    runs-on: ubuntu-latest
    environment: nabou-production
    timeout-minutes: 12
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
      PCT_FTPS_APP_ROOT: /piratecartography-gateway/server/command-center-live
      PCT_FTPS_TLS_SERVER_NAME: ${{ needs.validate.outputs.tls_server_name || vars.PCT_FTPS_TLS_SERVER_NAME }}
      PCT_FTPS_PAYLOAD: ${{ needs.validate.outputs.payload || inputs.payload || 'backend' }}
      PCT_FTPS_STORAGE_CONFIRMATION: ${{ needs.validate.outputs.storage_confirmation || inputs.storage_confirmation }}
      PCT_EVIDENCE_REPLAY_RUNS: ${{ needs.validate.outputs.replay_runs || inputs.replay_runs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate configuration and code
        shell: bash
        run: |
          set -euo pipefail
          node --check server/command-center-live/app.js
          node --check server/command-center-live/historical-evidence.js
          node --check server/command-center-live/pdf-evidence.js
          python3 -m py_compile server/command-center-live/pdf-evidence.py tools/gateway/deploy_ftps.py
          node server/command-center-live/self-test.js
      - name: Deploy backend files through verified FTPS and record outcome
        run: python3 tools/gateway/run_ftps_deployment.py
      - name: Verify actual production HTTP and OIDC after deployment
        run: python3 tools/probe_evidence_production.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-ftps-deployment-and-http-outcome
          path: |
            evidence/production_ftps/${{ github.run_id }}/
            evidence/production_smoke/${{ github.run_id }}/
      - name: Persist actual deployment outcome without credential values
        if: always()
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in "evidence/production_ftps/$GITHUB_RUN_ID" "evidence/production_smoke/$GITHUB_RUN_ID"; do
            if [ -d "$path" ]; then git add "$path"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m 'Record actual existing-host FTPS deployment and production probes'
          python3 tools/publish_research_outputs.py
