name: N7 existing TopHost connection audit (read only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n7-existing-tophost-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    environment: nabou-production
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
      PCT_FTPS_TLS_SERVER_NAME: linux3087.grserver.gr
      PCT_GITHUB_DISPATCH_TOKEN: ${{ secrets.PCT_GITHUB_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            server/command-center-live/n7-gateway.js
      - name: FTPS directory readback and TLS web probes - no writes
        shell: bash
        run: |
          python3 - <<'PY'
          import ftplib,ssl,os,socket,json,posixpath,hashlib,urllib.request,urllib.error
          from pathlib import Path
          host=os.environ.get('PCT_FTPS_HOST','')
          user=os.environ.get('PCT_FTPS_USER','')
          pwd=os.environ.get('PCT_FTPS_PASSWORD','')
          tls=os.environ.get('PCT_FTPS_TLS_SERVER_NAME','')
          port=int(os.environ.get('PCT_FTPS_PORT','21'))
          if not all((host,user,pwd,tls)): raise SystemExit('PCT_FTPS_CREDENTIALS_MISSING')
          a={x[4][0] for x in socket.getaddrinfo(host,port,type=socket.SOCK_STREAM)}
          b={x[4][0] for x in socket.getaddrinfo(tls,port,type=socket.SOCK_STREAM)}
          if not a.intersection(b): raise SystemExit('FTPS_TLS_NAME_MISMATCH')
          ftp=ftplib.FTP_TLS(timeout=20,context=ssl.create_default_context())
          try:
            ftp.connect(host,port);ftp.host=tls;ftp.login(user,pwd);ftp.prot_p()
            print('PCT_FTPS_EXISTING_CONNECTION=PASS')
            for directory in ('/bot.piratecartography.com','/piratecartography-gateway/server/command-center-live'):
              try:
                ftp.cwd(directory)
                names={posixpath.basename(x.rstrip('/')) for x in ftp.nlst()}
                allow={'index.html','server.js','app.js','n7-gateway.js','n7-oauth.js','package.json','.htaccess','tmp','node_modules','public','agents.html','web.config','passenger.js','passenger_wsgi.py'}
                row={'directory':directory,'accessible':True,'recognized_entries':sorted(names&allow)}
                if directory=='/bot.piratecartography.com' and 'index.html' in names:
                  parts=[]
                  ftp.retrbinary('RETR index.html',parts.append)
                  raw=b''.join(parts)
                  row.update(index_bytes=len(raw),n7_agent_room=b'// AGENT ROOM' in raw,
                             index_sha256=hashlib.sha256(raw).hexdigest())
                if directory.endswith('command-center-live'):
                  for target,key in (('app.js','app_matches_current_main'),('n7-gateway.js','gateway_matches_current_main'),('n7-oauth.js','oauth_matches_current_main')):
                    if target in names:
                      parts=[]; ftp.retrbinary('RETR '+target,parts.append)
                      deployed=hashlib.sha256(b''.join(parts)).hexdigest()
                      source=Path('server/command-center-live',target).read_bytes()
                      row[key]=deployed==hashlib.sha256(source).hexdigest()
                    else:row[key]=False
                print('FTPS_READONLY '+json.dumps(row,sort_keys=True))
              except ftplib.all_errors as e:
                print('FTPS_READONLY '+json.dumps({'directory':directory,'accessible':False,'error_type':type(e).__name__}))
          finally:
            try: ftp.quit()
            except Exception: pass
          def probe(url):
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'N7-readonly-host-audit/1'})
              with urllib.request.urlopen(request,timeout=12,context=ssl.create_default_context()) as response:
                body=response.read(120000)
                info={'url':url,'http_status':response.status,'tls_valid':True}
                if url.endswith('/n7/status'):
                  try:
                    obj=json.loads(body)
                    info.update(gateway_schema=obj.get('schema'),connected=obj.get('connected'),state=obj.get('state'))
                  except (ValueError,TypeError):info['response_type']='not_json'
                else:info['agent_room_marker']=b'AGENT ROOM' in body
                print('HTTPS_READONLY '+json.dumps(info,sort_keys=True))
            except urllib.error.HTTPError as e:
              print('HTTPS_READONLY '+json.dumps({'url':url,'http_status':e.code,'tls_valid':True}))
            except Exception as e:
              print('HTTPS_READONLY '+json.dumps({'url':url,'error_type':type(e).__name__}))
          probe('https://bot.piratecartography.com/')
          probe('https://bot.piratecartography.com/health')
          probe('https://pct-live.piratecartography.com/pct-api/live/n7/status')
          token=os.environ.get('PCT_GITHUB_DISPATCH_TOKEN','')
          if not token:
            print('CROSS_REPO_PRIVATE_READ_TOKEN=NOT_CONFIGURED')
          else:
            req=urllib.request.Request('https://api.github.com/repos/Lepe12/independent-ai-bot',
              headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'N7-readonly-host-audit/1'})
            try:
              with urllib.request.urlopen(req,timeout=12) as res:
                print('CROSS_REPO_PRIVATE_READ_TOKEN='+('PASS' if res.status==200 else 'HTTP_'+str(res.status)))
            except urllib.error.HTTPError as err:
              print('CROSS_REPO_PRIVATE_READ_TOKEN=HTTP_'+str(err.code))
            except Exception as e:
              print('CROSS_REPO_PRIVATE_READ_TOKEN='+type(e).__name__)
          PY
