name: Real acquired-source semantic reanalysis
on:
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
      resume_reviewed_claims:
        type: boolean
        default: false
      auto_continue:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
        description: Existing research run whose actual acquired sources will be reanalysed
      resume_reviewed_claims:
        type: boolean
        default: false
        description: Replay existing extraction receipts, then run new reviews and synthesis
      auto_continue:
        type: boolean
        default: true
        description: false = run exactly one pass; no follow-up dispatch and the hourly coordinator holds this corpus
permissions:
  contents: write
  actions: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    name: Reanalyse actual sources ${{ matrix.parent_run }}
    timeout-minutes: 60
    concurrency:
      group: research-parent-${{ matrix.parent_run }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        parent_run: ${{ fromJSON(inputs.run_id && format('["{0}"]', inputs.run_id) || '["39477358672"]') }}
    env:
      PARENT_RESEARCH_RUN: ${{ matrix.parent_run }}
      PCT_LLM_PROVIDER: local_llama_cpp
      PCT_LOCAL_MODEL_REPOSITORY: Qwen/Qwen3-8B-GGUF
      PCT_LLM_MODEL: Qwen/Qwen3-8B-GGUF
      PCT_RESUME_REVIEWED_CLAIMS: ${{ inputs.resume_reviewed_claims && '1' || '0' }}
      PCT_AUTO_CONTINUE: ${{ inputs.auto_continue == false && 'false' || 'true' }}
      PCT_SEMANTIC_BATCHES: '3'
      PCT_SEMANTIC_PARTIAL_ANSWER: '1'
      PCT_SEMANTIC_CALLS_PER_PASS: '48'
      PCT_SEMANTIC_BUDGET_SECONDS: '1800'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture only this research checkpoint before work
        id: baseline
        run: python3 tools/research_continuation_handoff.py baseline --run-id "$PARENT_RESEARCH_RUN"
      - uses: ./.github/actions/research-model
      - name: Install the existing public PDF reader
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Check actual llama.cpp stage schema grammars
        run: |
          PYTHONPATH=tools python3 - <<'PYSCHEMA'
          import json
          from llama_cpp import LlamaGrammar
          from research_response_schema import extraction, review, synthesis, final_review
          for schema in (extraction(['e-test']),review(2),synthesis(['c-test']),final_review(2)):
              LlamaGrammar.from_json_schema(json.dumps(schema),verbose=False)
          print('ACTUAL_LLAMA_CPP_SCHEMA_GRAMMARS_PASS; NOT_HISTORICAL_RESEARCH_ACCEPTANCE')
          PYSCHEMA
      - name: Continue retained bibliography in separate workspaces
        timeout-minutes: 20
        run: python3 tools/continue_citation_acquisition.py --run-id "$PARENT_RESEARCH_RUN"
      - name: Derive PDF reading order and run all real semantic stages
        run: |
          if [ "$PCT_RESUME_REVIEWED_CLAIMS" = 1 ]; then
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools python3 tools/reanalyse_acquired_research.py --run-id "$PARENT_RESEARCH_RUN" --resume-reviewed-claims
          else
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools python3 tools/reanalyse_acquired_research.py --run-id "$PARENT_RESEARCH_RUN"
          fi
      - name: Publish the actual continuation status to the existing snapshot
        if: always()
        run: |
          python3 tools/orchestrator/build_command_center_snapshot.py --run-id "$PARENT_RESEARCH_RUN" --output "command-center/live/runs/$PARENT_RESEARCH_RUN.json" --latest command-center/live/latest.json
      - name: Store derived inputs once by SHA-256 (idempotent)
        if: always()
        run: python3 tools/derived_source_store.py compact --run-id "$PARENT_RESEARCH_RUN" --pass "semantic_reanalysis_$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-reanalysis-${{ matrix.parent_run }}
          path: |
            evidence/runs/${{ env.PARENT_RESEARCH_RUN }}/semantic_reanalysis_${{ github.run_id }}/
            evidence/runs/${{ env.PARENT_RESEARCH_RUN }}/research_continuation/
            evidence/runs/${{ env.PARENT_RESEARCH_RUN }}/citation_continuation_*/
      - name: Persist actual outcome including failures
        if: always()
        run: |
          set -e
          dest="evidence/runs/$PARENT_RESEARCH_RUN/semantic_reanalysis_$GITHUB_RUN_ID"
          if [ ! -d "evidence/runs/$PARENT_RESEARCH_RUN" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # auto_continue=false holds this corpus out of every automatic chain
          # (research_continuation_handoff.select); only an explicit dispatch
          # with auto_continue=true releases an existing hold.
          hold="evidence/runs/$PARENT_RESEARCH_RUN/research_continuation/auto_continue.json"
          if [ "$PCT_AUTO_CONTINUE" = false ] || [ -e "$hold" ]; then
            mkdir -p "$(dirname "$hold")"
            printf '{"auto_continue": %s, "set_by_run": "%s"}\n' "$PCT_AUTO_CONTINUE" "$GITHUB_RUN_ID" > "$hold"
          fi
          for output in "$dest" "evidence/runs/$PARENT_RESEARCH_RUN/sources" "evidence/runs/$PARENT_RESEARCH_RUN/research_continuation" "command-center/live/runs/$PARENT_RESEARCH_RUN.json" command-center/live/index.json command-center/live/latest.json; do
            if [ -e "$output" ]; then git add "$output"; fi
          done
          git add "evidence/runs/$PARENT_RESEARCH_RUN"/citation_continuation_* 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record actual semantic reanalysis with replayed source passages'
          python3 tools/publish_research_outputs.py
      - name: Check this published checkpoint independently
        id: checkpoint
        if: always() && steps.baseline.outcome == 'success'
        env:
          BASELINE: ${{ steps.baseline.outputs.baseline }}
        run: |
          git fetch origin main
          git restore --source=origin/main -- "evidence/runs/$PARENT_RESEARCH_RUN"
          python3 tools/research_continuation_handoff.py handoff --baseline "$BASELINE"
      - name: Continue this research without waiting for another
        if: always() && steps.checkpoint.outputs.restart == 'true' && env.PCT_AUTO_CONTINUE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run research-semantic-reanalysis.yml --repo "$GITHUB_REPOSITORY" --ref main -f "run_id=$PARENT_RESEARCH_RUN"

