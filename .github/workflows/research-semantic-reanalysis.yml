name: Real acquired-source semantic reanalysis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/research-semantic-reanalysis.yml']
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
        description: Existing research run whose actual acquired sources will be reanalysed
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PARENT_RESEARCH_RUN: ${{ inputs.run_id || '39304929906' }}
      PCT_LLM_PROVIDER: local_llama_cpp
      PCT_LOCAL_MODEL_REPOSITORY: Qwen/Qwen2.5-7B-Instruct-GGUF
      PCT_LLM_MODEL: Qwen/Qwen2.5-7B-Instruct-GGUF
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache/restore@v4
        id: model-cache
        with:
          path: ~/.cache/nabou-models/qwen2.5-7b
          key: nabou-official-qwen2.5-7b-q4km-bb5d59e0-v2
      - name: Prepare real CPU inference
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          set -e
          python3 -m pip install --quiet 'llama-cpp-python==0.3.16' --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu 'huggingface-hub==0.36.0'
          python3 tools/prepare_local_research_model.py --destination "$HOME/.cache/nabou-models/qwen2.5-7b"
      - name: Retry actual Kapsis extraction with bounded schema repair and complete review
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools python3 tools/reanalyse_acquired_research.py --run-id "$PARENT_RESEARCH_RUN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-reanalysis
          path: evidence/runs/${{ env.PARENT_RESEARCH_RUN }}/semantic_reanalysis_${{ github.run_id }}/
      - name: Persist actual outcome including failures
        if: always()
        run: |
          set -e
          dest="evidence/runs/$PARENT_RESEARCH_RUN/semantic_reanalysis_$GITHUB_RUN_ID"
          if [ ! -d "$dest" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          git commit -m 'Record actual semantic reanalysis with replayed source passages'
          python3 tools/publish_research_outputs.py
      - name: Retain verified open weights even when research remains incomplete
        if: always() && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/nabou-models/qwen2.5-7b
          key: nabou-official-qwen2.5-7b-q4km-bb5d59e0-v2
