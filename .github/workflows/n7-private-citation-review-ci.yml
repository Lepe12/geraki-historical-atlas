name: N7 private citation replay and reviewer regression
on:
  pull_request:
    paths:
      - 'tools/semantic_research_answer.py'
      - 'tools/n7_private_corpus_store.py'
      - 'tools/test_n7_private_citation_review.py'
      - '.github/workflows/n7-private-citation-review-ci.yml'
      - '.github/workflows/n7-private-review-second-pass.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  citation-and-privacy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools
      - name: Compile all private review modules
        run: |
          python3 -m py_compile tools/n7_private_corpus_store.py tools/semantic_research_answer.py tools/test_n7_private_citation_review.py
          node --check tools/n7_private_aead.js
      - name: Test exact source binding, unchanged citation, all-review status and baseline research
        env:
          PYTHONPATH: tools
          PCT_LLM_PROVIDER: disabled
        run: |
          set -euo pipefail
          python3 -m unittest tools/test_n7_private_citation_review.py -v
          python3 -m unittest tools/test_n7_private_corpus.py -v
          python3 -m unittest tools/test_semantic_research_answer.py -v
