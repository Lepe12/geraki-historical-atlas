name: N7 library indexed-page counts
on:
  pull_request:
    paths:
      - 'tools/library/n7_library.php'
      - 'server/command-center-live/n7-gateway.js'
      - 'tools/library/n7-bot-autologin-ui.js'
      - 'tools/library/deploy_library_counts_ftps.py'
  push:
    branches: [main]
    paths:
      - 'ops_ftps_requests/n7-library-index-counts.json'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            server/command-center-live
            tools/library
            ops_ftps_requests
      - name: Verify all scripts and tests
        run: |
          php -l tools/library/n7_library.php
          node --check server/command-center-live/n7-gateway.js
          node --test server/command-center-live/n7-gateway.test.js
          node --check tools/library/n7-bot-autologin-ui.js
          python3 -m py_compile tools/library/deploy_library_counts_ftps.py
  deploy:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: nabou-production
    timeout-minutes: 9
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
      PCT_FTPS_TLS_SERVER_NAME: ${{ vars.PCT_FTPS_TLS_SERVER_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            server/command-center-live
            tools/library
            ops_ftps_requests
      - name: Confirm narrow library index operation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('ops_ftps_requests/n7-library-index-counts.json').read_text())
          assert j['authorization']=='INSTALL-LIBRARY-COUNTS'
          assert j['scope']=='read-only-count-reporting'
          PY
      - name: Upgrade N7 index reporting on Top.Host
        run: python3 tools/library/deploy_library_counts_ftps.py
      - name: Check both apps survived installation
        run: |
          python3 - <<'PY'
          import urllib.request
          for url in ["https://bot.piratecartography.com/health","https://pct-live.piratecartography.com/pct-api/live/health","https://bot.piratecartography.com/historical-library.js"]:
              with urllib.request.urlopen(url,timeout=20) as r:assert r.status==200
          print('PRODUCTION_HEALTH_PASS')
          PY
