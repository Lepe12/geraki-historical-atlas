name: NABOU v0.2 — real multi-file Qwen trial (review only)

# One-off diagnostic: run manually only to avoid repeated model downloads on pushes.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  live-trial:
    if: github.repository == 'Lepe12/geraki-historical-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PCT_LLM_PROVIDER: local_llama_cpp
      PCT_LOCAL_MODEL_REPOSITORY: Qwen/Qwen2.5-3B-Instruct-GGUF
      TARGET_FILES: 'jarvis-intelligence-chamber/navigation-rail.css,jarvis-intelligence-chamber/photon-windows.css'
      TASK: >-
        Implement a tiny, safe, two-file accessibility update for high-contrast Windows
        users. In navigation-rail.css add a forced-colors:active media query that makes
        .nabou-rail-item:focus-visible show an outline using the system Highlight color.
        In photon-windows.css add a forced-colors:active media query for
        .nx-workspace .nx-dock button:focus-visible with a visible system Highlight
        outline. Do not modify the existing styles or 3D safety lock, and do not change
        any other file. Return small exact old/new replacement edits for each file.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            tools
            .github/actions
            jarvis-intelligence-chamber
      - name: Test multi-file transaction logic
        run: PYTHONPATH=tools python3 -m unittest -q tools.test_nabou_coding_agent tools.test_nabou_coding_task
      - name: Prepare pinned local Qwen
        uses: ./.github/actions/research-model
      - name: Run REAL multi-file AI task and validate as one transaction
        run: |
          python3 tools/nabou_coding_task.py \
            --repo . --files "$TARGET_FILES" --task "$TASK" \
            --apply --report agent_task_result.json
      - name: Verify exact scope and focused intent
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess
          expected={x.strip() for x in os.environ["TARGET_FILES"].split(",")}
          changed=set(subprocess.check_output(["git","diff","--name-only"]).decode().splitlines())
          if changed != expected:
              raise SystemExit("unexpected diff scope: "+str(changed^expected))
          for name in expected:
              content=Path(name).read_text(encoding="utf-8")
              if "forced-colors" not in content or "Highlight" not in content:
                  raise SystemExit("high contrast intent not satisfied: "+name)
          print("Verified two reviewed frontend CSS changes")
          PY
          git diff --check
          PYTHONPATH=tools python3 -m unittest -q tools.test_nabou_coding_agent tools.test_nabou_coding_task
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabou-multifile-ai-live-${{ github.run_id }}
          path: |
            agent_task_result.json
            agent_task_preview.patch
          if-no-files-found: warn
      - name: Create isolated review branch (never merge or deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="agent/nabou-multifile-trial-${GITHUB_RUN_ID}"
          git config user.name "nabou-coding-agent[bot]"
          git config user.email "nabou-coding-agent[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- jarvis-intelligence-chamber/navigation-rail.css jarvis-intelligence-chamber/photon-windows.css
          git commit -m "a11y(agent): review high-contrast keyboard focus rules"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $basic" push origin "HEAD:refs/heads/$branch"
          echo "Review branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          gh pr create --draft --base feat/nabou-coding-agent-multifile-20261103 --head "$branch" \
            --title "AI trial: coordinated keyboard-focus CSS accessibility" \
            --body "Generated by our local Qwen coding agent as a two-file development task. Both files were validated and committed to an isolated branch. Requires human/browser review; **no production merge or deployment**. Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
