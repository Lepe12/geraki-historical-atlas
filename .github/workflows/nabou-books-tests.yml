name: NABOU Book Ingestion Tests
on:
  pull_request:
    paths:
      - 'tools/books/**'
      - '.github/workflows/nabou-books-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Book ingestion unit tests
        run: python -m unittest discover -s tools/books -p 'test_*.py' -v
