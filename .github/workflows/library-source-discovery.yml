name: Autonomous Library Source Discovery
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Research target (place, person, event, institution)"
        required: true
        type: string
      aliases:
        description: "Known/historically supported aliases separated by |"
        required: false
        type: string
      date_range:
        description: "Date range, e.g. 1600-1700"
        required: false
        type: string
      purpose:
        description: "Research question / scope"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'library_discovery_requests/*.json'

permissions:
  contents: read

env:
  PCT_TARGET: ${{ inputs.target }}
  PCT_ALIASES: ${{ inputs.aliases }}
  PCT_DATE_RANGE: ${{ inputs.date_range }}
  PCT_PURPOSE: ${{ inputs.purpose }}

jobs:
  library-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEARCHCULTURE_API_KEY: ${{ secrets.SEARCHCULTURE_API_KEY }}
    outputs:
      bundle_ready: ${{ steps.bundle_upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Compile Python research code
        run: python3 -m compileall -q tools
      - name: Resolve and pin research request
        run: |
          python3 tools/request_identity.py
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open("research_request_identity.json",encoding="utf-8"))
          print("PCT_REQUEST_FILE="+d["request_file"])
          print("PCT_EXPECTED_REQUEST_SHA256="+d["request_sha256"])
          print("PCT_RESEARCH_JOB_ID="+d["research_job_id"])
          PY
          python3 tools/request_identity.py
          python3 tools/run_manifest.py
      - name: Query digitized library catalogue
        run: python3 tools/library_source_discovery.py
      - name: Route strong candidates to Citation Chase
        run: python3 tools/route_library_candidates.py
      - name: Acquire routed digital originals
        run: python3 tools/acquire_library_candidate.py
      - name: Search acquired OCR for Citation Chase targets
        run: python3 tools/search_acquired_ocr.py
      - name: General EVENT-FIRST research search
        run: python3 tools/event_first_search.py
      - name: Map hits and acquire exact scanned pages
        run: python3 tools/exact_page_acquire.py
      - name: Revalidate pinned request after research
        run: |
          python3 tools/request_identity.py
          python3 tools/verification_pipeline.py
          python3 tools/build_research_dossier.py
      - name: Upload catalogue candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-source-candidates-${{ github.run_id }}
          path: |
            research_request_identity.json
            library_discovery/
            citation_chase_candidates/
            library_acquisition/
            citation_chase_hits/
            event_first_hits/
            exact_page_acquisition/
            original_inspection/
            source_genealogy/
            corroboration/
            human_review/
            verification/
            qa/
            structured_output/
            research_dossier/
            run_manifest/
          if-no-files-found: warn
      - name: Prepare isolated database import bundle
        id: prepare_bundle
        if: always()
        run: python3 tools/storage/prepare_library_bundle.py
      - name: Upload normalized results for isolated writer
        id: bundle_upload
        if: always() && steps.prepare_bundle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: library-import-bundle-${{ github.run_id }}
          path: outbound_library_results/
          if-no-files-found: error
          retention-days: 7

  persist-library-results:
    needs: library-discovery
    if: always() && github.repository == 'Lepe12/geraki-historical-atlas' && needs.library-discovery.outputs.bundle_ready != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: library-import-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/library-import-bundle
      - name: Publish only this run's library evidence
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_DIR: ${{ runner.temp }}/library-import-bundle
        run: python3 tools/storage/publish_library_results.py --bundle "$BUNDLE_DIR"
