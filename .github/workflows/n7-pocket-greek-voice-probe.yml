name: N7 native Greek Pocket TTS independent CPU probe
on:
  pull_request:
    paths:
      - 'tools/n7_apex_preview/probe_pocket_greek.py'
      - '.github/workflows/n7-pocket-greek-voice-probe.yml'
permissions:
  contents: read
jobs:
  native-greek-tts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/n7_apex_preview/probe_pocket_greek.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU voice model runtime
        run: python -m pip install --disable-pip-version-check --no-input pocket-tts numpy
      - name: Generate Greek speech across three native voices with real audio checks
        env:
          CUDA_VISIBLE_DEVICES: ''
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python tools/n7_apex_preview/probe_pocket_greek.py
