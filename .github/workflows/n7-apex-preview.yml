name: N7 APEX authentic preview — verify and deploy
on:
  pull_request:
    paths:
      - 'tools/n7_apex_preview/**'
      - 'tools/n7_apex_preview/build_apex_preview.py'
      - 'tools/n7_apex_preview/deploy_apex_preview.py'
      - '.github/workflows/n7-apex-preview.yml'
      - 'ops_ftps_requests/n7-apex-preview.json'
  push:
    branches: [main]
    paths:
      - 'tools/n7_apex_preview/**'
      - '.github/workflows/n7-apex-preview.yml'
      - 'ops_ftps_requests/n7-apex-preview.json'
permissions:
  contents: read
concurrency:
  group: n7-apex-preview-deploy
  cancel-in-progress: true
jobs:
  validate:
    environment: nabou-production
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
      N7_DRY_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/n7_apex_preview
            tools/n7_apex_preview/build_apex_preview.py
            tools/n7_apex_preview/deploy_apex_preview.py
            ops_ftps_requests/n7-apex-preview.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact upstream APEX source with reviewed N7 overlay
        run: python3 tools/n7_apex_preview/build_apex_preview.py --out "$RUNNER_TEMP/n7-apex-src"
      - name: Build static /n7-apex export
        run: |
          cd "$RUNNER_TEMP/n7-apex-src"
          npm ci
          npm run build
          test -s out/index.html
          test -d out/_next
      - name: Browser-render built preview
        run: |
          npm install --prefix "$RUNNER_TEMP/n7-apex-browser" --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 pngjs@7.0.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/n7-apex-http/n7-apex"
          cp -a "$RUNNER_TEMP/n7-apex-src/out/." "$RUNNER_TEMP/n7-apex-http/n7-apex/"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/n7-apex-http" >"$RUNNER_TEMP/n7-apex-http.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/n7-apex-browser/node_modules" node - <<'NODE'
          const { chromium }=require('playwright-core');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await b.newPage({viewport:{width:1440,height:900}});
            const errors=[]; const failed=[];
            p.on('pageerror',e=>errors.push(String(e)));
            p.on('requestfailed',r=>failed.push(r.url()+': '+(r.failure()?.errorText||'failed')));
            const r=await p.goto('http://127.0.0.1:4173/n7-apex/',{waitUntil:'networkidle'});
            if(!r||!r.ok()) throw Error('preview HTTP failed');
            const text=await p.locator('body').innerText();
            if(!text.includes('N7')) throw Error('N7 branding missing');
            const button=p.getByRole('button',{name:'HUMANOID'});
            await button.waitFor({state:'visible'});
            await button.click();
            await p.getByRole('dialog',{name:'N7 Humanoid preview'}).waitFor({state:'visible'});
            await p.getByLabel('N7 image-sampled particle humanoid').locator('canvas').waitFor({state:'visible'});
            await p.getByRole('button',{name:'Original',exact:true}).click();
            await p.getByRole('img',{name:'Approved N7 idle reference'}).waitFor({state:'visible'});
            await p.getByRole('button',{name:'Particles',exact:true}).click();
            const canvas=p.getByLabel('N7 image-sampled particle humanoid').locator('canvas');
            await canvas.waitFor({state:'visible'});
            const box=await canvas.boundingBox();
            if(!box||box.width<200||box.height<300) throw Error('particle canvas has invalid size');
            await p.getByRole('button',{name:'Compare',exact:true}).click();
            await p.getByText(/PARTICLE RECONSTRUCTION/).waitFor({state:'visible'});

            // Guide Step 3: same fixed dots, mood colors bloom from the face.
            await p.getByRole('button',{name:'Idle',exact:true}).click();
            await p.getByRole('button',{name:'Particles',exact:true}).click();
            const moodCanvas=p.getByLabel('N7 mood particle overlay').locator('canvas');
            await moodCanvas.waitFor({state:'visible'});
            const {PNG}=require('pngjs');
            const fs=require('fs');
            async function moodShot(name){
              await p.waitForTimeout(1150);
              const path=process.env.RUNNER_TEMP+'/n7-mood-'+name+'.png';
              await moodCanvas.screenshot({path});
              return PNG.sync.read(fs.readFileSync(path));
            }
            function diffPixels(a,b){
              if(a.width!==b.width||a.height!==b.height) throw Error('mood canvas dimensions changed');
              let diff=0;
              for(let i=0;i<a.data.length;i+=4){
                const d=Math.abs(a.data[i]-b.data[i])+Math.abs(a.data[i+1]-b.data[i+1])+Math.abs(a.data[i+2]-b.data[i+2])+Math.abs(a.data[i+3]-b.data[i+3]);
                if(d>35) diff++;
              }
              return diff;
            }
            const idleMood=await moodShot('idle');
            await p.getByRole('button',{name:'Listening',exact:true}).click();
            await p.getByText(/MOOD · LISTENING/).waitFor({state:'visible'});
            const listeningMood=await moodShot('listening');
            await p.getByRole('button',{name:'Thinking',exact:true}).click();
            await p.getByText(/MOOD · THINKING/).waitFor({state:'visible'});
            const thinkingMood=await moodShot('thinking');
            await p.getByRole('button',{name:'Speaking',exact:true}).click();
            await p.getByText(/MOOD · SPEAKING/).waitFor({state:'visible'});
            const speakingMood=await moodShot('speaking');
            if(diffPixels(idleMood,listeningMood)<120) throw Error('Listening mood is not visibly distinct');
            if(diffPixels(listeningMood,thinkingMood)<120) throw Error('Thinking mood is not visibly distinct');
            if(diffPixels(thinkingMood,speakingMood)<120) throw Error('Speaking mood is not visibly distinct');
            await p.getByRole('button',{name:'Idle',exact:true}).click();

            // Guide Step 5: mouse-follow must move only the head and return smoothly to neutral.
            await p.getByRole('button',{name:'Particles',exact:true}).click();
            const dialog=p.getByRole('dialog',{name:'N7 Humanoid preview'});
            const dialogBox=await dialog.boundingBox();
            if(!dialogBox) throw Error('humanoid dialog has no bounds');
            async function particleShot(name){
              const path=process.env.RUNNER_TEMP+'/n7-head-'+name+'.png';
              await canvas.screenshot({path});
              return PNG.sync.read(fs.readFileSync(path));
            }
            function regionDiff(a,b,y0,y1){
              if(a.width!==b.width||a.height!==b.height) throw Error('head-turn canvas dimensions changed');
              let diff=0;
              const ys=Math.max(0,Math.floor(a.height*y0));
              const ye=Math.min(a.height,Math.floor(a.height*y1));
              for(let y=ys;y<ye;y++) for(let x=0;x<a.width;x++){
                const i=(y*a.width+x)*4;
                const d=Math.abs(a.data[i]-b.data[i])+Math.abs(a.data[i+1]-b.data[i+1])+Math.abs(a.data[i+2]-b.data[i+2])+Math.abs(a.data[i+3]-b.data[i+3]);
                if(d>28) diff++;
              }
              return diff;
            }
            await p.mouse.move(dialogBox.x+dialogBox.width*.50,dialogBox.y+dialogBox.height*.45);
            await p.waitForTimeout(550);
            const headCenter=await particleShot('center');
            await p.mouse.move(dialogBox.x+dialogBox.width*.88,dialogBox.y+dialogBox.height*.45);
            await p.waitForTimeout(700);
            const headRight=await particleShot('right');
            const headDelta=regionDiff(headCenter,headRight,0,.48);
            const bodyDelta=regionDiff(headCenter,headRight,.58,1);
            if(headDelta<180) throw Error('Step 5 head turn is not visibly changing the head: '+headDelta);
            if(bodyDelta>headDelta*.35) throw Error('Step 5 head turn is moving too much of the body: '+JSON.stringify({headDelta,bodyDelta}));
            await p.mouse.move(dialogBox.x+dialogBox.width*.50,dialogBox.y+dialogBox.height*.45);
            await p.waitForTimeout(900);
            const headReturn=await particleShot('return');
            const returnDelta=regionDiff(headCenter,headReturn,0,.48);
            if(returnDelta>headDelta*.45) throw Error('Step 5 head turn does not settle back toward neutral: '+JSON.stringify({headDelta,returnDelta}));

            // Reproduce the user's likely environment: OS/browser reduced-motion enabled.
            // Clicking Assembly is an explicit opt-in and must still animate.
            await p.emulateMedia({reducedMotion:'reduce'});
            await p.getByRole('button',{name:'Assembly',exact:true}).click();
            await p.getByText(/ASSEMBLY/).waitFor({state:'visible'});
            await p.waitForTimeout(700);
            const assemblyStatus=await p.getByText(/ASSEMBLY ·/).innerText();
            if(assemblyStatus.includes('COMPLETE')) throw Error('Assembly still skips instantly under reduced-motion');
            await p.getByLabel('N7 visible assembly source').waitFor({state:'visible'});
            const assemblyCanvas=p.getByLabel('N7 guide particle-river assembly').locator('canvas');

            function metrics(path){
              const png=PNG.sync.read(fs.readFileSync(path));
              let visible=0, cyan=0, minX=png.width, maxX=-1, sumX=0;
              for(let y=0;y<png.height;y++) for(let x=0;x<png.width;x++){
                const i=(y*png.width+x)*4;
                const r=png.data[i],g=png.data[i+1],b=png.data[i+2],a=png.data[i+3];
                if(a>24 && (r+g+b)>45){
                  visible++; minX=Math.min(minX,x); maxX=Math.max(maxX,x); sumX+=x;
                }
                if(a>24 && b>80 && g>70 && b>r*1.2) cyan++;
              }
              return {visible,cyan,minX,maxX,width:maxX>=minX?maxX-minX+1:0,centroid:visible?sumX/visible:0};
            }

            await p.waitForTimeout(1500);
            const shot25=process.env.RUNNER_TEMP+'/n7-assembly-25.png';
            await assemblyCanvas.screenshot({path:shot25});
            const m25=metrics(shot25);
            if(m25.visible<350 || m25.cyan<150) throw Error('25% assembly is not visibly transporting matter: '+JSON.stringify(m25));

            await p.waitForTimeout(2100);
            const shot60=process.env.RUNNER_TEMP+'/n7-assembly-60.png';
            await assemblyCanvas.screenshot({path:shot60});
            const m60=metrics(shot60);
            if(m60.visible<900) throw Error('60% assembly is not visibly transporting matter: '+JSON.stringify(m60));
            if(m60.width<m25.width*1.65) throw Error('left-to-right body build did not widen enough: '+JSON.stringify({m25,m60}));
            if(m60.centroid<m25.centroid+70) throw Error('construction did not progress left-to-right: '+JSON.stringify({m25,m60}));
            if(m60.cyan<350) throw Error('60% assembly lacks cyan artwork particles: '+JSON.stringify(m60));

            await p.waitForTimeout(2700);
            await p.getByLabel('N7 face ignition').waitFor({state:'visible'});
            await p.getByText(/ASSEMBLY · COMPLETE/).waitFor({state:'visible'});
            await p.getByRole('button',{name:'Replay Assembly',exact:true}).click();
            await p.waitForTimeout(250);
            await p.getByRole('button',{name:'Skip',exact:true}).click();
            await p.getByRole('button',{name:'Particles',exact:true}).waitFor({state:'visible'});
            if(errors.length) throw Error('browser errors: '+errors.join(' | '));
            const critical=failed.filter(x=>x.includes('/n7-apex/_next/'));
            if(critical.length) throw Error('N7 APEX asset load failures: '+critical.join(' | '));
            await p.screenshot({path:process.env.RUNNER_TEMP+'/n7-guide-idle.png',fullPage:true});
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Read-only Top.Host target preflight
        env:
          N7_APEX_OUT: ${{ runner.temp }}/n7-apex-src/out
        run: python3 tools/n7_apex_preview/deploy_apex_preview.py
  deploy:
    if: github.event_name == 'push'
    needs: validate
    environment: nabou-production
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
      N7_DRY_RUN: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/n7_apex_preview
            tools/n7_apex_preview/build_apex_preview.py
            tools/n7_apex_preview/deploy_apex_preview.py
            ops_ftps_requests/n7-apex-preview.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner-authorized isolated preview scope
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('ops_ftps_requests/n7-apex-preview.json'))
          assert x=={
            'confirmation':'N7-OWNER-APEX-AUTHENTIC-PREVIEW',
            'target':'/bot.piratecartography.com/n7-app/public/n7-apex',
            'same_origin_api':True,
            'preserve_existing_n7':True,
            'recognized_upgrade_only':True,
            'backup_and_rollback':True
          }
          PY
      - name: Reconstruct and build exact preview
        run: |
          python3 tools/n7_apex_preview/build_apex_preview.py --out "$RUNNER_TEMP/n7-apex-src"
          cd "$RUNNER_TEMP/n7-apex-src"
          npm ci
          npm run build
      - name: Install isolated /n7-apex preview and verify live
        env:
          N7_APEX_OUT: ${{ runner.temp }}/n7-apex-src/out
        run: python3 tools/n7_apex_preview/deploy_apex_preview.py
