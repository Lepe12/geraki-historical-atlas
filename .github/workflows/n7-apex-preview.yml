name: N7 APEX authentic preview — verify and deploy
on:
  pull_request:
    paths:
      - 'tools/n7_apex_preview/**'
      - 'tools/n7_apex_preview/build_apex_preview.py'
      - 'tools/n7_apex_preview/deploy_apex_preview.py'
      - '.github/workflows/n7-apex-preview.yml'
      - 'ops_ftps_requests/n7-apex-preview.json'
  push:
    branches: [main]
    paths:
      - 'tools/n7_apex_preview/**'
      - '.github/workflows/n7-apex-preview.yml'
      - 'ops_ftps_requests/n7-apex-preview.json'
permissions:
  contents: read
concurrency:
  group: n7-apex-preview-deploy
  cancel-in-progress: true
jobs:
  validate:
    environment: nabou-production
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
      N7_DRY_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/n7_apex_preview
            tools/n7_apex_preview/build_apex_preview.py
            tools/n7_apex_preview/deploy_apex_preview.py
            ops_ftps_requests/n7-apex-preview.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact upstream APEX source with reviewed N7 overlay
        run: python3 tools/n7_apex_preview/build_apex_preview.py --out "$RUNNER_TEMP/n7-apex-src"
      - name: Build static /n7-apex export
        run: |
          cd "$RUNNER_TEMP/n7-apex-src"
          npm ci
          npm run build
          test -s out/index.html
          test -d out/_next
      - name: Browser-render built preview
        run: |
          npm install --prefix "$RUNNER_TEMP/n7-apex-browser" --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 pngjs@7.0.0
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/n7-apex-http/n7-apex"
          cp -a "$RUNNER_TEMP/n7-apex-src/out/." "$RUNNER_TEMP/n7-apex-http/n7-apex/"
          python3 -m http.server 4173 --directory "$RUNNER_TEMP/n7-apex-http" >"$RUNNER_TEMP/n7-apex-http.log" 2>&1 &
          NODE_PATH="$RUNNER_TEMP/n7-apex-browser/node_modules" node - <<'NODE'
          const { chromium }=require('playwright-core');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await b.newPage({viewport:{width:1440,height:900}});
            const errors=[]; const failed=[];
            p.on('pageerror',e=>errors.push(String(e)));
            p.on('requestfailed',r=>failed.push(r.url()+': '+(r.failure()?.errorText||'failed')));
            const r=await p.goto('http://127.0.0.1:4173/n7-apex/',{waitUntil:'networkidle'});
            if(!r||!r.ok()) throw Error('preview HTTP failed');
            const text=await p.locator('body').innerText();
            if(!text.includes('N7')) throw Error('N7 branding missing');
            const button=p.getByRole('button',{name:'HUMANOID'});
            await button.waitFor({state:'visible'});
            await button.click();
            await p.getByRole('dialog',{name:'N7 Humanoid preview'}).waitFor({state:'visible'});
            await p.getByRole('dialog',{name:'N7 Humanoid preview'}).locator('canvas').waitFor({state:'visible'});
            await p.getByRole('button',{name:'Original',exact:true}).click();
            await p.getByRole('img',{name:'Approved N7 idle reference'}).waitFor({state:'visible'});
            await p.getByRole('button',{name:'Particles',exact:true}).click();
            const canvas=p.getByRole('dialog',{name:'N7 Humanoid preview'}).locator('canvas');
            await canvas.waitFor({state:'visible'});
            const box=await canvas.boundingBox();
            if(!box||box.width<200||box.height<300) throw Error('particle canvas has invalid size');
            await p.getByRole('button',{name:'Compare',exact:true}).click();
            await p.getByText(/PARTICLE RECONSTRUCTION/).waitFor({state:'visible'});
            await p.getByRole('button',{name:'Assembly',exact:true}).click();
            await p.getByText(/ASSEMBLY/).waitFor({state:'visible'});
            await p.getByLabel('N7 amber assembly core').waitFor({state:'visible'});
            await p.waitForTimeout(1400);
            const assemblyCanvas=p.getByRole('dialog',{name:'N7 Humanoid preview'}).locator('canvas');
            const midShot=process.env.RUNNER_TEMP+'/n7-assembly-mid.png';
            await assemblyCanvas.screenshot({path:midShot});
            const {PNG}=require('pngjs');
            const fs=require('fs');
            const png=PNG.sync.read(fs.readFileSync(midShot));
            let visible=0, cyan=0;
            for(let i=0;i<png.data.length;i+=4){
              const r=png.data[i],g=png.data[i+1],b=png.data[i+2],a=png.data[i+3];
              if(a>24 && (r+g+b)>45) visible++;
              if(a>24 && b>80 && g>70 && b>r*1.2) cyan++;
            }
            if(visible<700 || cyan<250) throw Error('assembly canvas is visually empty: visible='+visible+' cyan='+cyan);
            await p.waitForTimeout(2200);
            await p.getByText(/ASSEMBLY · COMPLETE/).waitFor({state:'visible'});
            await p.getByRole('button',{name:'Replay Assembly',exact:true}).click();
            await p.waitForTimeout(250);
            await p.getByRole('button',{name:'Skip',exact:true}).click();
            await p.getByRole('button',{name:'Particles',exact:true}).waitFor({state:'visible'});
            if(errors.length) throw Error('browser errors: '+errors.join(' | '));
            const critical=failed.filter(x=>x.includes('/n7-apex/_next/'));
            if(critical.length) throw Error('N7 APEX asset load failures: '+critical.join(' | '));
            await p.screenshot({path:process.env.RUNNER_TEMP+'/n7-guide-idle.png',fullPage:true});
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Read-only Top.Host target preflight
        env:
          N7_APEX_OUT: ${{ runner.temp }}/n7-apex-src/out
        run: python3 tools/n7_apex_preview/deploy_apex_preview.py
  deploy:
    if: github.event_name == 'push'
    needs: validate
    environment: nabou-production
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
      N7_DRY_RUN: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/n7_apex_preview
            tools/n7_apex_preview/build_apex_preview.py
            tools/n7_apex_preview/deploy_apex_preview.py
            ops_ftps_requests/n7-apex-preview.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner-authorized isolated preview scope
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('ops_ftps_requests/n7-apex-preview.json'))
          assert x=={
            'confirmation':'N7-OWNER-APEX-AUTHENTIC-PREVIEW',
            'target':'/bot.piratecartography.com/n7-app/public/n7-apex',
            'same_origin_api':True,
            'preserve_existing_n7':True,
            'recognized_upgrade_only':True,
            'backup_and_rollback':True
          }
          PY
      - name: Reconstruct and build exact preview
        run: |
          python3 tools/n7_apex_preview/build_apex_preview.py --out "$RUNNER_TEMP/n7-apex-src"
          cd "$RUNNER_TEMP/n7-apex-src"
          npm ci
          npm run build
      - name: Install isolated /n7-apex preview and verify live
        env:
          N7_APEX_OUT: ${{ runner.temp }}/n7-apex-src/out
        run: python3 tools/n7_apex_preview/deploy_apex_preview.py
