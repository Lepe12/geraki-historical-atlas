name: Continue pending research coverage
on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['research_continuation_requests/*.json', '.github/workflows/research-continuation.yml', 'tools/research_continuation_handoff.py', '.github/workflows/research-semantic-reanalysis.yml']
  workflow_dispatch:
    inputs:
      excluded_run_ids:
        description: Parent corpora held out of this automatic dispatch chain
        type: string
        required: false
        default: '[]'
permissions:
  contents: write
  actions: write
concurrency:
  group: research-continuation-dispatch
  cancel-in-progress: false
jobs:
  pending:
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.queue.outputs.runs }}
      baseline: ${{ steps.queue.outputs.baseline }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # select() reads only continuation queues and citation backlogs of
          # each parent run; skip the multi-GB acquired sources and passes.
          # Lane index.json keeps every lane directory present so a
          # citation_continuation_<lane> receipt is still found for lanes
          # whose own cited_work_continuation.json does not exist.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/runs/
            /evidence/runs/*/*/index.json
            /evidence/runs/*/research_continuation/
            /evidence/runs/*/*/library_acquisition/cited_work_continuation.json
      - name: Check restart and failure guards
        run: python3 -m unittest discover -s tools -p test_research_continuation_handoff.py
      - id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          PCT_CONTINUATION_EXCLUDED_RUNS: ${{ inputs.excluded_run_ids || '[]' }}
        run: python3 tools/research_continuation_handoff.py select --exclude-active --dispatch


  manual-resume:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: pending
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/runs/
            /evidence/runs/*/research_continuation/
      - name: Validate explicit resume handling
        run: python3 -m unittest discover -s tools -p test_research_manual_resume.py
      - name: Submit newly pushed explicit resume requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYRESUME'
          import os
          import subprocess
          from pathlib import PurePosixPath
          paths = subprocess.check_output(
              ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r',
               os.environ['GITHUB_SHA'], '--', 'research_continuation_requests/'],
              text=True).splitlines()
          requests = [p for p in paths if PurePosixPath(p).parent.as_posix()
                      == 'research_continuation_requests' and p.endswith('.json')]
          if requests:
              subprocess.check_call(['python3', 'tools/research_manual_resume.py', *requests])
          PYRESUME
      - name: Preserve submission receipts including uncertain failures
        if: always()
        run: |
          if [ ! -d research_continuation_requests/receipts ]; then exit 0; fi
          git add research_continuation_requests/receipts/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record explicit single-pass research resume submission'
          git pull --rebase origin main
          git push origin HEAD:main

