name: Site chat index weekly refresh
# Rebuilds the «Ρώτα τον Καπετάνιο» index from the public piratecartography.com site once a week at night
# (Monday 03:30 Athens winter time / 04:30 summer time). Gentle: one request every 20 s, no retries,
# stops on the first 429/5xx and keeps the old index. Deploys to pct-live only when the index changed.
on:
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to pct-live if the index changed'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: site-chat-index-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            server/command-center-live
            tools/gateway
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild index from the public site (20 s between requests, no retries)
        id: build
        run: |
          set +e
          node server/command-center-live/site-chat-build.js
          code=$?
          set -e
          if [ "$code" = "75" ]; then echo "::warning::WordPress was busy (429/5xx). Old index kept; no retry until next week."; echo "busy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - name: Test the rebuilt index
        if: steps.build.outputs.busy != 'true'
        run: node server/command-center-live/site-chat.test.js
      - name: Commit if changed
        id: commit
        if: steps.build.outputs.busy != 'true'
        run: |
          if git diff --quiet -- server/command-center-live/site-index.json server/command-center-live/site-chat-assets.json; then echo "Index unchanged."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/command-center-live/site-index.json server/command-center-live/site-chat-assets.json
          git commit -m 'Site chat: weekly refresh of the piratecartography.com index'
          for i in 1 2 3; do git pull --rebase --quiet origin main && git push origin HEAD:main && break; sleep 10; done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy to pct-live (existing NABOU FTPS workflow)
        if: steps.commit.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nabou-plesk-ftps.yml --ref main -f mode=deploy -f confirm=DEPLOY-NABOU -f payload=backend
