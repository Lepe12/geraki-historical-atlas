name: NABOU Historical Evidence Production Smoke
on:
  push:
    branches: [main]
    paths:
      - 'server/command-center-live/**'
      - 'tools/probe_evidence_production.py'
      - 'tools/cited_work_acquisition.py'
      - 'tools/research_validation_report.py'
      - 'tools/research_priority.py'
      - '.github/workflows/nabou-evidence-production-smoke.yml'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  verify-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            tools
            evidence/production_smoke
      - name: Actual production authorization and GitHub OIDC checks
        run: python3 tools/probe_evidence_production.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-evidence-http-report
          path: evidence/production_smoke/${{ github.run_id }}/
      - name: Persist actual production outcome
        if: always()
        run: |
          set -e
          if [ ! -d "evidence/production_smoke/$GITHUB_RUN_ID" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "evidence/production_smoke/$GITHUB_RUN_ID"
          git commit -m 'Record observed production evidence HTTP and OIDC results'
          python3 tools/publish_research_outputs.py

