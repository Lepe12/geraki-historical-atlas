name: JARVIS Scientific Reliability Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/research_relevance.py'
      - 'tools/research_discovery_inventory.py'
      - 'tools/test_discovery_retention.py'
      - 'tools/claim_evidence_matrix.py'
      - 'tools/source_first_report.py'
      - 'tools/apply_claim_assessment.py'
      - 'tools/scientific_evidence_audit.py'
      - 'tools/verification_pipeline.py'
      - 'tools/finalize_verification.py'
      - 'tools/preserve_run_evidence.py'
      - 'tools/test_claim_evidence_matrix.py'
      - '.github/workflows/jarvis-scientific-reliability-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile scientific pipeline
        run: |
          python3 -m py_compile \
            tools/research_relevance.py \
            tools/research_discovery_inventory.py \
            tools/claim_evidence_matrix.py \
            tools/source_first_report.py \
            tools/apply_claim_assessment.py \
            tools/scientific_evidence_audit.py \
            tools/verification_pipeline.py \
            tools/finalize_verification.py \
            tools/preserve_run_evidence.py
      - name: Discovery retention and claim matrix unit tests
        run: |
          PYTHONPATH=tools python3 -m unittest \
            tools/test_discovery_retention.py \
            tools/test_claim_evidence_matrix.py -v
      - name: Existing scientific audit tests
        run: PYTHONPATH=tools python3 -m unittest tools/test_scientific_evidence_audit.py -v
