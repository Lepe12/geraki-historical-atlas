name: PCT Parallel Multi-Agent Research
run-name: Research ${{ inputs.request_id || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      require_semantic_analysis:
        description: "Require model synthesis for this run; otherwise collect sources and report model availability separately"
        type: boolean
        default: true
      request_id:
        description: "Optional UI request correlation ID"
        required: false
        type: string
      target:
        description: "Research target (place, person, event, institution)"
        required: true
        type: string
      aliases:
        description: "Known/historically supported aliases separated by |"
        required: false
        type: string
      date_range:
        description: "Date range, e.g. 1600-1700"
        required: false
        type: string
      purpose:
        description: "Research question / scope"
        required: false
        type: string
      selected_agents:
        description: "Optional comma-separated lane subset; blank means all eleven"
        required: false
        type: string
      auto_continue:
        description: "Allow the hourly coordinator to continue this run automatically; false holds it out of every automatic chain"
        type: boolean
        default: true
      eval_fast_mode:
        description: "Evaluation only: requires 1-3 selected_agents, caps acquisition/synthesis time, reports INCOMPLETE validation as a warning. Off = normal production research"
        type: boolean
        default: false
      initial_semantic_shards:
        description: "Initial reading: parallel GitHub runners for extraction/review; tiny corpora use one"
        type: choice
        options: ['1', '2', '4']
        default: '4'
      semantic_shards:
        description: "Continuation rounds only: read excerpts on 1-4 parallel free runners. 1 = one job, as before"
        type: choice
        options: ['1', '2', '3', '4']
        default: '1'
  push:
    branches:
      - main
    paths:
      - 'library_discovery_requests/**'

permissions:
  contents: write
  id-token: write

env:
  PCT_TARGET: ${{ inputs.target }}
  PCT_ALIASES: ${{ inputs.aliases }}
  PCT_DATE_RANGE: ${{ inputs.date_range }}
  PCT_PURPOSE: ${{ inputs.purpose }}
  PCT_SELECTED_AGENTS: ${{ inputs.selected_agents }}
  PCT_AUTO_CONTINUE: ${{ inputs.auto_continue == false && 'false' || 'true' }}
  PCT_EVAL_FAST_MODE: ${{ inputs.eval_fast_mode == true && 'true' || 'false' }}
  PCT_SEMANTIC_SHARDS: ${{ inputs.semantic_shards || '1' }}
  PCT_INITIAL_SEMANTIC_SHARDS: ${{ inputs.initial_semantic_shards || '4' }}
  PCT_LLM_PROVIDER: ${{ vars.PCT_LLM_PROVIDER || 'local_llama_cpp' }}
  PCT_LLM_MODEL: ${{ vars.PCT_LLM_MODEL || 'Qwen/Qwen3-8B-GGUF' }}
  PCT_LLM_BASE_URL: ${{ vars.PCT_LLM_BASE_URL }}
  PCT_LLM_API_KEY: ${{ secrets.PCT_LLM_API_KEY }}
  PCT_LLM_QUERY_MODEL: ${{ vars.PCT_LLM_QUERY_MODEL || vars.PCT_LLM_MODEL || 'Qwen/Qwen3-8B-GGUF' }}
  PCT_LLM_EXTRACTOR_MODEL: ${{ vars.PCT_LLM_EXTRACTOR_MODEL || vars.PCT_LLM_MODEL || 'Qwen/Qwen3-8B-GGUF' }}
  PCT_LLM_SYNTHESIS_MODEL: ${{ vars.PCT_LLM_SYNTHESIS_MODEL || vars.PCT_LLM_MODEL || 'Qwen/Qwen3-8B-GGUF' }}
  PCT_LLM_ADVERSARIAL_MODEL: ${{ vars.PCT_LLM_ADVERSARIAL_MODEL || vars.PCT_LLM_MODEL || 'Qwen/Qwen3-8B-GGUF' }}
  # Host-local MariaDB is primary. Airtable is retained only as an explicit legacy option.
  PCT_STORAGE_BACKEND: mariadb
  PCT_UI_REQUEST_ID: ${{ inputs.request_id }}
  PCT_COMMAND_CENTER_URL: ${{ github.ref == 'refs/heads/main' && 'https://pct-live.piratecartography.com/pct-api/live' || '' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      run_specialists: ${{ steps.matrix.outputs.run_specialists }}
      target: ${{ steps.identity.outputs.target }}
      aliases: ${{ steps.identity.outputs.aliases }}
      date_range: ${{ steps.identity.outputs.date_range }}
      purpose: ${{ steps.identity.outputs.purpose }}
      target_type: ${{ steps.identity.outputs.target_type }}
      request_file: ${{ steps.identity.outputs.request_file }}
      request_sha256: ${{ steps.identity.outputs.request_sha256 }}
      research_job_id: ${{ steps.identity.outputs.research_job_id }}
      require_semantic_analysis: ${{ steps.identity.outputs.require_semantic_analysis }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            tools
            .github/actions/research-model
            config
            data
            library_discovery_requests
            tests/fixtures
      - name: Announce actual request preparation
        run: |
          python3 tools/orchestrator/jarvis_event_bus.py --run-id "$GITHUB_RUN_ID" --event-type mission_preparing --agent-id jarvis --phase request_validation --status PREPARING --detail "Research runner started; validating the canonical request"
      - uses: ./.github/actions/research-model
      - id: identity
        name: Resolve canonical research request once
        env:
          PCT_SEMANTIC_QUERY_EXPANSION: '1'
        run: |
          python3 tools/research_preflight.py ${{ inputs.require_semantic_analysis && '--require-semantic' || '' }}
      - name: Preserve preflight receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-preflight-${{ github.run_id }}
          path: execution_receipts/
          retention-days: 90
      - name: Compile Python research code
        run: python3 -m compileall -q tools
      - name: Run core scientific benchmark
        env:
          # Offline fixtures exercise the model-written repair path explicitly.
          # Production local inference defaults must not change those fixtures.
          PCT_LLM_PROVIDER: disabled
          PCT_SYNTHESIS_MODE: model
        run: |
          PYTHONPATH=tools:tools/orchestrator python3 -m unittest tools/orchestrator/test_research_query.py tools/test_research_focus.py tools/test_fulltext_discovery.py tools/test_cited_work_acquisition.py tools/test_research_pipeline_repairs.py tools/test_section_extraction.py tools/test_research_evidence_package.py -q
          PYTHONPATH=tools:tools/llm python3 -m unittest tools/test_semantic_research_answer.py tools/test_reviewed_claim_draft.py -q
          python3 tools/scientific_benchmark.py
          python3 tools/adversarial_scientific_benchmark.py
      - name: Build and validate eleven lane payloads
        env:
          PCT_TARGET: ""
          PCT_RESEARCH_JOB_ID: ${{ steps.identity.outputs.research_job_id }}
          PCT_EXPECTED_REQUEST_SHA256: ${{ steps.identity.outputs.request_sha256 }}
          PCT_REQUEST_FILE: ${{ steps.identity.outputs.request_file }}
        run: |
          python3 tools/build_research_lanes.py
          python3 tools/verify_request_integrity.py
      - id: matrix
        name: Build bounded research lane matrix
        # Production (eval fast mode off): blank selection = all eleven lanes,
        # specialists always run. Fast mode: 1-3 explicit lanes; specialists run
        # only for travellers, the one lane that consumes their output.
        run: |
          python3 tools/eval_fast_mode.py matrix | tee -a "$GITHUB_OUTPUT"
      - name: Announce request preparation complete
        run: |
          python3 tools/orchestrator/jarvis_event_bus.py --run-id "$GITHUB_RUN_ID" --event-type agent_idle --agent-id jarvis --phase request_validated --percent 100 --status IDLE --detail "Canonical request validated; specialist jobs may start"
      - name: Announce request preparation failure
        if: failure()
        run: |
          python3 tools/orchestrator/jarvis_event_bus.py --run-id "$GITHUB_RUN_ID" --event-type agent_failed --agent-id jarvis --phase request_validation_failed --status FAILED --detail "Canonical request preparation failed; inspect workflow log"
      - uses: actions/upload-artifact@v4
        with:
          name: pct-research-request-${{ github.run_id }}
          path: |
            resolved_research_request.json
            research_request_identity.json
            research_lanes/

  specialist-research:
    needs: prepare
    if: needs.prepare.outputs.run_specialists != 'false'
    uses: ./.github/workflows/jarvis-specialist-research.yml
    secrets:
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      SEARCHCULTURE_API_KEY: ${{ secrets.SEARCHCULTURE_API_KEY }}
    with:
      request_id: ${{ inputs.request_id }}
      target: ${{ needs.prepare.outputs.target }}
      aliases: ${{ needs.prepare.outputs.aliases }}
      date_range: ${{ needs.prepare.outputs.date_range }}
      purpose: ${{ needs.prepare.outputs.purpose }}
      target_type: ${{ needs.prepare.outputs.target_type }}

  research-lanes:
    permissions:
      contents: read
      id-token: write
    needs: [prepare, specialist-research]
    if: always() && needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      max-parallel: 11
    runs-on: ubuntu-latest
    env:
      PCT_TARGET: ""
      PCT_LLM_PROVIDER: disabled
      PCT_REQUEST_FILE: ${{ needs.prepare.outputs.request_file }}
      PCT_EXPECTED_REQUEST_SHA256: ${{ needs.prepare.outputs.request_sha256 }}
      PCT_RESEARCH_JOB_ID: ${{ needs.prepare.outputs.research_job_id }}
      PCT_RESEARCH_LANE: ${{ matrix.lane }}
      SEARCHCULTURE_API_KEY: ${{ secrets.SEARCHCULTURE_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/runs/
            /evidence/runs/${{ github.run_id }}/
            !/evidence/specialist_runs/
            /evidence/specialist_runs/${{ github.run_id }}/
            !/backups/
      - uses: actions/download-artifact@v4
        if: matrix.lane == 'travellers' && needs.specialist-research.result != 'skipped'
        continue-on-error: true
        with:
          name: specialist-normalized-${{ github.run_id }}
          path: specialist_sources
      - uses: actions/download-artifact@v4
        with:
          name: pct-research-request-${{ github.run_id }}
      - name: Validate pinned request before research
        run: |
          python3 tools/request_identity.py
          python3 tools/run_manifest.py
          python3 tools/build_research_lanes.py
          python3 tools/verify_request_integrity.py
      - name: Announce lane start to Command Center
        run: |
          python3 tools/orchestrator/jarvis_event_bus.py --run-id "$GITHUB_RUN_ID" --event-type agent_started --agent-id "$PCT_RESEARCH_LANE" --phase "repository discovery" --percent 5 --status RUNNING --detail "JARVIS lane execution started"
      - name: Apply eval fast-mode acquisition caps
        if: env.PCT_EVAL_FAST_MODE == 'true'
        run: |
          {
            echo "PCT_DISCOVERY_PASSES=2"
            echo "PCT_MAX_ACQUISITION_CANDIDATES=15"
            echo "PCT_ACQUISITION_BATCHES=1"
            echo "PCT_ACQUISITION_BUDGET_SECONDS=180"
            echo "PCT_CITATION_QUERY_LIMIT=3"
          } >> "$GITHUB_ENV"
          echo "EVAL_FAST_MODE: lane acquisition capped (evaluation only)"
      - name: Install browser for public legacy catalogues
        if: contains(fromJSON('["greek","travellers","venetian","italian_states"]'), matrix.lane)
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Build lane-specific repository plan
        run: |
          python3 tools/lane_repository_plan.py
          for discovery_pass in $(seq 1 "${PCT_DISCOVERY_PASSES:-6}"); do
            timeout 300s python3 tools/lane_repository_discovery.py || { code=$?; echo "LANE DISCOVERY FAILED exit=$code"; exit "$code"; }
            python3 -c 'import json,os,sys; sys.exit(0 if json.load(open("lane_discovery/"+os.environ["PCT_RESEARCH_LANE"]+".json")).get("partial") else 1)' || break
          done
          python3 tools/merge_specialist_candidates.py
          # Each lane searches its discovered IIIF books; corpus-wide IA runs once in travellers.
          timeout 210s python3 tools/fulltext_discovery.py
          python3 tools/merge_repository_candidates.py
          python3 tools/orchestrator/jarvis_event_bus.py --run-id "$GITHUB_RUN_ID" --event-type agent_progress --agent-id "$PCT_RESEARCH_LANE" --phase "repository discovery complete" --percent 35 --status RUNNING --detail "Repository discovery and candidate merge complete"
          if [ "$PCT_RESEARCH_LANE" = "german" ]; then PCT_BSB_POSITIVE_CONTROL=1 python3 tools/bsb_iiif_route.py; fi
          if [ "$PCT_RESEARCH_LANE" = "travellers" ]; then python3 tools/bsb_iiif_route.py; fi
      - name: Install PDF and public page OCR extraction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra tesseract-ocr-ita tesseract-ocr-ell
      - name: Run lane research pipeline
        env:
          PCT_RESEARCH_LANE: ${{ matrix.lane }}
        run: |
          timeout 1800s bash -c '
            set -o pipefail
            if [ "$PCT_RESEARCH_LANE" = "travellers" ]; then
              python3 tools/library_source_discovery.py &&
              python3 tools/route_library_candidates.py || exit $?
            fi
            python3 tools/acquire_library_candidate.py &&
            python3 tools/merge_repository_candidates.py &&
            python3 tools/search_acquired_ocr.py &&
            python3 tools/event_first_search.py &&
            python3 tools/research_recovery.py &&
            python3 tools/exact_page_acquire.py
          ' || { code=$?; echo "LANE PIPELINE FAILED exit=$code"; exit "$code"; }
          python3 tools/research_stage.py --stage verification -- python3 tools/verification_pipeline.py
          python3 tools/research_stage.py --stage dossier -- python3 tools/build_research_dossier.py
          python3 tools/research_lane_health.py
          python3 tools/orchestrator/jarvis_event_bus.py --run-id "$GITHUB_RUN_ID" --event-type agent_progress --agent-id "$PCT_RESEARCH_LANE" --phase "evidence pipeline complete" --percent 90 --status RUNNING --detail "Acquisition, extraction, verification checks and dossier complete"
      - name: Preserve durable evidence in GitHub
        if: always()
        env:
          PCT_RESEARCH_LANE: ${{ matrix.lane }}
          PCT_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p system_health
          printf '%s\n' '{"execution_status":"${{ job.status }}"}' > system_health/workflow_execution.json
          python3 tools/preserve_run_evidence.py --run-id "$PCT_RUN_ID" --lane "$PCT_RESEARCH_LANE"
      - name: Package checksum-bound evidence for the single publisher
        if: always()
        run: python3 tools/research_lane_handoff.py pack --run-id "${{ github.run_id }}" --lane "${{ matrix.lane }}" --output lane_handoff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pct-lane-handoff-${{ github.run_id }}-${{ matrix.lane }}
          path: lane_handoff/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
      - name: Announce lane completion to Command Center
        if: success()
        run: |
          python3 tools/orchestrator/jarvis_event_bus.py --run-id "$GITHUB_RUN_ID" --event-type agent_completed --agent-id "$PCT_RESEARCH_LANE" --phase "complete" --percent 100 --status COMPLETED --detail "Lane processing completed; inspect evidence and publication receipts"
      - name: Announce lane failure to Command Center
        if: failure()
        run: |
          python3 tools/orchestrator/jarvis_event_bus.py --run-id "$GITHUB_RUN_ID" --event-type agent_failed --agent-id "$PCT_RESEARCH_LANE" --phase "failed" --percent 100 --status FAILED --detail "Lane research failed; inspect workflow artifacts and blockers"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pct-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            execution_receipts/
            resolved_research_request.json
            research_request_identity.json
            system_health/
          # Full evidence (including chunked binaries) travels once in the
          # checksum-bound handoff; this artifact retains runtime diagnostics.
          if-no-files-found: warn

  # N7 owner missions store their original source bundles exclusively in the
  # encrypted private N7 corpus. This replaces the public evidence git push
  # that GitHub rightfully blocked under repository/secret-scanning rules.
  private-n7-corpus-handoff:
    needs: [prepare, research-lanes]
    if: always() && needs.prepare.result == 'success' && github.ref == 'refs/heads/main' && startsWith(inputs.request_id, 'n7mission-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    timeout-minutes: 8
    steps:
      - name: Require all 11 source lanes to have completed before private transfer
        env:
          RESEARCH_LANES: ${{ needs.research-lanes.result }}
          PREPARED: ${{ needs.prepare.outputs.matrix }}
        run: |
          set -euo pipefail
          if [ "$RESEARCH_LANES" != "success" ]; then
            echo "N7_PRIVATE_CORPUS_NOT_DISPATCHED: lane handoff incomplete"
            exit 1
          fi
          python3 - <<'PY'
          import json,os
          lanes=json.loads(os.environ['PREPARED'])
          expected={"greek","travellers","spanish_simancas","venetian","french","british","dutch","german","italian_states","ottoman","north_african"}
          assert set(lanes)==expected, "N7_PRIVATE_SOURCE_LANE_SET_INCOMPLETE"
          print("N7_PRIVATE_CORPUS_HANDOFF_11_LANES_READY")
          PY
      - name: Dispatch source-bound encrypted N7 corpus and real local synthesis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run n7-private-corpus-synthesis.yml --ref main \
            -f run_id="$GITHUB_RUN_ID"
          echo "N7_PRIVATE_CORPUS_DISPATCH_ACCEPTED original_run=$GITHUB_RUN_ID"
          echo "This only dispatches; encryption, model inference and owner delivery have independent checks."

  publish-lanes:
    needs: [prepare, research-lanes]
    if: always() && needs.prepare.result == 'success' && github.ref == 'refs/heads/main' && !startsWith(inputs.request_id, 'n7mission-')
    runs-on: ubuntu-latest
    concurrency:
      group: pct-research-lane-publisher-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/runs/
            /evidence/runs/${{ github.run_id }}/
            !/evidence/specialist_runs/
            /evidence/specialist_runs/${{ github.run_id }}/
            !/backups/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: pct-lane-handoff-${{ github.run_id }}-*
          path: lane_handoffs
      - name: Verify and recover every available lane (including failed lanes)
        env:
          EXPECTED_LANES: ${{ needs.prepare.outputs.matrix }}
        run: python3 tools/research_lane_handoff.py merge --run-id "$GITHUB_RUN_ID" --expected "$EXPECTED_LANES" --incoming lane_handoffs
      - name: Publish recovered evidence once and verify durable readback
        run: |
          if [ "$PCT_AUTO_CONTINUE" != "true" ]; then
            mkdir -p "evidence/runs/$GITHUB_RUN_ID/research_continuation"
            printf '{"auto_continue": false, "set_by_run": "%s"}\n' "$GITHUB_RUN_ID" > "evidence/runs/$GITHUB_RUN_ID/research_continuation/auto_continue.json"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "evidence/runs/$GITHUB_RUN_ID/"
          if ! git diff --cached --quiet; then
            git commit -m "Preserve all available lane evidence: run $GITHUB_RUN_ID"
            python3 tools/research_stage.py --stage publication -- python3 tools/publish_research_outputs.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pct-lane-publication-${{ github.run_id }}
          path: |
            publication_receipt.json
            evidence/runs/${{ github.run_id }}/LANE_HANDOFF.json
          retention-days: 90
      - name: Report missing lane transports after preserving available evidence
        run: |
          python3 - <<'PYHANDOFF'
          import json, os
          from pathlib import Path
          report=json.loads((Path('evidence/runs')/os.environ['GITHUB_RUN_ID']/'LANE_HANDOFF.json').read_text())
          if report['missing_lanes']:
              raise SystemExit('LANE_HANDOFF_MISSING: '+','.join(report['missing_lanes']))
          PYHANDOFF

  aggregate-health:
    needs: [prepare, publish-lanes]
    # Source genealogy must consume durably published evidence, not an empty checkout.
    if: always() && needs.prepare.result == 'success' && needs.publish-lanes.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PCT_EXPECTED_REQUEST_SHA256: ${{ needs.prepare.outputs.request_sha256 }}
      PCT_RESEARCH_JOB_ID: ${{ needs.prepare.outputs.research_job_id }}
      PCT_SELECTED_AGENTS: ${{ inputs.selected_agents }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/runs/
            /evidence/runs/${{ github.run_id }}/
            !/evidence/specialist_runs/
            /evidence/specialist_runs/${{ github.run_id }}/
            !/backups/
      - name: Refresh durable lane evidence
        run: git pull --rebase origin main
      - name: Build cross-lane source genealogy
        if: env.PCT_SELECTED_AGENTS == ''
        run: python3 tools/aggregate_source_genealogy.py --run-id "${{ github.run_id }}"
      - name: Build all-lane system health
        if: env.PCT_SELECTED_AGENTS == ''
        run: python3 tools/research_system_health.py --run-id "${{ github.run_id }}"
      - name: Commit aggregate health
        if: env.PCT_SELECTED_AGENTS == ''
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ARTIFACTS_ONLY: production publication skipped"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "evidence/runs/${{ github.run_id }}/SYSTEM_HEALTH.json" "evidence/runs/${{ github.run_id }}/SOURCE_GENEALOGY.json"
          git diff --cached --quiet && exit 0
          git commit -m "System health: run ${{ github.run_id }}"
          python3 tools/research_stage.py --stage publication -- python3 tools/publish_research_outputs.py
      - name: Queue host-local MariaDB persistence
        if: env.PCT_STORAGE_BACKEND == 'mariadb'
        env:
          PCT_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ARTIFACTS_ONLY: production publication skipped"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/storage/queue_mariadb_storage.py
          git add "evidence/runs/${{ github.run_id }}/MARIADB_STORAGE_INTENT.json"
          git diff --cached --quiet || git commit -m "Queue MariaDB persistence: run ${{ github.run_id }}"
          python3 tools/research_stage.py --stage publication -- python3 tools/publish_research_outputs.py
      - name: Synchronize legacy research state to Airtable
        if: env.PCT_STORAGE_BACKEND == 'airtable'
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          PCT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 tools/airtable_sync.py
          git add "evidence/runs/${{ github.run_id }}/AIRTABLE_SYNC.json"
          git diff --cached --quiet || git commit -m "Airtable sync report: run ${{ github.run_id }}"
          python3 tools/research_stage.py --stage publication -- python3 tools/publish_research_outputs.py
      - name: Enforce all-lane operational and request-integrity gate
        if: env.PCT_SELECTED_AGENTS == ''
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          p=pathlib.Path('evidence/runs')/os.environ['GITHUB_RUN_ID']/'SYSTEM_HEALTH.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          if not d.get('all_lanes_pipeline_reports_present') or not d.get('all_lanes_operational') or not d.get('request_fingerprint_ok'):
              print('ALL-LANE GATE FAILED', d.get('missing_lane_reports'), d.get('no_executed_repository_lanes'), d.get('request_fingerprint_ok'))
              sys.exit(1)
          expected=os.environ.get('PCT_EXPECTED_REQUEST_SHA256','')
          seen={x.get('request_sha256') for x in d.get('request_fingerprints',[]) if x.get('request_sha256')}
          if expected and seen != {expected}:
              print('REQUEST FINGERPRINT GATE FAILED', expected, sorted(seen))
              sys.exit(1)
          print('ALL-LANE REQUEST INTEGRITY GATE PASSED')
          PY


  jarvis-escalation-check:
    needs: [prepare, publish-lanes]
    if: always() && needs.prepare.result == 'success' && github.ref == 'refs/heads/main' && inputs.selected_agents != '' && inputs.eval_fast_mode != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/runs/
            /evidence/runs/${{ github.run_id }}/
            !/evidence/specialist_runs/
            /evidence/specialist_runs/${{ github.run_id }}/
            !/backups/
      - name: Refresh durable lane evidence
        run: git pull --rebase origin main
      - name: Evaluate archive escalation
        env:
          PCT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 tools/orchestrator/jarvis_escalate.py \
            --run-id "$PCT_RUN_ID" \
            --output "jarvis_escalation_requests/$PCT_RUN_ID.json"
      - name: Queue escalation only when routes exist
        env:
          PCT_RUN_ID: ${{ github.run_id }}
        run: |
          count=$(python3 - <<'PY'
          import json,os
          p="jarvis_escalation_requests/"+os.environ["PCT_RUN_ID"]+".json"
          print(len(json.load(open(p,encoding="utf-8")).get("routes",[])))
          PY
          )
          if [ "$count" -eq 0 ]; then
            echo "JARVIS_NO_ARCHIVE_ESCALATION_REQUIRED"
            rm -f "jarvis_escalation_requests/$PCT_RUN_ID.json"
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ARTIFACTS_ONLY: production publication skipped"
            exit 0
          fi
          git config user.name "jarvis-orchestrator[bot]"
          git config user.email "jarvis-orchestrator@users.noreply.github.com"
          git add "jarvis_escalation_requests/$PCT_RUN_ID.json"
          git commit -m "JARVIS queue archive escalation $PCT_RUN_ID"
          python3 tools/research_stage.py --stage publication -- python3 tools/publish_research_outputs.py


  semantic-prepare:
    needs: [prepare, publish-lanes]
    if: always() && needs.prepare.result == 'success' && needs.publish-lanes.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      matrix: ${{ steps.plan.outputs.matrix }}
      sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/runs/
            /evidence/runs/${{ github.run_id }}/
            !/evidence/specialist_runs/
            /evidence/specialist_runs/${{ github.run_id }}/
            !/backups/
      # Only the small embedding model is needed to freeze the same ranked
      # reading order. Do not load/download the multi-GB inference model here.
      - uses: actions/cache/restore@v4
        if: env.PCT_INITIAL_SEMANTIC_SHARDS != '1' && env.PCT_EVAL_FAST_MODE != 'true' && env.PCT_LLM_PROVIDER != 'disabled'
        continue-on-error: true
        with:
          path: ~/.cache/nabou-models/multilingual-e5-small
          key: nabou-embed-multilingual-e5-small-onnx-int8-761b726d-v1
      - name: Prepare only the existing small ranking model
        if: env.PCT_INITIAL_SEMANTIC_SHARDS != '1' && env.PCT_EVAL_FAST_MODE != 'true' && env.PCT_LLM_PROVIDER != 'disabled'
        continue-on-error: true
        run: |
          python3 -m pip install --quiet 'onnxruntime>=1.18,<2' 'tokenizers>=0.19,<1'
          python3 tools/local_embeddings.py --download "$HOME/.cache/nabou-models/multilingual-e5-small"
          echo "PCT_EMBED_MODEL_DIR=$HOME/.cache/nabou-models/multilingual-e5-small" >> "$GITHUB_ENV"
      - id: plan
        name: Freeze one source-bound reading order without model inference
        run: python3 tools/first_pass_semantics.py prepare --run-id "$GITHUB_RUN_ID" --count "$PCT_INITIAL_SEMANTIC_SHARDS"
      - id: snapshot
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: initial-semantic-plan-${{ github.run_id }}
          path: evidence/runs/${{ github.run_id }}/first_pass/
          if-no-files-found: error
          retention-days: 90

  semantic-read:
    needs: [prepare, semantic-prepare]
    if: needs.semantic-prepare.result == 'success' && needs.semantic-prepare.outputs.shards != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.semantic-prepare.outputs.matrix) }}
    env:
      PCT_SEMANTIC_PARTIAL_ANSWER: '1'
      PCT_SEMANTIC_BATCHES: '3'
      PCT_SEMANTIC_CALLS_PER_PASS: '48'
      PCT_SEMANTIC_BUDGET_SECONDS: '900'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-prepare.outputs.sha }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/runs/
            /evidence/runs/${{ github.run_id }}/
            !/evidence/specialist_runs/
            /evidence/specialist_runs/${{ github.run_id }}/
            !/backups/
      - uses: actions/download-artifact@v4
        with:
          name: initial-semantic-plan-${{ github.run_id }}
          path: evidence/runs/${{ github.run_id }}/first_pass
      - uses: ./.github/actions/research-model
      - name: Read this initial shard and review its claims (no final synthesis)
        run: python3 tools/first_pass_semantics.py read --run-id "$GITHUB_RUN_ID" --index "${{ matrix.shard }}" --count "${{ needs.semantic-prepare.outputs.shards }}"
      - name: Preserve completed work even if this reader failed
        if: always()
        run: python3 tools/first_pass_semantics.py pack --run-id "$GITHUB_RUN_ID" --index "${{ matrix.shard }}" --count "${{ needs.semantic-prepare.outputs.shards }}" --output initial-shard-transport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-semantic-out-${{ github.run_id }}-${{ matrix.shard }}
          path: initial-shard-transport/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  semantic-collect:
    needs: [semantic-prepare, semantic-read]
    if: always() && needs.semantic-prepare.result == 'success' && needs.semantic-prepare.outputs.shards != '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-prepare.outputs.sha }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/runs/
            /evidence/runs/${{ github.run_id }}/
            !/evidence/specialist_runs/
            /evidence/specialist_runs/${{ github.run_id }}/
            !/backups/
      - uses: actions/download-artifact@v4
        with:
          name: initial-semantic-plan-${{ github.run_id }}
          path: evidence/runs/${{ github.run_id }}/first_pass
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: initial-semantic-out-${{ github.run_id }}-*
          path: initial-shard-transports
      - name: Verify and combine available checkpoints without inference
        run: python3 tools/first_pass_semantics.py unpack --run-id "$GITHUB_RUN_ID" --count "${{ needs.semantic-prepare.outputs.shards }}" --incoming initial-shard-transports
      - id: publish
        name: Durably publish every completed shard before final synthesis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in "evidence/runs/$GITHUB_RUN_ID/first_pass/" "evidence/runs/$GITHUB_RUN_ID/research_continuation/"; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Preserve initial parallel semantic work $GITHUB_RUN_ID"
            python3 tools/publish_research_outputs.py
          fi
          echo "sha=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_OUTPUT"

  jarvis-state-board:
    needs: [prepare, publish-lanes, semantic-prepare, semantic-collect]
    if: always() && needs.prepare.result == 'success' && github.ref == 'refs/heads/main' && (needs.semantic-prepare.outputs.shards == '1' || needs.semantic-collect.result == 'success')
    concurrency:
      group: pct-command-center-research-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      # Publish reviewed, source-attributed findings while corpus coverage stays pending.
      # This does not promote evidence or relax historical verification.
      PCT_SEMANTIC_PARTIAL_ANSWER: '1'
      PCT_LOCAL_MODEL_REPOSITORY: ${{ vars.PCT_LLM_MODEL || 'Qwen/Qwen3-8B-GGUF' }}
      PCT_LLM_MODEL: ${{ vars.PCT_LLM_MODEL || 'Qwen/Qwen3-8B-GGUF' }}
      PCT_LLM_EXTRACTOR_MODEL: ${{ vars.PCT_LLM_EXTRACTOR_MODEL || vars.PCT_LLM_MODEL || 'Qwen/Qwen3-8B-GGUF' }}
      PCT_LLM_SYNTHESIS_MODEL: ${{ vars.PCT_LLM_SYNTHESIS_MODEL || vars.PCT_LLM_MODEL || 'Qwen/Qwen3-8B-GGUF' }}
      PCT_LLM_ADVERSARIAL_MODEL: ${{ vars.PCT_LLM_ADVERSARIAL_MODEL || vars.PCT_LLM_MODEL || 'Qwen/Qwen3-8B-GGUF' }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-prepare.outputs.sha }}
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/runs/
            /evidence/runs/${{ github.run_id }}/
            !/evidence/specialist_runs/
            /evidence/specialist_runs/${{ github.run_id }}/
            !/backups/
      - name: Restore the published corpus while keeping the pinned engine code
        env:
          SOURCE_SHA: ${{ needs.semantic-collect.outputs.sha || needs.semantic-prepare.outputs.sha }}
        run: |
          git fetch --depth=2 origin "$SOURCE_SHA"
          git restore --source=FETCH_HEAD -- "evidence/runs/$GITHUB_RUN_ID"
      - uses: actions/download-artifact@v4
        with:
          name: initial-semantic-plan-${{ github.run_id }}
          path: evidence/runs/${{ github.run_id }}/first_pass
      - uses: ./.github/actions/research-model
      - name: Build JARVIS situation board
        env:
          PCT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 tools/orchestrator/jarvis_state_board.py \
            --run-id "$PCT_RUN_ID" \
            --output "evidence/runs/$PCT_RUN_ID/JARVIS_STATE_BOARD.json"
      - name: Bound the parallel merge review budget
        if: needs.semantic-prepare.outputs.shards != '1'
        run: echo "PCT_SEMANTIC_BUDGET_SECONDS=900" >> "$GITHUB_ENV"
      - name: Apply eval fast-mode synthesis budget
        if: env.PCT_EVAL_FAST_MODE == 'true'
        run: |
          echo "PCT_SEMANTIC_BUDGET_SECONDS=600" >> "$GITHUB_ENV"
          echo "EVAL_FAST_MODE: synthesis pass capped at 600s (evaluation only)"
      - name: Extract, review and synthesize the actual acquired sources
        timeout-minutes: 50
        env:
          PCT_RUN_ID: ${{ github.run_id }}
          PCT_SEMANTIC_READING_PLAN: ${{ needs.semantic-prepare.outputs.shards != '1' && format('evidence/runs/{0}/first_pass/reading_plan.json', github.run_id) || '' }}
          PCT_SEMANTIC_MERGE: ${{ needs.semantic-prepare.outputs.shards != '1' && '1' || '0' }}
          PCT_INITIAL_SEMANTIC_MERGE: ${{ needs.semantic-prepare.outputs.shards != '1' && '1' || '0' }}
        run: python3 tools/semantic_research_answer.py --run-id "$PCT_RUN_ID"
      - name: Record actual validation even after failed or interrupted synthesis
        if: always()
        env:
          PCT_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$PCT_EVAL_FAST_MODE" = "true" ]; then
            # Eval fast mode: INCOMPLETE is reported as a warning, artifacts still upload.
            python3 tools/research_validation_report.py --run-id "$PCT_RUN_ID"
            python3 tools/eval_fast_mode.py validation-warning --run-id "$PCT_RUN_ID"
          else
            python3 tools/research_validation_report.py --run-id "$PCT_RUN_ID" ${{ needs.prepare.outputs.require_semantic_analysis == 'true' && '--require-complete' || '' }}
          fi
      - name: Preserve the actual command center research status
        if: always()
        env:
          PCT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 tools/orchestrator/build_command_center_snapshot.py \
            --run-id "$PCT_RUN_ID" \
            --output "command-center/live/runs/$PCT_RUN_ID.json" \
            --latest "command-center/live/latest.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-semantic-answer-${{ github.run_id }}
          path: |
            evidence/runs/${{ github.run_id }}/research_answer/
            evidence/runs/${{ github.run_id }}/first_pass/
            evidence/runs/${{ github.run_id }}/research_continuation/
          retention-days: 90
      - name: Commit situation board
        if: always()
        env:
          PCT_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ARTIFACTS_ONLY: production publication skipped"
            exit 0
          fi
          if [ "$PCT_AUTO_CONTINUE" != "true" ]; then
            # Hold marker read by research_continuation_handoff.auto_continue_held().
            mkdir -p "evidence/runs/$PCT_RUN_ID/research_continuation"
            printf '{"auto_continue": false, "set_by_run": "%s"}\n' "$PCT_RUN_ID" > "evidence/runs/$PCT_RUN_ID/research_continuation/auto_continue.json"
          fi
          if [ "$PCT_AUTO_CONTINUE" = "true" ] && [ "$PCT_EVAL_FAST_MODE" != "true" ] && [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Opt-in marker: only corpora created from now on start their own
            # next rounds (tools/auto_chain.py); older corpora never self-chain.
            PYTHONPATH=tools python3 tools/auto_chain.py mark --run-id "$PCT_RUN_ID"
          fi
          if [ "$PCT_SEMANTIC_SHARDS" != "1" ]; then
            # Opt-in parallel reading for the continuation rounds of this corpus
            # (read by research-semantic-reanalysis.yml when no input is given).
            mkdir -p "evidence/runs/$PCT_RUN_ID/research_continuation"
            printf '{"semantic_shards": %s, "set_by_run": "%s"}\n' "$PCT_SEMANTIC_SHARDS" "$PCT_RUN_ID" > "evidence/runs/$PCT_RUN_ID/research_continuation/semantic_shards.json"
          fi
          git config user.name "jarvis-orchestrator[bot]"
          git config user.email "jarvis-orchestrator@users.noreply.github.com"
          for output in "evidence/runs/$PCT_RUN_ID/JARVIS_STATE_BOARD.json" "evidence/runs/$PCT_RUN_ID/research_answer/" "evidence/runs/$PCT_RUN_ID/research_continuation/" "evidence/runs/$PCT_RUN_ID/first_pass/" command-center/live/; do
            if [ -e "$output" ]; then git add "$output"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "JARVIS state board $PCT_RUN_ID"
          python3 tools/research_stage.py --stage publication -- python3 tools/publish_research_outputs.py
      - name: Decide continuation round 1 of this research (opted-in corpora only)
        id: chain
        if: always() && github.ref == 'refs/heads/main'
        env:
          PCT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          PCT_CONTINUATION_MAX_ROUNDS: '5'
        run: |
          git fetch origin main
          git restore --source=origin/main -- "evidence/runs/$PCT_RUN_ID" 2>/dev/null || true
          PYTHONPATH=tools python3 tools/auto_chain.py chain --first-pass --run-id "$PCT_RUN_ID" --auto-continue "$PCT_AUTO_CONTINUE" --shards "$PCT_SEMANTIC_SHARDS"
          ledger="evidence/runs/$PCT_RUN_ID/research_continuation/rounds.json"
          if [ -e "$ledger" ]; then git add "$ledger"; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "jarvis-orchestrator[bot]"
          git config user.email "jarvis-orchestrator@users.noreply.github.com"
          git commit -m "Record automatic continuation decision $PCT_RUN_ID"
          python3 tools/research_stage.py --stage publication -- python3 tools/publish_research_outputs.py || echo 'AUTO_CHAIN_DECISION_LOG_NOT_PUBLISHED'
      - name: Start continuation round 1 of this research
        if: always() && steps.chain.outputs.dispatch == 'true'
        env:
          PCT_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=tools python3 tools/auto_chain.py dispatch --run-id "$PCT_RUN_ID" --shards "${{ steps.chain.outputs.shards }}"


