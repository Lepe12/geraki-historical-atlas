name: PCT Parallel Multi-Agent Research
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Research target (place, person, event, institution)"
        required: true
        type: string
      aliases:
        description: "Known/historically supported aliases separated by |"
        required: false
        type: string
      date_range:
        description: "Date range, e.g. 1600-1700"
        required: false
        type: string
      purpose:
        description: "Research question / scope"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'library_discovery_requests/**'

permissions:
  contents: write

env:
  PCT_TARGET: ${{ inputs.target }}
  PCT_ALIASES: ${{ inputs.aliases }}
  PCT_DATE_RANGE: ${{ inputs.date_range }}
  PCT_PURPOSE: ${{ inputs.purpose }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      request_file: ${{ steps.identity.outputs.request_file }}
      request_sha256: ${{ steps.identity.outputs.request_sha256 }}
      research_job_id: ${{ steps.identity.outputs.research_job_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: identity
        name: Resolve canonical research request once
        run: |
          python3 tools/request_identity.py
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open("research_request_identity.json",encoding="utf-8"))
          print("request_file="+d["request_file"])
          print("request_sha256="+d["request_sha256"])
          print("research_job_id="+d["research_job_id"])
          PY
      - name: Build and validate ten lane payloads
        env:
          PCT_RESEARCH_JOB_ID: ${{ steps.identity.outputs.research_job_id }}
          PCT_EXPECTED_REQUEST_SHA256: ${{ steps.identity.outputs.request_sha256 }}
          PCT_REQUEST_FILE: ${{ steps.identity.outputs.request_file }}
        run: |
          python3 tools/build_research_lanes.py
          python3 tools/verify_request_integrity.py
      - id: matrix
        run: echo 'matrix=["travellers","spanish_simancas","venetian","french","british","dutch","german","italian_states","ottoman","north_african"]' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pct-research-request-${{ github.run_id }}
          path: |
            research_request_identity.json
            research_lanes/

  research-lanes:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      max-parallel: 10
    runs-on: ubuntu-latest
    env:
      PCT_REQUEST_FILE: ${{ needs.prepare.outputs.request_file }}
      PCT_EXPECTED_REQUEST_SHA256: ${{ needs.prepare.outputs.request_sha256 }}
      PCT_RESEARCH_JOB_ID: ${{ needs.prepare.outputs.research_job_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate pinned request before research
        run: |
          python3 tools/request_identity.py
          python3 tools/run_manifest.py
          python3 tools/build_research_lanes.py
          python3 tools/verify_request_integrity.py
      - name: Build lane-specific repository plan
        env:
          PCT_RESEARCH_LANE: ${{ matrix.lane }}
        run: |
          python3 tools/lane_repository_plan.py
          timeout 150s python3 tools/lane_repository_discovery.py || { code=$?; echo "LANE DISCOVERY bounded exit=$code"; [ "$code" -eq 124 ] && echo "LANE DISCOVERY TIMEOUT after 150s"; true; }
          python3 tools/merge_repository_candidates.py
          if [ "$PCT_RESEARCH_LANE" = "german" ]; then PCT_BSB_POSITIVE_CONTROL=1 python3 tools/bsb_iiif_route.py; fi
          if [ "$PCT_RESEARCH_LANE" = "travellers" ]; then python3 tools/bsb_iiif_route.py; fi
      - name: Run lane research pipeline
        env:
          PCT_RESEARCH_LANE: ${{ matrix.lane }}
        run: |
          timeout 1800s bash -c '
            set -o pipefail
            if [ "$PCT_RESEARCH_LANE" = "travellers" ]; then
              python3 tools/library_source_discovery.py &&
              python3 tools/route_library_candidates.py || exit $?
            fi
            python3 tools/acquire_library_candidate.py &&
            python3 tools/search_acquired_ocr.py &&
            python3 tools/event_first_search.py &&
            python3 tools/exact_page_acquire.py
          ' || { code=$?; echo "LANE PIPELINE bounded exit=$code"; [ "$code" -eq 124 ] && echo "LANE PIPELINE TIMEOUT after 1800s"; true; }
          python3 tools/verification_pipeline.py
          python3 tools/build_research_dossier.py
          python3 tools/research_lane_health.py
      - name: Preserve durable evidence in GitHub
        if: always()
        env:
          PCT_RESEARCH_LANE: ${{ matrix.lane }}
          PCT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 tools/preserve_run_evidence.py --run-id "$PCT_RUN_ID" --lane "$PCT_RESEARCH_LANE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "evidence/runs/$PCT_RUN_ID/$PCT_RESEARCH_LANE/"
          git diff --cached --quiet && exit 0
          git commit -m "Preserve evidence: run $PCT_RUN_ID lane $PCT_RESEARCH_LANE"
          for n in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((n*2))
          done
          echo "WARNING: durable evidence commit failed after retries; Actions artifact remains available for recovery."
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pct-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            research_lanes/${{ matrix.lane }}.json
            research_request_identity.json
            repository_plans/${{ matrix.lane }}.json
            lane_discovery/${{ matrix.lane }}.json
            iiif_candidate_requests/
            library_discovery/
            citation_chase_candidates/
            library_acquisition/
            citation_chase_hits/
            event_first_hits/
            exact_page_acquisition/
            original_inspection/
            source_genealogy/
            corroboration/
            verification/
            qa/
            structured_output/
            human_review/
            research_dossier/
            run_manifest/
            system_health/
          if-no-files-found: warn

  aggregate-health:
    needs: [prepare, research-lanes]
    if: always()
    runs-on: ubuntu-latest
    env:
      PCT_EXPECTED_REQUEST_SHA256: ${{ needs.prepare.outputs.request_sha256 }}
      PCT_RESEARCH_JOB_ID: ${{ needs.prepare.outputs.research_job_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Refresh durable lane evidence
        run: git pull --rebase origin main
      - name: Build ten-lane system health
        run: python3 tools/research_system_health.py --run-id "${{ github.run_id }}"
      - name: Commit aggregate health
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "evidence/runs/${{ github.run_id }}/SYSTEM_HEALTH.json"
          git diff --cached --quiet && exit 0
          git commit -m "System health: run ${{ github.run_id }}"
          for n in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((n*2))
          done
          exit 1
      - name: Synchronize safe research state to Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          PCT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 tools/airtable_sync.py
          git add "evidence/runs/${{ github.run_id }}/AIRTABLE_SYNC.json"
          git diff --cached --quiet || git commit -m "Airtable sync report: run ${{ github.run_id }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce ten-lane operational and request-integrity gate
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          p=pathlib.Path('evidence/runs')/os.environ['GITHUB_RUN_ID']/'SYSTEM_HEALTH.json'
          d=json.loads(p.read_text(encoding='utf-8'))
          if not d.get('all_ten_pipeline_reports_present') or not d.get('all_ten_operational') or not d.get('request_fingerprint_ok'):
              print('TEN-LANE GATE FAILED', d.get('missing_lane_reports'), d.get('no_executed_repository_lanes'), d.get('request_fingerprint_ok'))
              sys.exit(1)
          expected=os.environ.get('PCT_EXPECTED_REQUEST_SHA256','')
          seen={x.get('request_sha256') for x in d.get('request_fingerprints',[]) if x.get('request_sha256')}
          if expected and seen != {expected}:
              print('REQUEST FINGERPRINT GATE FAILED', expected, sorted(seen))
              sys.exit(1)
          print('TEN-LANE REQUEST INTEGRITY GATE PASSED')
          PY
