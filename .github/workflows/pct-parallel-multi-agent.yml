name: PCT Parallel Multi-Agent Research
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - 'library_discovery_requests/**'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile research engine
        run: python3 -m py_compile tools/request_context.py tools/build_research_lanes.py tools/lane_repository_plan.py tools/lane_repository_discovery.py tools/connectors/repository_connectors.py tools/merge_repository_candidates.py tools/library_source_discovery.py tools/route_library_candidates.py tools/acquire_library_candidate.py tools/search_acquired_ocr.py tools/event_first_search.py tools/exact_page_acquire.py tools/verification_pipeline.py tools/research_lane_health.py tools/research_system_health.py
      - run: python3 tools/build_research_lanes.py
      - id: m
        run: echo 'matrix=["travellers","spanish_simancas","venetian","french","british","dutch","german","italian_states","ottoman","north_african"]' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: pct-research-lanes-${{ github.run_id }}
          path: research_lanes/
  research-lanes:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      max-parallel: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lane-specific repository plan
        env:
          PCT_RESEARCH_LANE: ${{ matrix.lane }}
        run: |
          python3 tools/build_research_lanes.py
          python3 tools/lane_repository_plan.py
          timeout 150s python3 tools/lane_repository_discovery.py || { code=$?; echo "LANE DISCOVERY bounded exit=$code"; [ "$code" -eq 124 ] && echo "LANE DISCOVERY TIMEOUT after 150s"; true; }
          python3 tools/merge_repository_candidates.py
          if [ "$PCT_RESEARCH_LANE" = "german" ]; then PCT_BSB_POSITIVE_CONTROL=1 python3 tools/bsb_iiif_route.py; fi
          if [ "$PCT_RESEARCH_LANE" = "travellers" ]; then python3 tools/bsb_iiif_route.py; fi
      - name: Run lane discovery
        env:
          PCT_RESEARCH_LANE: ${{ matrix.lane }}
        run: |
          python3 tools/build_research_lanes.py
          timeout 180s bash -c '
            set -o pipefail
            python3 tools/library_source_discovery.py &&
            python3 tools/route_library_candidates.py &&
            python3 tools/acquire_library_candidate.py &&
            python3 tools/search_acquired_ocr.py &&
            python3 tools/event_first_search.py &&
            python3 tools/exact_page_acquire.py &&
            python3 tools/verification_pipeline.py
          ' || { code=$?; echo "GENERIC FALLBACK bounded exit=$code"; [ "$code" -eq 124 ] && echo "GENERIC FALLBACK TIMEOUT after 180s"; true; }
          python3 tools/research_lane_health.py
      - name: Preserve durable evidence in GitHub
        if: always()
        env:
          PCT_RESEARCH_LANE: ${{ matrix.lane }}
          PCT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 tools/preserve_run_evidence.py --run-id "$PCT_RUN_ID" --lane "$PCT_RESEARCH_LANE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "evidence/runs/$PCT_RUN_ID/$PCT_RESEARCH_LANE/"
          git diff --cached --quiet && exit 0
          git commit -m "Preserve evidence: run $PCT_RUN_ID lane $PCT_RESEARCH_LANE"
          for n in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((n*2))
          done
          echo "WARNING: durable evidence commit failed after retries; Actions artifact remains available for recovery."
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pct-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            research_lanes/${{ matrix.lane }}.json
            repository_plans/${{ matrix.lane }}.json
            lane_discovery/${{ matrix.lane }}.json
            iiif_candidate_requests/
            library_discovery/
            citation_chase_candidates/
            library_acquisition/
            citation_chase_hits/
            event_first_hits/
            exact_page_acquisition/
            original_inspection/
            source_genealogy/
            corroboration/
            verification/
            qa/
            structured_output/
            system_health/
          if-no-files-found: warn

  aggregate-health:
    needs: research-lanes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh durable lane evidence
        run: git pull --rebase origin main
      - name: Build ten-lane system health
        run: python3 tools/research_system_health.py --run-id "${{ github.run_id }}"
      - name: Commit aggregate health
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "evidence/runs/${{ github.run_id }}/SYSTEM_HEALTH.json"
          git diff --cached --quiet && exit 0
          git commit -m "System health: run ${{ github.run_id }}"
          for n in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((n*2))
          done
          exit 1
