name: JARVIS V5 live bridge
on:
  push:
    branches: [main]
    paths:
      - 'jarvis-intelligence-chamber/**'
      - '.github/workflows/jarvis-v5-live.yml'
  pull_request:
    paths:
      - 'jarvis-intelligence-chamber/**'
      - '.github/workflows/jarvis-v5-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check jarvis-intelligence-chamber/live-bridge.js
          node --check jarvis-intelligence-chamber/world3d.js
          node --check jarvis-intelligence-chamber/visual-smoke.cjs
          node --check jarvis-intelligence-chamber/live-bridge.test.cjs
          node --check jarvis-intelligence-chamber/production-smoke.cjs
      - name: Read-only live bridge tests
        run: node --test jarvis-intelligence-chamber/live-bridge.test.cjs jarvis-intelligence-chamber/research-overview.test.cjs jarvis-intelligence-chamber/research-dossier.test.cjs
  production-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production HTTPS and actual WebSocket bootstrap
        run: node jarvis-intelligence-chamber/production-smoke.cjs
