name: PARES Simancas Dynamic Discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'connectors/pares_simancas_discover.py'
      - '.github/workflows/pares-simancas-discovery-smoke.yml'
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          # Full checkout of this repo takes ~4 min; the connector needs only these paths.
          sparse-checkout: |
            connectors
            tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover and verify Secretaria de Napoles
        run: python connectors/pares_simancas_discover.py 'Secretaría de Nápoles' --limit 3 --max-pages 3
 