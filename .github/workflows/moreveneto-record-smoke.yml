name: Moreveneto known-record live verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'connectors/moreveneto_record_verify.py'
      - '.github/workflows/moreveneto-record-smoke.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m py_compile connectors/moreveneto_record_verify.py
      - name: Diagnose official SPA response and bundle URLs
        if: always()
        run: |
          python - <<'PY'
          import re
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          url = 'https://asve.arianna4.cloud/patrimonio/73a0c098-e94f-49d6-a27d-d20acde2b11f/0985-fondo-luogotenente-alla-patria-del-friuli-%5Budine%5D'
          class Assets(HTMLParser):
              def __init__(self): super().__init__(); self.assets=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='script' and a.get('src'): self.assets.append(('script',a['src']))
                  if tag=='link' and a.get('href'): self.assets.append(('link',a['href']))
          with urlopen(Request(url,headers={'User-Agent':'GERAKI-Research/1.0'}),timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              print('HTTP:',r.status,'CONTENT_TYPE:',r.headers.get('Content-Type'),'BODY_LENGTH:',len(body))
          p=Assets();p.feed(body)
          print('ASSETS:',p.assets[:30])
          print('HTML_START:',re.sub(r'\\s+',' ',body[:1000]))
          print('ARCHIVAL_TERMS_PRESENT:',{k:k.lower() in body.lower() for k in ['Archivio di Stato di Venezia','Estremo remoto','Estremo recente']})
          PY
      - name: Inspect public app bundle for catalogue endpoints
        if: always()
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin
          from urllib.request import Request,urlopen
          base='https://asve.arianna4.cloud/'
          url=urljoin(base,'main.b2709b386ffc0a41.js')
          with urlopen(Request(url,headers={'User-Agent':'GERAKI-Research/1.0'}),timeout=40) as r:
              js=r.read().decode('utf-8','replace')
          print('BUNDLE_BYTES:',len(js))
          for pattern in [r'https?://[^"\\s<>]{8,180}',r'[^"\\s]{0,90}(?:api/|graphql|search|ricerca|patrimonio)[^"\\s]{0,110}']:
              found=list(dict.fromkeys(re.findall(pattern,js,flags=re.I)))
              print('PATTERN:',pattern,'MATCH_COUNT:',len(found))
              for item in found[:20]:
                  print('CANDIDATE:',item[:220])
          PY
      - name: Extract high-signal API configuration from public bundle
        if: always()
        run: |
          python - <<'PY'
          import re
          from urllib.request import Request,urlopen
          url='https://asve.arianna4.cloud/main.b2709b386ffc0a41.js'
          js=urlopen(Request(url,headers={'User-Agent':'GERAKI-Research/1.0'}),timeout=40).read().decode('utf-8','replace')
          needles=['graphql','apiUrl','api_url','baseUrl','baseURL','environment','patrimonio/','/search','ricerca']
          for needle in needles:
              print('===',needle,'===')
              starts=[m.start() for m in re.finditer(re.escape(needle),js,re.I)]
              print('COUNT',len(starts))
              for pos in starts[:12]:
                  print(re.sub(r'\\s+',' ',js[max(0,pos-260):pos+420])[:700])
          PY
      - name: Extract GraphQL request configuration for search
        if: always()
        run: |
          python - <<'PY'
          import re
          from urllib.request import Request,urlopen
          u='https://asve.arianna4.cloud/main.b2709b386ffc0a41.js'
          js=urlopen(Request(u,headers={'User-Agent':'GERAKI-Research/1.0'}),timeout=40).read().decode('utf-8','replace')
          for needle in ['getSearch','searchResults','autocomplete','getAutocomplete','getScheda','getItem','queryBody','queryName']:
              print('###',needle)
              hits=[m.start() for m in re.finditer(re.escape(needle),js,re.I)]
              print('COUNT',len(hits))
              for p in hits[:25]:
                  print(re.sub(r'\\s+',' ',js[max(0,p-700):p+1200])[:1900])
          PY
      - name: Extract search parameter construction and autocomplete calls
        if: always()
        run: |
          python - <<'PY'
          import re
          from urllib.request import Request,urlopen
          js=urlopen(Request('https://asve.arianna4.cloud/main.b2709b386ffc0a41.js',headers={'User-Agent':'GERAKI-Research/1.0'}),timeout=40).read().decode('utf-8','replace')
          needles=['request$("autoComplete"','request$("search"','doSearchRequest$()','getRequestParams()','homeAutocompleteQuery','autocompleteQuery']
          for needle in needles:
              print('@@@',needle)
              hits=[m.start() for m in re.finditer(re.escape(needle),js)]
              print('COUNT',len(hits))
              for p in hits[:20]:
                  print(re.sub(r'\\s+',' ',js[max(0,p-1000):p+1600])[:2600])
          PY
      - name: Verify live official Venetian archival description
        run: |
          python connectors/moreveneto_record_verify.py 'https://asve.arianna4.cloud/patrimonio/73a0c098-e94f-49d6-a27d-d20acde2b11f/0985-fondo-luogotenente-alla-patria-del-friuli-%5Budine%5D' > /tmp/moreveneto.json
          python - <<'PY'
          import json
          with open('/tmp/moreveneto.json', encoding='utf-8') as f:
              data=json.load(f)
          assert data['status']=='RECORD_VERIFIED'
          assert data['scope']=='known_record_url_only'
          assert data['custodian_confirmed'] and data['date_metadata_present']
          print('VERIFIED RECORD:',data['record_uuid'],data['record_url'])
          PY
