name: JARVIS Controlled Dispatch

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Optional UI request correlation ID"
        required: false
        type: string
      target:
        description: "Research target"
        required: true
        type: string
      aliases:
        description: "Aliases separated by |"
        required: false
        type: string
      date_range:
        description: "Date range"
        required: false
        type: string
      purpose:
        description: "Research question / scope"
        required: true
        type: string
      selected_agents:
        description: "Optional manual override. Leave blank for JARVIS automatic selection."
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'jarvis_dispatch_requests/*.json'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            tools
            jarvis_dispatch_requests
            evidence/jarvis/dispatch_audit

      - id: request
        name: Resolve one explicit request
        shell: bash
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_ALIASES: ${{ inputs.aliases }}
          INPUT_DATE_RANGE: ${{ inputs.date_range }}
          INPUT_PURPOSE: ${{ inputs.purpose }}
          INPUT_SELECTED_AGENTS: ${{ inputs.selected_agents }}
        run: |
          set -euo pipefail
          mkdir -p .jarvis_runtime
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 - <<'PY'
          import json, os, pathlib
          req={
            "target": os.environ.get("INPUT_TARGET","").strip(),
            "aliases": [x.strip() for x in os.environ.get("INPUT_ALIASES","").split("|") if x.strip()],
            "date_range": os.environ.get("INPUT_DATE_RANGE","").strip(),
            "purpose": os.environ.get("INPUT_PURPOSE","").strip(),
            "selected_agents": [x.strip() for x in os.environ.get("INPUT_SELECTED_AGENTS","").split(",") if x.strip()]
          }
          p=pathlib.Path('.jarvis_runtime/request.json')
          p.write_text(json.dumps(req,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            echo "request_file=.jarvis_runtime/request.json" >> "$GITHUB_OUTPUT"
          else
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r HEAD -- 'jarvis_dispatch_requests/*.json')
            if [ "${#changed[@]}" -ne 1 ]; then echo "Expected exactly one changed JARVIS request" >&2; exit 1; fi
            echo "request_file=${changed[0]}" >> "$GITHUB_OUTPUT"
          fi

      - id: jarvis
        name: JARVIS plans agents and validates guarded dispatch
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python3 tools/orchestrator/jarvis_dispatch.py \
            --request "${{ steps.request.outputs.request_file }}" \
            --run-id "${{ github.run_id }}" \
            --request-id "$REQUEST_ID" \
            --github-output "$GITHUB_OUTPUT" \
            --write-audit ".jarvis_runtime/dispatch_audit.json"

      - name: Dispatch JARVIS-planned unified research run
        env:
          GH_TOKEN: "${{ github.token }}"
          REQUEST_ID: "${{ inputs.request_id }}"
          TARGET: "${{ steps.jarvis.outputs.target }}"
          ALIASES: "${{ steps.jarvis.outputs.aliases }}"
          DATE_RANGE: "${{ steps.jarvis.outputs.date_range }}"
          PURPOSE: "${{ steps.jarvis.outputs.purpose }}"
          SELECTED_AGENTS: "${{ steps.jarvis.outputs.workflow_selected_agents }}"
          JARVIS_SELECTED_AGENTS: "${{ steps.jarvis.outputs.selected_agents }}"
        run: |
          gh workflow run pct-parallel-multi-agent.yml \
            --ref main \
            -f request_id="$REQUEST_ID" \
            -f target="$TARGET" \
            -f aliases="$ALIASES" \
            -f date_range="$DATE_RANGE" \
            -f purpose="$PURPOSE" \
            -f selected_agents="$SELECTED_AGENTS"
          echo "JARVIS_CONTROLLED_DISPATCH_SENT planned_agents=$JARVIS_SELECTED_AGENTS workflow_filter=$SELECTED_AGENTS"
          echo "Specialist agents are launched once inside pct-parallel-multi-agent.yml."

      - name: Test control plane
        run: |
          python3 -m compileall -q tools/orchestrator
          PYTHONPATH=tools/orchestrator python3 -m unittest \
            tools/orchestrator/test_jarvis_agent_planner.py \
            tools/orchestrator/test_jarvis_dispatch.py \
            tools/orchestrator/test_research_query.py -v

      - name: Commit append-only dispatch audit
        run: |
          set -euo pipefail
          mkdir -p evidence/jarvis/dispatch_audit
          test ! -e "evidence/jarvis/dispatch_audit/${{ github.run_id }}.json"
          cp .jarvis_runtime/dispatch_audit.json "evidence/jarvis/dispatch_audit/${{ github.run_id }}.json"
          git config user.name "jarvis-orchestrator[bot]"
          git config user.email "jarvis-orchestrator@users.noreply.github.com"
          git add "evidence/jarvis/dispatch_audit/${{ github.run_id }}.json"
          git commit -m "JARVIS approve controlled dispatch ${{ github.run_id }}"
          bash tools/push_with_retry.sh
