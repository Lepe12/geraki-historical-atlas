name: Real multilingual research query diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/research-query-language-validation.yml','tools/research_semantic_queries.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  query-language:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: person
            request: library_discovery_requests/lantzas-engine-acceptance-20261020.json
          - case: topic
            request: library_discovery_requests/eastern-med-1600-1700-engine-validation-20261020.json
    env:
      PCT_LLM_PROVIDER: local_llama_cpp
      PCT_LOCAL_MODEL_REPOSITORY: Qwen/Qwen3-8B-GGUF
      PCT_LLM_MODEL: Qwen/Qwen3-8B-GGUF
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/actions
            tools
            library_discovery_requests
            evidence/configuration
      - uses: ./.github/actions/research-model
      - name: Compile the actual constrained query schema
        run: |
          PYTHONPATH=tools python3 - <<'PY'
          import json
          from llama_cpp import LlamaGrammar
          from research_response_schema import query_expansion
          lanes=['greek','travellers','venetian','french','british','spanish_simancas','ottoman','italian_states','dutch','german','north_african']
          LlamaGrammar.from_json_schema(json.dumps(query_expansion(lanes)),verbose=False)
          print('ACTUAL_QUERY_GRAMMAR_COMPILED_NOT_SOURCE_RESEARCH_ACCEPTANCE')
          PY
      - name: Run actual multilingual query expansion
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools python3 tools/research_semantic_queries.py --request "${{ matrix.request }}" --output "evidence/configuration/$GITHUB_RUN_ID/query-language-validation-${{ matrix.case }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-query-language-diagnostic-${{ matrix.case }}
          path: evidence/configuration/${{ github.run_id }}/
      - name: Persist actual diagnostic without claiming source research acceptance
        if: always()
        run: |
          set -e
          destination="evidence/configuration/$GITHUB_RUN_ID"
          if [ ! -d "$destination" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          git commit -m 'Record real multilingual query generation diagnostic'
          python3 tools/publish_research_outputs.py
