name: N7 exact search HTTP 400 fix
on:
  push:
    branches: [main]
    paths:
      - ops_ftps_requests/n7-search-400-fix.json
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    environment: nabou-production
    timeout-minutes: 7
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
      PCT_FTPS_TLS_SERVER_NAME: ${{ vars.PCT_FTPS_TLS_SERVER_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools/library
            ops_ftps_requests
      - name: Confirm one-file production fix scope
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          request=json.loads(Path('ops_ftps_requests/n7-search-400-fix.json').read_text())
          assert request['authorization']=='FIX-N7-SEARCH-400'
          assert request['scope']=='bot-server-validation-only'
          PY
          python3 -m py_compile tools/library/fix_n7_search_http400_ftps.py
      - name: Patch live validator with FTPS staged hash and backup
        run: python3 tools/library/fix_n7_search_http400_ftps.py
      - name: Verify live N7 health and unaffected backend
        run: |
          python3 - <<'PY'
          import urllib.request
          for u in ('https://bot.piratecartography.com/health','https://pct-live.piratecartography.com/pct-api/live/health'):
              with urllib.request.urlopen(u,timeout=20) as r:
                  assert r.status==200
                  print('HEALTH_PASS',u.split('/')[2])
          PY
