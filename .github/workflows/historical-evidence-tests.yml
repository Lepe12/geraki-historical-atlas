name: Historical Evidence and Learning Integration Tests
on:
  push:
    branches:
      - feat/historical-attestation-foundation-20261019
      - main
    paths:
      - 'tools/research_continuation.py'
      - 'tools/research_shard_replay.py'
      - 'tools/test_research_shard_replay.py'
      - 'tools/cited_work_acquisition.py'
      - 'tools/continue_citation_acquisition.py'
      - 'tools/test_research_continuation.py'
      - 'tools/semantic_research_answer.py'
      - 'tools/test_surname_section_anchor.py'
      - 'tools/test_adjacent_sentence_identity.py'
      - 'tools/claim_fidelity_guard.py'
      - 'tools/fixtures/kapsis_saulger_336_340.json'
      - 'tools/research_relevance.py'
      - 'tools/research_validation_report.py'
      - 'tools/probe_evidence_production.py'
      - 'tools/historical_attestations.py'
      - 'tools/storage/historical_evidence*'
      - 'tools/storage/validate_mariadb_evidence.py'
      - 'tools/research_evidence_bridge.py'
      - 'tools/historical_authority_resolver.py'
      - 'tools/historical_research_graph.py'
      - 'tools/persistent_evidence_bundle.py'
      - 'tools/test_historical_context.py'
      - 'tools/prepare_acquired_analysis.py'
      - 'tools/research_response_schema.py'
      - 'tools/llm/local_model.py'
      - 'tools/llm/llm_client.py'
      - 'tools/test_acquired_analysis.py'
      - 'tools/test_research_response_schema.py'
      - 'tools/storage/historical_evidence.php'
      - 'tools/storage/pct_research_store.php'
      - 'tools/storage/evidence_schema_request.php'
      - 'tools/storage/test_evidence_schema_request.php'
      - 'server/command-center-live/**'
      - '.github/workflows/historical-evidence-tests.yml'
  pull_request:
  workflow_dispatch:
jobs:
  evidence-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax and source-first agent/evidence tests
        run: |
          python3 -m compileall -q tools/historical_attestations.py tools/research_evidence_bridge.py tools/orchestrator/jarvis_specialist_worker.py tools/storage/historical_evidence_store.py
          PYTHONPATH=.:tools python3 -m unittest -v tools.test_historical_attestations tools.test_research_evidence_bridge tools.storage.test_historical_evidence_store tools.test_historical_context
      - name: Existing Node command-center tests
        run: node server/command-center-live/self-test.js
      - name: Install public PDF and OCR tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ell
      - name: PDF Learning HTTP integration tests
        run: node server/command-center-live/learning-integration-test.js
      - name: Actual acquired PDF reading order and constrained response protocols
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.:tools:tools/llm python3 -m unittest -v tools.test_acquired_analysis tools.test_source_acquisition_routes tools.test_research_response_schema tools.test_semantic_research_answer tools.test_claim_fidelity_guard tools.test_relevance_filter tools.test_research_continuation tools.test_surname_section_anchor tools.test_adjacent_sentence_identity
      - name: Source-bound shard replay and continuation regressions
        run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.:tools:tools/llm python3 -m unittest tools.test_research_shard_replay tools.test_semantic_shards tools.test_research_continuation tools.test_excerpt_ranking_continuation tools.test_research_manual_resume tools.test_research_continuation_handoff
      - name: Actual image-only PDF OCR and bounding boxes
        run: |
          python3 -m pip install 'Pillow==12.0.0'
          python3 server/command-center-live/pdf-evidence-integration-test.py
  real-mariadb:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: isolated-ci-fixture-only
          MARIADB_DATABASE: piratecartography
        ports: ['33077:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      PCT_ISOLATED_DATABASE_TEST: 'yes'
      PCT_TEST_DB_PORT: '33077'
      PCT_TEST_DB_PASSWORD: isolated-ci-fixture-only
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'PyMySQL==1.1.2'
      - run: python3 tools/storage/validate_mariadb_evidence.py --receipt /tmp/evidence-database-test.json
      - name: Existing host PHP adapter and backup/restore integration
        run: |
          php -l tools/storage/pct_research_store.php
          php tools/storage/pct_research_store.php self-test-parser
          php tools/storage/test_historical_evidence_live.php
          php tools/storage/test_evidence_schema_request.php > /tmp/evidence-schema-request-test.json
          cat /tmp/evidence-schema-request-test.json
      - name: Restart actual isolated DB server
        run: |
          docker restart '${{ job.services.database.id }}'
          for n in $(seq 1 30); do
            if docker exec '${{ job.services.database.id }}' healthcheck.sh --connect --innodb_initialized; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: python3 tools/storage/validate_mariadb_evidence.py --receipt /tmp/evidence-database-test.json --read-after-restart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-mariadb-validation
          path: |
            /tmp/evidence-database-test.json
            /tmp/evidence-schema-request-test.json

