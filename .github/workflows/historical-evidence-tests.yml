name: Historical Evidence Foundation Tests
on:
  push:
    branches:
      - feat/historical-attestation-foundation-20261019
    paths:
      - "tools/historical_attestations.py"
      - "tools/test_historical_attestations.py"
      - "tools/storage/historical_evidence_store.py"
      - "tools/storage/test_historical_evidence_store.py"
      - ".github/workflows/historical-evidence-tests.yml"
  workflow_dispatch:
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evidence unit tests
        run: python -m unittest tools.test_historical_attestations tools.storage.test_historical_evidence_store -v
