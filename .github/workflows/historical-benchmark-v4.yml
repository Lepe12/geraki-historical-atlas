name: Historical Benchmark v4

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/v4/**'
      - 'tools/benchmark_v4_manifest.py'
      - 'tools/benchmark_v4_score.py'
      - 'tools/test_benchmark_v4.py'
      - 'tools/benchmark_v4_review_packet.py'
      - 'tools/test_benchmark_v4_review_packet.py'
      - '.github/workflows/historical-benchmark-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-benchmark-v4
  cancel-in-progress: false

jobs:
  benchmark-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Compile Benchmark v4
        run: |
          python3 -m py_compile \
            tools/benchmark_v4_manifest.py \
            tools/benchmark_v4_score.py \
            tools/test_benchmark_v4.py \
            tools/benchmark_v4_review_packet.py \
            tools/test_benchmark_v4_review_packet.py

      - name: Run Benchmark v4 regression tests
        env:
          PYTHONPATH: tools
        run: |
          python3 tools/test_benchmark_v4.py
          python3 tools/test_benchmark_v4_review_packet.py

      - name: Freeze bound baseline evidence
        env:
          PYTHONPATH: tools
        run: python3 tools/benchmark_v4_manifest.py

      - name: Build blinded review packets
        env:
          PYTHONPATH: tools
        run: python3 tools/benchmark_v4_review_packet.py

      - name: Score fail-closed
        env:
          PYTHONPATH: tools
        run: |
          python3 tools/benchmark_v4_score.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('benchmarks/v4/results/SUMMARY.json').read_text(encoding='utf-8'))
          allowed={'WAITING_FOR_FRESH_BLIND_RUNS','WAITING_FOR_DUAL_HUMAN_REVIEW','WAITING_FOR_ADJUDICATION','VALID'}
          assert s['metrics_status'] in allowed,s
          if s['metrics_status']!='VALID':
              # Scientific safeguard: no invented headline accuracy.
              assert s['candidate_precision'] is None,s
              assert s['reference_case_recall'] is None,s
          print('BENCHMARK V4 GATE PASS',s['metrics_status'])
          PY

      - name: Preserve v4 frozen manifest and summary
        run: |
          git config user.name "benchmark-v4[bot]"
          git config user.email "benchmark-v4@users.noreply.github.com"
          git add benchmarks/v4/CURRENT_MANIFEST.json benchmarks/v4/results/SUMMARY.json benchmarks/v4/review_packets/
          git diff --cached --quiet && exit 0
          git commit -m "Update Historical Benchmark v4 frozen baseline"
          git pull --rebase origin main
          git push origin HEAD:main
