name: N7 Niki actual browser voice + approved public KV asset
on:
  pull_request:
    paths:
      - 'tools/n7_apex_preview/probe_niki_native_state.py'
      - 'tools/n7_apex_preview/N7PocketCore.js'
      - 'tools/n7_apex_preview/N7NikiVoiceWorker.js'
      - 'tools/n7_apex_preview/test_niki_real_browser.cjs'
      - '.github/workflows/n7-niki-actual-browser.yml'
permissions:
  contents: read
concurrency:
  group: n7-niki-voice-browser-test
  cancel-in-progress: true
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/n7_apex_preview/probe_niki_native_state.py
            tools/n7_apex_preview/N7PocketCore.js
            tools/n7_apex_preview/N7NikiVoiceWorker.js
            tools/n7_apex_preview/test_niki_real_browser.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tested local Greek voice exporter
        run: python -m pip install --disable-pip-version-check --no-input pocket-tts
      - name: Export Niki attention state, check exact reference and browser architecture
        env:
          N7_NIKI_KV_PATH: ${{ runner.temp }}/n7-niki-voice-v1.bin
        run: |
          python tools/n7_apex_preview/probe_niki_native_state.py
          test "$(wc -c < "$RUNNER_TEMP/n7-niki-voice-v1.bin")" -eq 4374548
          test "$(head -c4 "$RUNNER_TEMP/n7-niki-voice-v1.bin")" = "PKV1"
          sha256sum "$RUNNER_TEMP/n7-niki-voice-v1.bin"
      - name: Create minimal same-origin voice browser test
        run: |
          mkdir -p "$RUNNER_TEMP/n7-niki-browser"
          cp tools/n7_apex_preview/N7PocketCore.js "$RUNNER_TEMP/n7-niki-browser/n7-pocket-core-v1.js"
          cp tools/n7_apex_preview/N7NikiVoiceWorker.js "$RUNNER_TEMP/n7-niki-browser/n7-niki-voice-worker-v1.js"
          PINNED_SHA="$(sha256sum "$RUNNER_TEMP/n7-niki-voice-v1.bin" | cut -d' ' -f1)"
          sed -i "s/32df1aba20ef7bcc0a048e9edfff2d756d8db38913ebfd111ceb662369dab489/$PINNED_SHA/g" "$RUNNER_TEMP/n7-niki-browser/n7-niki-voice-worker-v1.js"
          cp "$RUNNER_TEMP/n7-niki-voice-v1.bin" "$RUNNER_TEMP/n7-niki-browser/n7-niki-voice-v1.bin"
          printf '<!doctype html><html lang="el"><meta charset="utf-8"><title>N7 Niki voice smoke test</title><body>N7 voice smoke test</body></html>' > "$RUNNER_TEMP/n7-niki-browser/index.html"
          node --input-type=module --check < tools/n7_apex_preview/N7NikiVoiceWorker.js
          npm install --prefix "$RUNNER_TEMP/n7-niki-browser-modules" --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          python3 -m http.server 4219 --directory "$RUNNER_TEMP/n7-niki-browser" > "$RUNNER_TEMP/n7-niki-http.log" 2>&1 &
      - name: Assert real Greek wave from downloaded browser ONNX and Niki voice
        env:
          NODE_PATH: ${{ runner.temp }}/n7-niki-browser-modules/node_modules
          CHROME_BIN: /usr/bin/google-chrome
        run: node tools/n7_apex_preview/test_niki_real_browser.cjs
