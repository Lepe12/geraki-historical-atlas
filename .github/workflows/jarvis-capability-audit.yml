name: JARVIS Capability Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/orchestrator/**'
      - '.github/workflows/jarvis-*.yml'
      - 'connectors/**'
      - 'tools/connectors/**'
      - 'tools/storage/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile orchestrator
        run: python3 -m compileall -q tools/orchestrator
      - name: Run JARVIS unit tests
        run: |
          PYTHONPATH=tools/orchestrator python3 -m unittest \
            tools/orchestrator/test_jarvis_agent_planner.py \
            tools/orchestrator/test_jarvis_dispatch.py \
            tools/orchestrator/test_jarvis_escalate.py \
            tools/orchestrator/test_jarvis_observer.py \
            tools/orchestrator/test_jarvis_recovery.py \
            tools/orchestrator/test_jarvis_runtime_guard.py -v
      - name: Fail if specialist worker gains arbitrary execution primitives
        run: |
          ! grep -En 'subprocess|os\.system|shell=True|\beval\(|\bexec\(' tools/orchestrator/jarvis_specialist_worker.py
          grep -q 'validate_specialist_assignment' tools/orchestrator/jarvis_specialist_worker.py
          grep -q '"allow_arbitrary_code": false' tools/orchestrator/jarvis_policy.json
          grep -q '"allow_shell": false' tools/orchestrator/jarvis_policy.json
          grep -q '"allow_subprocess": false' tools/orchestrator/jarvis_policy.json
      - name: Fail if controlled dispatch duplicates specialist research
        run: |
          test "$(grep -c 'gh workflow run pct-parallel-multi-agent.yml' .github/workflows/jarvis-controlled-dispatch.yml)" -eq 1
          ! grep -q 'gh workflow run jarvis-specialist-research.yml' .github/workflows/jarvis-controlled-dispatch.yml
          grep -q 'workflow_selected_agents' .github/workflows/jarvis-controlled-dispatch.yml
          grep -q '"require_explicit_selected_agents": false' tools/orchestrator/jarvis_policy.json
          grep -q '"auto_select_agents": true' tools/orchestrator/jarvis_policy.json
      - name: Test Greek and Academia discovery connector
        env:
          PYTHONPATH: tools/connectors
        run: |
          python3 -m py_compile tools/connectors/repository_connectors.py
          python3 -m unittest tools/connectors/test_academia_public.py -v
      - name: Static capability self-test
        run: python3 tools/orchestrator/jarvis_self_test.py --output jarvis_self_test.json
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-capability-audit-${{ github.run_id }}
          path: jarvis_self_test.json
