name: Airtable durable backup
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export Airtable records
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,pathlib,datetime
          token=os.environ.get("AIRTABLE_TOKEN")
          if not token: raise SystemExit("Missing Actions secret AIRTABLE_TOKEN")
          base="appML9NlhzlVMoGjb"
          tables={
            "PLACES":"tbluvDJfE42j5qxMa",
            "SOURCES":"tblVnmghyTX7B2EgD",
            "EVENTS":"tblr7KI6LCxpFnp1I",
            "ROUTES":"tblsRfozlMSZ03w7M",
            "RESEARCH_JOBS":"tblXWi37TDh1ZqrX6",
          }
          stamp=datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          root=pathlib.Path("backups/airtable/records")/stamp
          root.mkdir(parents=True,exist_ok=True)
          manifest={"schema":"pct-airtable-record-backup-v1","base_id":base,"created_utc":stamp,"tables":{}}
          for name,tid in tables.items():
            records=[]; offset=None
            while True:
              q={"pageSize":"100","returnFieldsByFieldId":"true"}
              if offset:q["offset"]=offset
              url=f"https://api.airtable.com/v0/{base}/{tid}?"+urllib.parse.urlencode(q)
              req=urllib.request.Request(url,headers={"Authorization":f"Bearer {token}"})
              with urllib.request.urlopen(req,timeout=60) as r: payload=json.load(r)
              records.extend(payload.get("records",[]));offset=payload.get("offset")
              if not offset:break
            p=root/f"{name}.json"
            p.write_text(json.dumps({"table_id":tid,"records":records},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
            manifest["tables"][name]={"table_id":tid,"records":len(records),"file":p.name}
          (root/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(manifest,ensure_ascii=False))
          PY
      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/airtable/records/
          git diff --cached --quiet && exit 0
          git commit -m "Automated Airtable records backup"
          git pull --rebase origin main
          git push origin HEAD:main
