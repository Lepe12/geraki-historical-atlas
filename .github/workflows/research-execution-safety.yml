name: Research execution safety
on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'server/command-center-live/pdf-evidence.py'
      - 'server/command-center-live/learning-integration-test.js'
      - 'server/command-center-live/pdf-evidence.js'
      - '.github/workflows/*research*.yml'
      - '.github/workflows/pct-parallel-multi-agent.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'server/command-center-live/pdf-evidence.py'
      - 'server/command-center-live/learning-integration-test.js'
      - 'server/command-center-live/pdf-evidence.js'
      - '.github/workflows/*research*.yml'
      - '.github/workflows/pct-parallel-multi-agent.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This job does not read research evidence; skip the multi-GB
          # evidence/ tree (see repo_size plan, option A).
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/runs/
            !/evidence/specialist_runs/
            !/backups/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source dossier interface
        run: node --test jarvis-intelligence-chamber/source-dossier.test.cjs
      - name: Verify execution isolation and real Git output publication
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: tools:tools/orchestrator:tools/llm
        run: python -m unittest tools.test_research_priority tools.test_research_continuation tools.test_research_continuation_handoff tools.test_excerpt_ranking_continuation tools.test_research_execution_safety tools.test_audit_reference_recall tools.test_citation_search tools.test_cited_work_acquisition tools.test_research_focus tools.test_fulltext_discovery tools.orchestrator.test_research_query tools.test_research_pipeline_repairs tools.test_section_extraction tools.test_research_evidence_package tools.test_semantic_research_answer tools.test_research_topics tools.test_research_engine_validation tools.connectors.test_http_audit tools.test_zotero_sync -q
      - name: Verify local PDF replay runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-eng
          command -v pdfinfo
          command -v pdftotext
          command -v tesseract
      - name: Verify historical evidence, agent bridge and PDF Learning HTTP integration
        run: |
          python -m unittest tools.test_historical_attestations tools.test_research_evidence_bridge tools.storage.test_historical_evidence_store -v
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools:tools/orchestrator:tools/llm python -m unittest tools.test_derived_source_store -v
          node server/command-center-live/self-test.js
          node server/command-center-live/learning-integration-test.js


