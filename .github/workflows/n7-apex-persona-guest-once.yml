name: N7 APEX guest persona guarded live upgrade
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
concurrency:
  group: n7-apex-guest-persona-live
  cancel-in-progress: false
jobs:
  guarded-guest-upgrade:
    if: github.head_ref == 'feat/n7-apex-distinct-personality' && github.event.pull_request.head.repo.full_name == github.repository
    environment: nabou-production
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/n7_apex_preview/n7-apex-public-chat.cjs
            tools/n7_apex_preview/deploy_public_chat.py
            tools/n7_apex_preview/deploy_apex_preview.py
            tools/n7_apex_preview/test_public_chat.cjs
            tools/n7_apex_preview/test_deploy_public_chat.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify guest prompt, privacy isolation and safe server patch
        run: |
          node --check tools/n7_apex_preview/n7-apex-public-chat.cjs
          node --test tools/n7_apex_preview/test_public_chat.cjs
          python3 tools/n7_apex_preview/test_deploy_public_chat.py
      - name: Check live module preflight without file writes
        env:
          N7_DRY_RUN: '1'
        run: |
          for n in 1 2 3; do
            python3 tools/n7_apex_preview/deploy_public_chat.py && exit 0
            echo "APEX_GUEST_FTPS_RETRY=$n"
            sleep 8
          done
          exit 1
      - name: Activate updated guest persona with rollback, restart and real model smoke
        env:
          N7_DRY_RUN: '0'
        run: python3 tools/n7_apex_preview/deploy_public_chat.py
      - name: Public guest conversation behavioral smoke (no owner data)
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          origin='https://bot.piratecartography.com'
          question='Τι πιστεύεις για έναν ιστορικό χάρτη πειρατείας;'
          req=urllib.request.Request(origin+'/api/n7-apex/chat',
            data=json.dumps({'messages':[{'role':'user','content':question}]}).encode(),
            headers={'Origin':origin,'Content-Type':'application/json','User-Agent':'N7-Owner-Approved-Character-Test'})
          with urllib.request.urlopen(req,timeout=60) as res:reply=json.load(res)['reply']
          if not isinstance(reply,str) or len(reply.strip())<15:raise RuntimeError('N7_PERSONALITY_REAL_MODEL_NO_ANSWER')
          print('N7_APEX_REAL_MODEL_RESPONDED=true')
          print('N7_APEX_MODEL_EXAMPLE='+reply.replace('\\n',' ').replace('\\r',' ')[:360])
          for path in ('/api/conversations','/api/tasks'):
            try:urllib.request.urlopen(origin+path,timeout=12)
            except urllib.error.HTTPError as exc:
              if exc.code==401:continue
              raise
            raise RuntimeError('N7_OWNER_ROUTES_EXPOSED')
          print('N7_APEX_GUEST_PERSONA_VERIFIED=true owner_auth_401=true')
          PY
