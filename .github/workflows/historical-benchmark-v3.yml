name: Historical Benchmark v3

on:
  push:
    branches: [main]
    paths:
      - 'tools/benchmark_v3_manifest.py'
      - 'tools/benchmark_v3_score.py'
      - 'tools/test_benchmark_v3.py'
      - 'tools/evaluate_live_benchmark.py'
      - 'benchmarks/historical_benchmark_v1.json'
      - 'benchmarks/evaluation_requests/*.json'
      - 'benchmarks/v3/config.json'
      - 'benchmarks/v3/labels/HUMAN_LABELS.json'
      - '.github/workflows/historical-benchmark-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-benchmark-v3
  cancel-in-progress: false

jobs:
  benchmark-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Compile benchmark code
        run: python3 -m compileall -q tools/benchmark_v3_manifest.py tools/benchmark_v3_score.py tools/test_benchmark_v3.py tools/evaluate_live_benchmark.py

      - name: Run Benchmark v3 regression tests
        run: python3 tools/test_benchmark_v3.py

      - name: Freeze current candidate manifest
        run: python3 tools/benchmark_v3_manifest.py --output benchmarks/v3/CURRENT_MANIFEST.json

      - name: Re-evaluate frozen cases with evaluator v3
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path('benchmarks/v3/CURRENT_MANIFEST.json').read_text(encoding='utf-8'))
          for c in m.get('cases',[]):
              if not c.get('run_present'):
                  continue
              subprocess.check_call([
                  'python3','tools/evaluate_live_benchmark.py',
                  '--run-id',str(c['run_id']),
                  '--case-id',c['case_id']
              ])
          PY

      - name: Score Benchmark v3
        run: |
          python3 tools/benchmark_v3_score.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('benchmarks/v3/results/SUMMARY.json').read_text())
          if s['official_human_label_count']==0:
              assert s['precision'] is None
              assert s['metrics_status']=='WAITING_FOR_HUMAN_LABELS'
          print('BENCHMARK V3 GATE PASS',s['metrics_status'],'precision',s['precision'],'recall',s['recall'])
          PY

      - name: Preserve v3 baseline
        run: |
          git config user.name "benchmark-v3[bot]"
          git config user.email "benchmark-v3@users.noreply.github.com"
          git add benchmarks/v3/CURRENT_MANIFEST.json benchmarks/v3/results/SUMMARY.json benchmarks/results/
          git diff --cached --quiet && exit 0
          git commit -m "Update Historical Benchmark v3 baseline"
          git pull --rebase origin main
          git push origin HEAD:main
