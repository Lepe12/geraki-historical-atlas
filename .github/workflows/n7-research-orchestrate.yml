name: N7 Research Orchestrate
run-name: N7 Mission ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'N7 signed operator request ID'
        required: true
        type: string
      target:
        description: 'Historical research target'
        required: true
        type: string
      purpose:
        description: 'Research question'
        required: true
        type: string
      date_range:
        description: 'Date range'
        required: false
        type: string
      aliases:
        description: 'Aliases separated by |'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: n7-owner-research-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  public-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools
            config
            data
      - name: Install bounded public PDF reader
        run: python3 -m pip install --disable-pip-version-check pypdf==6.4.0
      - name: Run bounded public-source research without a model
        env:
          PYTHONPATH: .:tools:tools/orchestrator:tools/connectors
          PCT_COMMAND_CENTER_URL: https://pct-live.piratecartography.com/pct-api/live
          REQUEST_ID: ${{ inputs.request_id }}
          TARGET: ${{ inputs.target }}
          PURPOSE: ${{ inputs.purpose }}
          DATE_RANGE: ${{ inputs.date_range }}
          ALIASES: ${{ inputs.aliases }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_ID" =~ ^n7mission-[a-f0-9]{24}$ ]]
          mission_root="$RUNNER_TEMP/n7-owner-mission"
          python3 tools/orchestrator/n7_mission.py init --root "$mission_root" --run-id "$REQUEST_ID" \
            --target "$TARGET" --purpose "$PURPOSE" --date-range "$DATE_RANGE" --aliases "$ALIASES" >/dev/null
          python3 tools/orchestrator/n7_mission.py run-until-exhausted \
            --root "$mission_root" --run-id "$REQUEST_ID" >/dev/null
      - name: Prepare bounded owner report
        if: always()
        id: report
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re
          from pathlib import Path
          request_id = os.environ["REQUEST_ID"]
          if not re.fullmatch(r"n7mission-[a-f0-9]{24}", request_id):
              raise SystemExit("INVALID_MISSION_REQUEST_ID")
          root = Path(os.environ["RUNNER_TEMP"])
          mission = root / "n7-owner-mission" / request_id
          report_file = mission / "report.json"
          if not report_file.is_file():
              raise SystemExit("N7_REPORT_UNAVAILABLE")
          report = json.loads(report_file.read_text())
          if report["historically_verified"] is not False:
              raise SystemExit("N7_REPORT_UNSAFE")
          state = {"DISCOVERY_FINISHED": "complete", "INCOMPLETE": "incomplete"}[report["status"]]
          out = root / "n7-public-source-report"
          out.mkdir()
          dossier = json.loads((mission / "research_dossier.json").read_text())
          dossier["claim_assessment"]["subject"] = "Historical research in public sources"
          from tools.orchestrator.n7_research_dossier import render_markdown
          (out / "research_dossier.md").write_text(render_markdown(dossier), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              print(f"status={state}", file=fh)
          PYCODE
      - name: Attach source-linked research report
        if: steps.report.outputs.status != ''
        uses: actions/upload-artifact@v4
        with:
          name: n7-owner-public-evidence-${{ steps.report.outputs.status }}
          path: ${{ runner.temp }}/n7-public-source-report/research_dossier.md
          retention-days: 30
          if-no-files-found: error
