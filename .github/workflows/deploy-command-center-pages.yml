name: Audit Research Command Center (Atlas owns Pages deployment)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'command-center/**'
      - '.github/workflows/deploy-command-center-pages.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Command Center files
        run: |
          test -s command-center/index.html
          test -s command-center/command-center.css
          test -s command-center/command-center.js
          node --check command-center/command-center.js
          grep -q 'id="map"' command-center/index.html
          grep -q 'maplibregl.Map' command-center/command-center.js
          ! grep -q 'loadPreviewData' command-center/command-center.js
