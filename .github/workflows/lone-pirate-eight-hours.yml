name: Lone Pirate — Eight Hour Autonomous Experiment
on:
  push:
    paths:
      - 'lone-pirate-eko/EIGHT_HOUR_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: lone-pirate-eight-hours
  cancel-in-progress: true
jobs:
  pirate_1:
    runs-on: ubuntu-latest
    timeout-minutes: 255
    steps:
      - name: Cancel prior pirate experiment runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/lone-pirate-eight-hours.yml/runs?status=in_progress&per_page=30" --jq '.workflow_runs[].id' | while read -r run_id; do
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check agent controller
        run: python -m py_compile lone-pirate-eko/run_agent.py
      - name: Check real model access
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Configure repository secret GROQ_API_KEY before running; no fake AI will be used."
            exit 1
          fi
      - name: Install Clawblox
        run: |
          curl -fsSL https://clawblox.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start embodied Clawblox world
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          clawblox run lone-pirate-eko --record --record-dir lone-pirate-eko/recordings > /tmp/clawblox.log 2>&1 &
          echo $! > /tmp/clawblox.pid
          for n in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api.md >/dev/null; then echo "Clawblox ready"; exit 0; fi
            sleep 2
          done
          cat /tmp/clawblox.log
          exit 1
      - name: Run real LLM-controlled experiment
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_LIVE_TOKEN: ${{ github.token }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          DURATION_MINUTES: ${{ '240' }}
          MAX_CALLS: ${{ '50' }}
          PAUSE_SECONDS: "10"
          PIRATE_STAGE: "1"
        run: python lone-pirate-eko/run_agent.py
      - name: Save experiment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lone-pirate-eight-hour-1
          path: |
            lone-pirate-eko/log.json
            lone-pirate-eko/recordings/
          if-no-files-found: warn
      - name: Publish verified run log for website
        if: always()
        continue-on-error: true # Publishing must never prevent stage 2 from starting.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f lone-pirate-eko/log.json ]; then exit 0; fi
          # Update a single file through GitHub's Contents API, not git pull --rebase.
          # Concurrent live-log updates can change the file SHA; retry with the new SHA.
          content=$(base64 -w 0 lone-pirate-eko/log.json)
          for attempt in 1 2 3 4 5; do
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/lone-pirate/latest.json?ref=${GITHUB_REF_NAME}" --jq '.sha') || exit 1
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/lone-pirate/latest.json" \
              -f message="Record Lone Pirate experiment (no simulated data)" \
              -f branch="${GITHUB_REF_NAME}" \
              -f sha="$sha" \
              -f content="$content" >/dev/null; then
              echo "Published verified run log."
              exit 0
            fi
            echo "::warning::Live log changed concurrently; retrying publish (attempt $attempt)."
            sleep 2
          done
          echo "::warning::Publication failed after retries; experiment stages remain independent."
          exit 1
  pirate_2:
    needs: pirate_1
    runs-on: ubuntu-latest
    timeout-minutes: 255
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore AI memory
        uses: actions/download-artifact@v4
        with:
          name: lone-pirate-eight-hour-1
          path: lone-pirate-eko
      - name: Syntax-check agent controller
        run: python -m py_compile lone-pirate-eko/run_agent.py
      - name: Check real model access
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Configure repository secret GROQ_API_KEY before running; no fake AI will be used."
            exit 1
          fi
      - name: Install Clawblox
        run: |
          curl -fsSL https://clawblox.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start embodied Clawblox world
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          clawblox run lone-pirate-eko --record --record-dir lone-pirate-eko/recordings > /tmp/clawblox.log 2>&1 &
          echo $! > /tmp/clawblox.pid
          for n in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api.md >/dev/null; then echo "Clawblox ready"; exit 0; fi
            sleep 2
          done
          cat /tmp/clawblox.log
          exit 1
      - name: Run real LLM-controlled experiment
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_LIVE_TOKEN: ${{ github.token }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
          DURATION_MINUTES: ${{ '240' }}
          MAX_CALLS: ${{ '50' }}
          PAUSE_SECONDS: "10"
          PIRATE_STAGE: "2"
        run: python lone-pirate-eko/run_agent.py
      - name: Save experiment record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lone-pirate-eight-hour-2
          path: |
            lone-pirate-eko/log.json
            lone-pirate-eko/recordings/
          if-no-files-found: warn
      - name: Publish verified run log for website
        if: always()
        continue-on-error: true # Publishing must never prevent stage 2 from starting.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f lone-pirate-eko/log.json ]; then exit 0; fi
          # Update a single file through GitHub's Contents API, not git pull --rebase.
          # Concurrent live-log updates can change the file SHA; retry with the new SHA.
          content=$(base64 -w 0 lone-pirate-eko/log.json)
          for attempt in 1 2 3 4 5; do
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/lone-pirate/latest.json?ref=${GITHUB_REF_NAME}" --jq '.sha') || exit 1
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/lone-pirate/latest.json" \
              -f message="Record Lone Pirate experiment (no simulated data)" \
              -f branch="${GITHUB_REF_NAME}" \
              -f sha="$sha" \
              -f content="$content" >/dev/null; then
              echo "Published verified run log."
              exit 0
            fi
            echo "::warning::Live log changed concurrently; retrying publish (attempt $attempt)."
            sleep 2
          done
          echo "::warning::Publication failed after retries; experiment stages remain independent."
          exit 1
