name: Research deployment credential readiness
on:
  push:
    branches: [main]
    paths: ['.github/workflows/research-credential-readiness.yml']
  workflow_dispatch:
permissions:
  contents: write
  deployments: read
  actions: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            tools
            evidence/configuration
      - name: Inspect binding names without exposing credential values
        env:
          PCT_SECRET_BINDINGS_JSON: ${{ toJSON(secrets) }}
          PCT_VARIABLE_BINDINGS_JSON: ${{ toJSON(vars) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime,json,os,pathlib,urllib.request,urllib.error
          # Never print, persist or return either raw binding object or values.
          secrets=json.loads(os.environ.pop('PCT_SECRET_BINDINGS_JSON','{}'))
          names=sorted(k for k,v in secrets.items() if v and k!='GITHUB_TOKEN')
          del secrets
          variables=json.loads(os.environ.pop('PCT_VARIABLE_BINDINGS_JSON','{}'))
          variable_names=sorted(variables);del variables
          report={'schema':'nabou-credential-binding-readiness-v1','run_id':os.environ['GITHUB_RUN_ID'],
                  'checked_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  'repository_secret_names':names,'repository_variable_names':variable_names,
                  'credential_values_recorded':False,'coverage':'REPOSITORY_AND_ORG_BINDINGS_VISIBLE_TO_THIS_JOB; ENVIRONMENT_SECRET_VALUES_NOT_INSPECTED',
                  'production_connection_verified':False,'environments':[]}
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/environments'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          try:
              with urllib.request.urlopen(request,timeout=20) as response:
                  data=json.load(response);report['environment_metadata_http_status']=response.status
              report['environments']=[{'name':e['name'],'protection_rule_types':[r.get('type') for r in e.get('protection_rules',[])]} for e in data.get('environments',[])]
          except urllib.error.HTTPError as error:report['environment_metadata_http_status']=error.code
          except Exception as error:report['environment_metadata_error_type']=type(error).__name__
          report['observed_research_runs']=[]
          for run_id in ('39372264436','39372433114'):
              observation={'run_id':run_id}
              endpoint='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+run_id
              for suffix in ('','/jobs?per_page=100'):
                  request=urllib.request.Request(endpoint+suffix,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
                  try:
                      with urllib.request.urlopen(request,timeout=20) as response:data=json.load(response)
                      if not suffix:observation.update({k:data.get(k) for k in ('status','conclusion','head_sha','run_started_at')})
                      else:observation['jobs']=[{**{k:j.get(k) for k in ('id','name','status','conclusion','started_at','completed_at')},'steps':[{k:s.get(k) for k in ('name','number','status','conclusion','started_at','completed_at')} for s in j.get('steps',[])]} for j in data.get('jobs',[])]
                  except urllib.error.HTTPError as error:observation['metadata_http_failure']=error.code
                  except Exception as error:observation['metadata_error_type']=type(error).__name__
              report['observed_research_runs'].append(observation)
          destination=pathlib.Path('evidence/configuration')/os.environ['GITHUB_RUN_ID'];destination.mkdir(parents=True,exist_ok=True)
          (destination/'credential-readiness.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-binding-names-only
          path: evidence/configuration/${{ github.run_id }}/
      - name: Persist non-secret readiness metadata
        if: always()
        run: |
          set -e
          destination="evidence/configuration/$GITHUB_RUN_ID"
          if [ ! -d "$destination" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          git commit -m 'Record configured binding names without credential values'
          python3 tools/publish_research_outputs.py
