name: N7 owner memory FTPS read-only preflight
on:
  pull_request:
    paths:
      - '.github/workflows/n7-memory-preflight.yml'
permissions:
  contents: read
jobs:
  ftps-preflight:
    if: github.event.pull_request.head.repo.full_name == 'Lepe12/geraki-historical-atlas' && github.event.pull_request.head.ref == 'ops/n7-memory-ftps-preflight'
    runs-on: ubuntu-latest
    environment: nabou-production
    timeout-minutes: 12
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/n7-pr84-expected-contract.json
            .github/n7-pr84-guarded-deploy.py
            .github/n7-pr84-guarded-deploy-test.py
            tools/n7/owner-chat-memory.js
          sparse-checkout-cone-mode: false
      - name: Verify existing FTPS secrets and read only N7 memory module hash
        shell: bash
        run: |
          test -n "$PCT_FTPS_HOST" && test -n "$PCT_FTPS_USER" && test -n "$PCT_FTPS_PASSWORD" || { echo "ATLAS_FTPS_SECRETS_NOT_CONFIGURED"; exit 1; }
          python3 - <<'PY'
          import ftplib,hashlib,os,socket,ssl
          HOST=os.environ['PCT_FTPS_HOST'];PORT=21;TLS='linux3087.grserver.gr'
          ip=lambda h:{x[4][0] for x in socket.getaddrinfo(h,PORT,type=socket.SOCK_STREAM)}
          if not(ip(HOST)&ip(TLS)):raise RuntimeError('FTPS_TARGET_IDENTITY_MISMATCH')
          ftp=ftplib.FTP_TLS(timeout=25,context=ssl.create_default_context());ftp.connect(HOST,PORT);ftp.host=TLS
          ftp.login(os.environ['PCT_FTPS_USER'],os.environ['PCT_FTPS_PASSWORD']);ftp.prot_p()
          try:
            ftp.cwd('/bot.piratecartography.com/n7-app')
            if ftp.pwd().rstrip('/')!='/bot.piratecartography.com/n7-app':raise RuntimeError('BAD_TARGET_ROOT')
            parts=[]
            ftp.retrbinary('RETR owner-chat-memory.js',parts.append)
            value=hashlib.sha256(b''.join(parts)).hexdigest()
            old='c8a780c590c2269f0e0d2bd92911c78667a4cc4d4ec517e432766c0935c06d55'
            new='3f726de2fd52d33ac43c6e93ef9b329c1bfef6dc49db05ca8ca5d77dc6b75d38'
            state='OLD_APPROVED' if value==old else 'NEW_APPROVED' if value==new else 'UNEXPECTED'
            print('N7_LIVE_OWNER_MEMORY_STATE='+state)
            if state=='UNEXPECTED':raise RuntimeError('N7_LIVE_MODULE_DRIFT')
            print('N7_FTPS_READ_ONLY_PREFLIGHT_OK')
          finally:
            try:ftp.quit()
            except:ftp.close()
          PY
      - name: Inspect post-cancellation module, manifest, staging and lock (no writes)
        shell: bash
        run: |
          python3 - <<'PY'
          import ftplib,hashlib,json,os,socket,ssl,urllib.request
          host=os.environ['PCT_FTPS_HOST'];tls='linux3087.grserver.gr';port=21
          ips=lambda h:{x[4][0] for x in socket.getaddrinfo(h,port,type=socket.SOCK_STREAM)}
          if not (ips(host)&ips(tls)):raise RuntimeError('UNEXPECTED_HOST')
          ftp=ftplib.FTP_TLS(timeout=35,context=ssl.create_default_context())
          ftp.connect(host,port);ftp.host=tls
          ftp.login(os.environ['PCT_FTPS_USER'],os.environ['PCT_FTPS_PASSWORD']);ftp.prot_p()
          root='/bot.piratecartography.com/n7-app'
          ftp.cwd(root)
          def read(name):
              buf=[];ftp.retrbinary('RETR '+root+'/'+name,buf.append)
              return b''.join(buf)
          try:
              digest=hashlib.sha256(read('owner-chat-memory.js')).hexdigest()
              receipt=json.loads(read('release-manifest.json'))
              names=[n.rsplit('/',1)[-1] for n in ftp.nlst(root)]
              leftover=[n for n in names if n.startswith(('.n7-persona-stage-','.n7-persona-backup-','.n7-persona-activation-lock'))]
              old='c8a780c590c2269f0e0d2bd92911c78667a4cc4d4ec517e432766c0935c06d55'
              new='3f726de2fd52d33ac43c6e93ef9b329c1bfef6dc49db05ca8ca5d77dc6b75d38'
              state='OLD' if digest==old else 'NEW' if digest==new else 'UNEXPECTED'
              print('N7_POST_CANCEL_HELPER='+state)
              print('N7_POST_CANCEL_RELEASE='+str(receipt.get('release_id')))
              print('N7_POST_CANCEL_COMMIT='+str(receipt.get('canonical_commit')))
              print('N7_POST_CANCEL_STAGE_LOCK_NAMES='+','.join(sorted(leftover)))
          finally:
              try:ftp.quit()
              except:ftp.close()
          try:
              req=urllib.request.Request('https://bot.piratecartography.com/health',headers={'Cache-Control':'no-store'})
              with urllib.request.urlopen(req,timeout=15) as res:
                  h=json.loads(res.read(10000))
              print('N7_POST_CANCEL_HEALTH='+str(h.get('status')))
              print('N7_POST_CANCEL_HEALTH_RELEASE='+str(h.get('release')))
          except Exception as e:print('N7_POST_CANCEL_HEALTH_READ_ERROR='+type(e).__name__)
          PY
