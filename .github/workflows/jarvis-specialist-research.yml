name: JARVIS Specialist Historical Research

on:
  workflow_call:
    secrets:
      SERPAPI_API_KEY:
        required: false
      EXA_API_KEY:
        required: false
    inputs:
      request_id:
        default: ""
        type: string
      target:
        required: true
        type: string
      aliases:
        default: ""
        type: string
      date_range:
        default: ""
        type: string
      purpose:
        default: ""
        type: string
      target_type:
        default: auto
        type: string
  workflow_dispatch:
    inputs:
      request_id:
        default: ""
        type: string
      target:
        description: 'Research target'
        required: true
        type: string
      aliases:
        description: 'Aliases separated by |'
        required: false
        type: string
      date_range:
        description: 'Date range'
        required: false
        type: string
      purpose:
        description: 'Research purpose'
        required: false
        type: string
      target_type:
        description: 'auto, person, place, event, all'
        required: false
        default: 'auto'
        type: string

permissions:
  contents: write
  id-token: write

env:
  PCT_UI_REQUEST_ID: ${{ inputs.request_id }}
  PCT_COMMAND_CENTER_URL: https://pct-live.piratecartography.com/pct-api/live
  SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
  EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools
            config
            data
      - name: Validate JARVIS assignment logic
        run: python3 tools/test_specialist_routing.py
      - id: plan
        env:
          TARGET: ${{ inputs.target }}
          ALIASES: ${{ inputs.aliases }}
          DATE_RANGE: ${{ inputs.date_range }}
          PURPOSE: ${{ inputs.purpose }}
          TARGET_TYPE: ${{ inputs.target_type }}
        run: |
          python3 tools/orchestrator/jarvis_specialist_plan.py \
            --target "$TARGET" \
            --aliases "$ALIASES" \
            --date-range "$DATE_RANGE" \
            --purpose "$PURPOSE" \
            --target-type "$TARGET_TYPE" \
            --output specialist_plan.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('specialist_plan.json',encoding='utf-8'))
          assert d.get('routing_authority')=='JARVIS_PLANNER'
          assert all(x.get('assigned_sources') for x in d.get('agents',[]))
          print('matrix='+json.dumps([x['agent_id'] for x in d['agents']],separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: specialist-plan-${{ github.run_id }}
          path: specialist_plan.json

  specialists:
    timeout-minutes: 12
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        agent: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools
            config
            data
      - uses: actions/download-artifact@v4
        with:
          name: specialist-plan-${{ github.run_id }}
      - name: Announce specialist runtime preparation
        run: |
          python3 tools/orchestrator/jarvis_event_bus.py --root "specialist_output/${{ matrix.agent }}/command_center" --run-id "$GITHUB_RUN_ID" --event-type agent_preparing --agent-id "${{ matrix.agent }}" --phase runtime_setup --status PREPARING --detail "Agent runner is preparing its assigned sources"
      - id: browser_wave1
        name: Check whether the assignment needs a browser
        env:
          AGENT_ID: ${{ matrix.agent }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os
          plan=json.load(open("specialist_plan.json",encoding="utf-8"))
          agent=next(x for x in plan["agents"] if x["agent_id"]==os.environ["AGENT_ID"])
          # Registered connector routes may need Playwright; repository API routes do not.
          needs_browser=any(x.get("route_type")=="registered_connector" for x in agent.get("assigned_sources",[]))
          print("required="+str(needs_browser).lower())
          PYTHON
      - name: Install browser support for JARVIS-assigned browser routes
        if: steps.browser_wave1.outputs.required == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Execute JARVIS specialist assignment
        run: |
          mkdir -p "specialist_output/${{ matrix.agent }}"
          PYTHONPATH=tools/connectors:tools/orchestrator python3 tools/orchestrator/jarvis_specialist_worker.py \
            --plan specialist_plan.json \
            --agent "${{ matrix.agent }}" \
            --run-id "${{ github.run_id }}" \
            --event-root "specialist_output/${{ matrix.agent }}/command_center" \
            --history-path "specialist_output/${{ matrix.agent }}/task_history.jsonl" \
            --output "specialist_output/${{ matrix.agent }}/result.json"
      - name: Announce specialist runtime failure
        if: failure()
        run: |
          python3 tools/orchestrator/jarvis_event_bus.py --root "specialist_output/${{ matrix.agent }}/command_center" --run-id "$GITHUB_RUN_ID" --event-type agent_failed --agent-id "${{ matrix.agent }}" --phase runtime_failed --status FAILED --detail "Agent setup or execution failed; inspect the workflow log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specialist-${{ matrix.agent }}-${{ github.run_id }}
          path: specialist_output/${{ matrix.agent }}/

  replan:
    needs: [prepare, specialists]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.reassign.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools
            config
            data
      - uses: actions/download-artifact@v4
        with:
          name: specialist-plan-${{ github.run_id }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: specialist-*-${{ github.run_id }}
          path: first_wave_results
      - id: reassign
        name: JARVIS evaluates first wave and assigns fallbacks
        run: |
          python3 tools/orchestrator/jarvis_specialist_reassign.py \
            --plan specialist_plan.json \
            --results-root first_wave_results \
            --output second_wave_plan.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('second_wave_plan.json',encoding='utf-8'))
          assert d.get('routing_authority')=='JARVIS_PLANNER'
          print('matrix='+json.dumps([x['agent_id'] for x in d.get('agents',[])],separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: specialist-second-plan-${{ github.run_id }}
          path: second_wave_plan.json

  second-wave:
    timeout-minutes: 12
    needs: replan
    if: needs.replan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        agent: ${{ fromJSON(needs.replan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools
            config
            data
      - uses: actions/download-artifact@v4
        with:
          name: specialist-second-plan-${{ github.run_id }}
      - name: Announce specialist runtime preparation
        run: |
          python3 tools/orchestrator/jarvis_event_bus.py --root "specialist_second_output/${{ matrix.agent }}/command_center" --run-id "$GITHUB_RUN_ID" --event-type agent_preparing --agent-id "${{ matrix.agent }}" --phase runtime_setup --status PREPARING --detail "Agent runner is preparing its assigned sources"
      - id: browser_wave2
        name: Check whether the assignment needs a browser
        env:
          AGENT_ID: ${{ matrix.agent }}
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os
          plan=json.load(open("second_wave_plan.json",encoding="utf-8"))
          agent=next(x for x in plan["agents"] if x["agent_id"]==os.environ["AGENT_ID"])
          # Registered connector routes may need Playwright; repository API routes do not.
          needs_browser=any(x.get("route_type")=="registered_connector" for x in agent.get("assigned_sources",[]))
          print("required="+str(needs_browser).lower())
          PYTHON
      - name: Install browser support for JARVIS fallback assignments
        if: steps.browser_wave2.outputs.required == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Execute JARVIS second-wave assignment
        run: |
          mkdir -p "specialist_second_output/${{ matrix.agent }}"
          PYTHONPATH=tools/connectors:tools/orchestrator python3 tools/orchestrator/jarvis_specialist_worker.py \
            --plan second_wave_plan.json \
            --agent "${{ matrix.agent }}" \
            --run-id "${{ github.run_id }}" \
            --event-root "specialist_second_output/${{ matrix.agent }}/command_center" \
            --history-path "specialist_second_output/${{ matrix.agent }}/task_history.jsonl" \
            --output "specialist_second_output/${{ matrix.agent }}/result.json"
      - name: Announce specialist runtime failure
        if: failure()
        run: |
          python3 tools/orchestrator/jarvis_event_bus.py --root "specialist_second_output/${{ matrix.agent }}/command_center" --run-id "$GITHUB_RUN_ID" --event-type agent_failed --agent-id "${{ matrix.agent }}" --phase runtime_failed --status FAILED --detail "Agent setup or execution failed; inspect the workflow log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: specialist-second-${{ matrix.agent }}-${{ github.run_id }}
          path: specialist_second_output/${{ matrix.agent }}/

  aggregate:
    needs: [prepare, specialists, replan, second-wave]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: specialist-*-${{ github.run_id }}
          path: specialist_results
      - name: Merge all JARVIS assignment waves
        run: |
          rm -rf normalized
          python3 tools/orchestrator/jarvis_merge_specialist_waves.py \
            --first-root specialist_results \
            --output-root normalized
      - name: Aggregate specialist outputs
        run: |
          python3 tools/orchestrator/jarvis_specialist_aggregate.py \
            --root normalized \
            --output SPECIALIST_AGGREGATE.json
      - name: Learn from specialist run
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          PYTHONPATH=tools/memory python3 - <<'PY'
          import os
          from naboux_memory import load,save,learn_results_tree
          m=load("data/naboux_memory.json")
          learn_results_tree(m,"normalized",os.environ["RUN_ID"])
          save(m,"data/naboux_memory.json")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: specialist-normalized-${{ github.run_id }}
          path: normalized/
          if-no-files-found: warn
      - name: Preserve complete JARVIS specialist run
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          dest="evidence/specialist_runs/$RUN_ID"
          mkdir -p "$dest"
          cp SPECIALIST_AGGREGATE.json "$dest/"
          cp -R normalized "$dest/agents"
          cp -R specialist_results "$dest/raw_agents"
          : > "$dest/TASK_HISTORY.jsonl"
          find specialist_results -name task_history.jsonl -type f -print0 | while IFS= read -r -d '' f; do
            cat "$f" >> "$dest/TASK_HISTORY.jsonl"
          done
          git config user.name "jarvis-orchestrator[bot]"
          git config user.email "jarvis-orchestrator@users.noreply.github.com"
          git add "$dest" data/naboux_memory.json
          git diff --cached --quiet && exit 0
          git commit -m "Preserve JARVIS specialist research run $RUN_ID"
          for n in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((n*2))
          done
          echo "WARNING: specialist aggregate commit failed after retries; Actions artifact remains available for recovery."
          exit 1

