name: Four real historical research validation cases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/historical-research-live-cases.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Real source discovery and complete model pipeline in all four cases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/run_research_validation_cases.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-real-research-cases
          path: evidence/validation_cases/${{ github.run_id }}/
      - name: Persist actual case outcomes including blocked or failed runs
        if: always()
        run: |
          set -e
          dest="evidence/validation_cases/$GITHUB_RUN_ID"
          if [ ! -d "$dest" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          git commit -m 'Record four real historical research validation cases'
          python3 tools/publish_research_outputs.py
