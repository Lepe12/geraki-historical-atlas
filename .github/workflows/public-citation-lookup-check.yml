name: Public citation lookup check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-citation-lookup-check.yml'
      - 'tools/connectors/citation_search.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            tools
            evidence/configuration
      - name: Query existing public catalogues without provider keys
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools python3 - <<'PY'
          from connectors.citation_search import PUBLIC_CATALOGUES,_lookup
          from concurrent.futures import ThreadPoolExecutor
          import datetime,json,os,pathlib
          query='Πέτρος Λάντζας διοικητής της Πάργας'
          with ThreadPoolExecutor(max_workers=3) as pool:
              results=list(pool.map(lambda item:_lookup(item,query,'greek'),PUBLIC_CATALOGUES))
          report={'schema':'pct-public-citation-live-check-v1','run_id':os.environ['GITHUB_RUN_ID'],'checked_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'query':query,'test_type':'PUBLIC_CONNECTOR_SMOKE_NOT_FULL_RESEARCH_OR_RECALL_SCORE','providers':[{'attempt':attempt,'records':rows} for attempt,rows in results]}
          p=pathlib.Path('evidence/configuration/public-citation-lookup.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps([a for a,_ in results],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-citation-live-check
          path: evidence/configuration/public-citation-lookup.json
      - name: Publish observed catalogue responses
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/configuration/public-citation-lookup.json
          git commit -m 'Record actual public catalogue access without paid web providers'
          python3 tools/publish_research_outputs.py
