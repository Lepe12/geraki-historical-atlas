name: Public citation lookup check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-citation-lookup-check.yml'
      - 'tools/connectors/citation_search.py'
      - 'tools/web_acquisition.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            tools
            evidence/configuration
            evidence/citation_checks
            docs/audits
      - name: Ensure the existing PDF text extractor is available
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
      - name: Query existing public catalogues without provider keys
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=tools python3 - <<'PY'
          from connectors.citation_search import PUBLIC_CATALOGUES,_lookup
          from concurrent.futures import ThreadPoolExecutor
          import datetime,json,os,pathlib
          from connectors.citation_search import search
          from web_acquisition import citation_title_match,acquire
          references=json.load(open('docs/audits/lantzas-reference-checks.json'))['references']
          checks=[]
          for ref in references:
              status,rows,detail=search(ref['title'],'greek')
              matched=[row for row in rows if citation_title_match(ref['title'],row)]
              item={'reference_id':ref['id'],'query':ref['title'],'status':status,'diagnostic':json.loads(detail),'matching_records':matched,'acquisitions':[]}
              target=next((r.get('digital_url') for r in matched if r.get('digital_url')),None) or next((r.get('url') for r in matched if r.get('url')),None)
              basis='PUBLIC_CATALOGUE_TITLE_MATCH'
              if not target and ref.get('url'):
                  target=ref['url'];basis='PREVIOUSLY_DOCUMENTED_URL_NOT_DISCOVERED_BY_THIS_QUERY'
              if target:
                  dest=pathlib.Path('evidence/citation_checks')/os.environ['GITHUB_RUN_ID']/ref['id'];dest.mkdir(parents=True,exist_ok=True)
                  try:item['acquisitions'].append({'basis':basis,'result':acquire(target,dest,follow=True)})
                  except Exception as error:item['acquisitions'].append({'basis':basis,'status':'FAILED','error_type':type(error).__name__})
              checks.append(item)
          report={'schema':'pct-public-citation-repair-check-v2','run_id':os.environ['GITHUB_RUN_ID'],'checked_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'test_type':'TARGETED_KNOWN_BIBLIOGRAPHY_FOLLOWUP_NOT_BLIND_RECALL_TEST','references':checks}
          p=pathlib.Path('evidence/configuration/public-citation-lookup.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps([{'id':c['reference_id'],'status':c['status'],'matching_records':len(c['matching_records']),'acquisition_attempts':len(c['acquisitions'])} for c in checks],ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-citation-live-check
          path: |
            evidence/configuration/public-citation-lookup.json
            evidence/citation_checks/
      - name: Publish observed catalogue responses
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/configuration/public-citation-lookup.json
          if [ -d evidence/citation_checks ]; then git add evidence/citation_checks; fi
          git commit -m 'Record actual public catalogue access without paid web providers'
          python3 tools/publish_research_outputs.py
