name: N7 Humanoid — guarded public research upgrade
on:
  pull_request:
    paths:
      - 'tools/deploy_n7_humanoid_research_upgrade.py'
      - 'ops_ftps_requests/n7-humanoid-research-upgrade.json'
      - '.github/workflows/n7-humanoid-research-upgrade.yml'
  push:
    branches: [main]
    paths:
      - 'ops_ftps_requests/n7-humanoid-research-upgrade.json'
permissions:
  contents: read
concurrency:
  group: n7-humanoid-public-research-upgrade
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: nabou-production
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
      N7_DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            n7-distribution.json
            ops_ftps_requests/n7-humanoid-research-upgrade.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact canonical Humanoid code and public research integration
        run: |
          node --check tools/n7/apex-public-chat.cjs
          node --test tools/n7/test_apex_public_research.cjs
          python3 -m py_compile tools/deploy_n7_humanoid_research_upgrade.py
      - name: Verified FTPS read-only preflight or approved one-module deployment
        run: python3 tools/deploy_n7_humanoid_research_upgrade.py
