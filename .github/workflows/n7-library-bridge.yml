name: N7 Historical Library read-only bridge deployment
on:
  push:
    branches: [main]
    paths:
      - ops_ftps_requests/n7-library-bridge.json
  pull_request:
    paths:
      - server/command-center-live/n7-gateway.js
      - server/command-center-live/n7-gateway.test.js
      - server/command-center-live/public/agents.html
      - tools/library/deploy_n7_library_bridge_ftps.py
      - .github/workflows/n7-library-bridge.yml
permissions:
  contents: read
concurrency:
  group: n7-library-bridge-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            server/command-center-live
            tools/library
      - name: Syntax and gateway regression
        run: |
          set -euo pipefail
          node --check server/command-center-live/n7-gateway.js
          node --test server/command-center-live/n7-gateway.test.js
          python3 -m py_compile tools/library/deploy_n7_library_bridge_ftps.py
  deploy:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: nabou-production
    timeout-minutes: 9
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
      PCT_FTPS_TLS_SERVER_NAME: ${{ vars.PCT_FTPS_TLS_SERVER_NAME }}
      PCT_FTPS_APP_ROOT: /piratecartography-gateway/server/command-center-live
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            server/command-center-live
            tools/library
      - name: Deploy read-only bridge and verify HTTP access control
        run: python3 tools/library/deploy_n7_library_bridge_ftps.py
