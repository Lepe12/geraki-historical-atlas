name: N7 one-time canonical sync trigger 2026-11-18
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n7-sync-trigger-20261118.yml'
permissions:
  actions: write
  contents: read
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch existing canonical source sync (no direct deployment)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run n7-source-sync.yml --repo "${GITHUB_REPOSITORY}" --ref main -f source_ref=main
          echo 'N7_CANONICAL_SYNC_DISPATCHED'

