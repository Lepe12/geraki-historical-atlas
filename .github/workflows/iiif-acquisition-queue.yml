name: Automatic IIIF Acquisition Queue
on:
  push:
    branches: [main]
    paths:
      - 'acquisition_requests/*.json'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Locate request added by triggering push
        id: req
        shell: python
        run: |
          import json, os
          event=json.load(open(os.environ["GITHUB_EVENT_PATH"],encoding="utf-8"))
          files=[]
          for commit in event.get("commits",[]):
              files.extend(commit.get("added",[]))
              files.extend(commit.get("modified",[]))
          matches=[p for p in files if p.startswith("acquisition_requests/") and p.endswith(".json")]
          if not matches:
              raise SystemExit("No acquisition request found in push event")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("file="+matches[-1]+"\\n")
      - name: Validate request and acquire pages
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          p=pathlib.Path("${{ steps.req.outputs.file }}")
          q=json.loads(p.read_text(encoding="utf-8"))
          required=("manifest","pages")
          missing=[k for k in required if not q.get(k)]
          if missing: raise SystemExit("Missing required request fields: "+", ".join(missing))
          pages=q["pages"]
          if isinstance(pages,list): pages=",".join(str(x) for x in pages)
          cmd=["python3","tools/iiif_acquire.py","--manifest",str(q["manifest"]),"--pages",str(pages),"--source-id",str(q.get("source_id","")),"--out","iiif_acquisition"]
          subprocess.run(cmd,check=True)
          PY
      - name: Preserve request with Citation Chase package
        if: always()
        run: |
          mkdir -p iiif_acquisition
          cp "${{ steps.req.outputs.file }}" iiif_acquisition/request.json || true
      - name: Upload Citation Chase package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citation-chase-auto-${{ github.run_id }}
          path: iiif_acquisition/
          if-no-files-found: warn
