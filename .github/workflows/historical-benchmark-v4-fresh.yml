name: Historical Benchmark v4 Fresh Blind Runs

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/v4/start/FRESH_RUNS.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: historical-benchmark-v4-fresh
  cancel-in-progress: false

jobs:
  dispatch-and-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Create immutable benchmark engine branch
        id: freeze
        run: |
          branch="benchmark-v4-pilot-${GITHUB_SHA:0:12}"
          git push origin "HEAD:refs/heads/$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "FROZEN ENGINE $branch @ $GITHUB_SHA"

      - name: Dispatch ten blind case runs and wait for completion
        run: |
          python3 tools/benchmark_v4_dispatch.py \
            --repo "$REPO" \
            --branch "${{ steps.freeze.outputs.branch }}" \
            --output "benchmarks/v4/fresh_dispatch/${GITHUB_RUN_ID}.json" \
            --wait

      - name: Bind fresh runs to Benchmark v4
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          dispatch=Path('benchmarks/v4/fresh_dispatch')/(os.environ['GITHUB_RUN_ID']+'.json')
          d=json.loads(dispatch.read_text(encoding='utf-8'))
          p=Path('benchmarks/v4/run_bindings.json')
          current=json.loads(p.read_text(encoding='utf-8'))
          by={x['case_id']:x for x in current.get('bindings',[])}
          for r in d.get('runs',[]):
              row=by.setdefault(r['case_id'],{'case_id':r['case_id']})
              row.update({
                'run_id':r['run_id'],
                'baseline_only':False,
                'blind_execution_attested':True,
                'expected_engine_commit':d.get('expected_engine_commit'),
                'frozen_branch':d.get('frozen_branch'),
                'run_status':r.get('status'),
                'run_conclusion':r.get('conclusion'),
                'run_url':r.get('html_url')
              })
          current['status']='FRESH_BLIND_RUNS_COMPLETED' if d.get('all_completed') else 'FRESH_BLIND_RUNS_INCOMPLETE'
          current['official_engine_commit_expected']=d.get('expected_engine_commit')
          current['frozen_branch']=d.get('frozen_branch')
          current['bindings']=[by[k] for k in sorted(by)]
          p.write_text(json.dumps(current,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Preserve dispatch map and fresh bindings on main
        run: |
          git config user.name "benchmark-v4[bot]"
          git config user.email "benchmark-v4@users.noreply.github.com"
          git add benchmarks/v4/fresh_dispatch/ benchmarks/v4/run_bindings.json
          git commit -m "Bind Historical Benchmark v4 fresh blind runs"
          git pull --rebase origin main
          git push origin HEAD:main
