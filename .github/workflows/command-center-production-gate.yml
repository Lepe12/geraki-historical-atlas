name: Command Center Production Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/command-center-live/**'
      - 'tools/gateway/deploy_command_center_live.sh'
      - 'tools/orchestrator/jarvis_event_bus.py'
      - 'command-center/**'
      - '.github/workflows/command-center-production-gate.yml'

permissions:
  contents: read
  id-token: write

env:
  PCT_COMMAND_CENTER_URL: https://piratecartography.com/pct-api/live

jobs:
  production-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate production code
        run: |
          node --check server/command-center-live/app.js
          node server/command-center-live/self-test.js
          node --check command-center/command-center.js
          python3 -m py_compile tools/orchestrator/jarvis_event_bus.py tools/orchestrator/build_command_center_snapshot.py
          python3 tools/test_command_center_snapshot.py

      - name: Validate durable live snapshot
        run: |
          test -s command-center/live/latest.json
          python3 - <<'PY'
          import json
          d=json.load(open('command-center/live/latest.json',encoding='utf-8'))
          assert d['schema']=='pct-command-center-live-v1'
          assert d['source']=='DURABLE_GITHUB_EVIDENCE'
          assert d['safety']['automatic_verified'] is False
          assert isinstance(d['agents'],list) and len(d['agents'])>0
          print('SNAPSHOT PASS',d['run_id'],'agents',len(d['agents']),'claims',len(d.get('claims',[])))
          PY

      - name: Probe Plesk production WebSocket backend
        id: probe
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 10             https://piratecartography.com/pct-api/live/health             -o /tmp/pct-command-center-health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pct-command-center-health.json'))
          assert d.get('status')=='PASS'
          assert d.get('websocket') is True
          print('PLESK LIVE BACKEND PASS',d)
          PY

      - name: Verify GitHub OIDC event ingestion end to end
        run: |
          probe_run="gate-$GITHUB_RUN_ID"
          python3 tools/orchestrator/jarvis_event_bus.py             --root /tmp/pct-command-center-probe             --run-id "$probe_run"             --event-type production_probe             --agent-id command_center             --phase "production gate"             --percent 100             --status COMPLETED             --detail "OIDC live transport verification"
          curl --fail --silent --show-error --max-time 10             "https://piratecartography.com/pct-api/live/status/piratecartography/$probe_run"             -o /tmp/pct-command-center-status.json
          python3 - "$probe_run" <<'PY'
          import json,sys
          d=json.load(open('/tmp/pct-command-center-status.json'))
          assert d.get('run_id')==sys.argv[1],d
          assert any(e.get('event_type')=='production_probe' for e in d.get('events',[])),d
          print('OIDC EVENT READ-BACK PASS',sys.argv[1])
          PY

      - name: Verify production WebSocket handshake and bootstrap
        run: |
          node - <<'NODE'
          const tls=require('tls'),crypto=require('crypto');
          const host='piratecartography.com',path='/pct-api/live/ws/piratecartography/latest';
          const key=crypto.randomBytes(16).toString('base64');
          const socket=tls.connect(443,host,{servername:host});
          let buf=Buffer.alloc(0),headerDone=false;
          const timer=setTimeout(()=>{console.error('WEBSOCKET_TIMEOUT');process.exit(1)},10000);
          socket.on('secureConnect',()=>{
            socket.write('GET '+path+' HTTP/1.1\r\nHost: '+host+'\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: '+key+'\r\nSec-WebSocket-Version: 13\r\n\r\n');
          });
          socket.on('data',chunk=>{
            buf=Buffer.concat([buf,chunk]);
            if(!headerDone){
              const i=buf.indexOf('\r\n\r\n');if(i<0)return;
              const h=buf.slice(0,i).toString();if(!/^HTTP\/1\.1 101/m.test(h)){console.error(h);process.exit(1)}
              buf=buf.slice(i+4);headerDone=true;console.log('WEBSOCKET 101 PASS');
            }
            if(headerDone&&buf.length>=2){
              const len7=buf[1]&127;let off=2,len=len7;
              if(len7===126){if(buf.length<4)return;len=buf.readUInt16BE(2);off=4}
              else if(len7===127){if(buf.length<10)return;len=Number(buf.readBigUInt64BE(2));off=10}
              if(buf.length<off+len)return;
              const msg=buf.slice(off,off+len).toString();
              const d=JSON.parse(msg);if(d.schema!=='pct-command-center-bootstrap-v1')throw new Error('bad bootstrap');
              console.log('WEBSOCKET BOOTSTRAP PASS',d.run_id);clearTimeout(timer);socket.end();
            }
          });
          socket.on('error',e=>{console.error(e);process.exit(1)});
          NODE

      - name: Report production transport state
        run: |
          if [ "${{ steps.probe.outcome }}" = "success" ]; then
            echo "COMMAND_CENTER_PRODUCTION_LIVE=PASS"
          else
            echo "COMMAND_CENTER_PRODUCTION_LIVE=PLESK_NODE_ACTIVATION_REQUIRED"
            echo "Static durable snapshot remains real-data and operational; WebSocket transport is not yet externally reachable."
          fi
