name: N7 Signed Research Mission Gateway — Review and Production Install

on:
  pull_request:
    paths:
      - 'server/command-center-live/app.js'
      - 'server/command-center-live/n7-gateway.js'
      - 'tools/library/deploy_n7_mission_gateway.py'
      - '.github/workflows/n7-mission-production.yml'
  push:
    branches: [main]
    paths:
      - 'tools/library/deploy_n7_mission_gateway.py'
      - 'server/command-center-live/app.js'
      - 'server/command-center-live/n7-gateway.js'
      - '.github/workflows/n7-mission-production.yml'

permissions:
  contents: read

concurrency:
  group: n7-signed-research-mission-deployment
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          filter: blob:none
          sparse-checkout: |
            tools/library
            server/command-center-live
            .github/workflows
      - name: Validate safe patch, exact anchors, preservation and JS syntax
        run: |
          set -euo pipefail
          python3 -m py_compile tools/library/deploy_n7_mission_gateway.py
          python3 -m py_compile server/command-center-live/patch_library_reader.py
          node --check server/command-center-live/app.js
          node --check server/command-center-live/n7-gateway.js
          node --test server/command-center-live/n7-gateway.test.js server/command-center-live/n7-mission.test.js
          git fetch --depth=1 origin main:refs/remotes/origin/main
          python3 - <<'PY'
          import importlib.util, pathlib, subprocess
          target=pathlib.Path("tools/library/deploy_n7_mission_gateway.py")
          spec=importlib.util.spec_from_file_location("deploy_n7",target)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          extra=pathlib.Path("server/command-center-live/patch_library_reader.py")
          espec=importlib.util.spec_from_file_location("patch_library_reader",extra)
          em=importlib.util.module_from_spec(espec);espec.loader.exec_module(em)
          files=["app.js","n7-gateway.js"]
          repo=pathlib.Path("server/command-center-live")
          local={name:(repo/name).read_bytes() for name in files}
          before={}
          for name in files:
              base=subprocess.run(["git","show","origin/main:server/command-center-live/"+name],
                                  capture_output=True,check=True).stdout
              before[name]=base
          def apply(local,live):
              output=dict(m.patched(local,live))
              output["app.js"]=em.patch_library_reader(output["app.js"],local["app.js"])
              return output
          output=apply(local,before)
          m.validate(output)
          assert output==local,"UNEXPECTED_OVERWRITE_OUTSIDE_MISSION_PATCH"
          assert apply(local,output)==local,"PATCH_NOT_IDEMPOTENT"
          print("N7_SAFE_GATEWAY_PATCH_MATCHES_REVIEWED_SOURCE")
          PY

  deploy:
    if: github.event_name == 'push'
    needs: preflight
    runs-on: ubuntu-latest
    environment: nabou-production
    timeout-minutes: 12
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
      PCT_FTPS_TLS_SERVER_NAME: ${{ vars.PCT_FTPS_TLS_SERVER_NAME }}
      N7_DEPLOY_CONFIRM: N7-SIGNED-MISSION-GATEWAY
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            tools/library
            server/command-center-live
      - name: Install guarded mission routes on the existing gateway
        run: python3 server/command-center-live/patch_library_reader.py

      - name: Exercise the new signed mission route and verify the private report
        run: |
          set -euo pipefail
          if ! git diff HEAD^ HEAD -- server/command-center-live/app.js > "$RUNNER_TEMP/n7-mission-release.diff"; then
            exit 1
          fi
          if ! grep -q '^+  // N7_OWNER_PRIVATE_RESEARCH_V1$' "$RUNNER_TEMP/n7-mission-release.diff"; then
            exit 0
          fi
          python3 - <<'PYCODE'
          import ftplib, hashlib, hmac, json, os, re, socket, ssl, time, urllib.request

          context = ssl.create_default_context()
          host = os.environ["PCT_FTPS_HOST"]
          port = int(os.environ["PCT_FTPS_PORT"])
          tls_name = os.environ.get("PCT_FTPS_TLS_SERVER_NAME") or "linux3087.grserver.gr"
          def addresses(name):
              return {record[4][0] for record in socket.getaddrinfo(name, port, type=socket.SOCK_STREAM)}
          if not addresses(host) & addresses(tls_name):
              raise RuntimeError("N7_SMOKE_FTPS_TLS_NAME_MISMATCH")
          key = bytearray()
          def read_key(chunk):
              key.extend(chunk)
              if len(key) > 32:
                  raise RuntimeError("N7_SMOKE_INVALID_BRIDGE_KEY")
          with ftplib.FTP_TLS(timeout=30, context=context) as ftp:
              ftp.connect(host, port)
              ftp.host = tls_name
              ftp.login(os.environ["PCT_FTPS_USER"], os.environ["PCT_FTPS_PASSWORD"])
              ftp.prot_p()
              ftp.retrbinary("RETR /piratecartography-gateway/server/command-center-live/.n7-library-bridge-key", read_key)
          if len(key) != 32:
              raise RuntimeError("N7_SMOKE_INVALID_BRIDGE_KEY")

          def signed(kind, value):
              body = json.dumps(value, ensure_ascii=False, separators=(",", ":")).encode()
              timestamp = str(int(time.time()))
              signature = hmac.new(key, timestamp.encode()+b"."+body, hashlib.sha256).hexdigest()
              req = urllib.request.Request(
                  "https://pct-live.piratecartography.com/pct-api/live/n7/mission/"+kind+"-signed",
                  method="POST", data=body, headers={
                      "Content-Type": "application/json",
                      "X-N7-Library-Ts": timestamp, "X-N7-Library-Signature": signature,
                  })
              with urllib.request.urlopen(req, timeout=20, context=context) as res:
                  return res.status, json.loads(res.read(100_000))

          status, result = signed("dispatch", {
              "target": "Ierapetra, Crete",
              "purpose": "Assess the reported 1675 raid and identify independent witnesses or evidence gaps.",
              "date_range": "1665-1680",
              "aliases": "Ιεράπετρα|Hierapetra|Hugues de Creveuil|Creveliers|Crevellier",
          })
          request_id = result.get("request_id", "")
          if status != 202 or not re.fullmatch(r"n7mission-[a-f0-9]{24}", request_id):
              raise RuntimeError("N7_SIGNED_DISPATCH_NOT_ACCEPTED")
          print("N7_SIGNED_MISSION_ACCEPTED request_id="+request_id, flush=True)
          for _ in range(28):
              status, result = signed("status", {"request_id": request_id})
              if status != 200 or result.get("historically_verified") is not False:
                  raise RuntimeError("N7_UNSIGNED_OR_UNSAFE_MISSION_STATUS")
              if result.get("status") in {"DISPATCH_FAILED","PIPELINE_FAILED"}:
                  raise RuntimeError("N7_PRIVATE_RESEARCH_FAILED")
              if result.get("status") in {"PIPELINE_COMPLETED","EVIDENCE_PRESERVED_REVIEW_REQUIRED"}:
                  url = result.get("research_url") or ""
                  if not re.fullmatch(r"https://github\.com/Lepe12/independent-ai-bot/actions/runs/[0-9]+", url):
                      raise RuntimeError("N7_PRIVATE_REPORT_URL_MISSING")
                  print("N7_SIGNED_PRIVATE_RESEARCH_VERIFIED "+url)
                  break
              time.sleep(15)
          else:
              raise RuntimeError("N7_PRIVATE_RESEARCH_STATUS_TIMEOUT")
          PYCODE
