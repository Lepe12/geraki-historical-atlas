name: N7 nonblocking chat form — safeguarded deployment

on:
  pull_request:
    paths:
      - .github/workflows/n7-unblock-chat.yml
      - tools/n7/deploy_nonblocking_chat.py
      - ops_ftps_requests/n7-unblock-chat.json
  push:
    branches: [main]
    paths:
      - ops_ftps_requests/n7-unblock-chat.json

permissions:
  contents: read

concurrency:
  group: n7-public-ui-chat-unblock
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: nabou-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      N7_DRY_RUN: '1'
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/n7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and exact live UI patch without writes
        run: |
          python3 -m py_compile tools/n7/deploy_nonblocking_chat.py
          python3 tools/n7/deploy_nonblocking_chat.py

  deploy:
    if: github.event_name == 'push'
    needs: validate
    environment: nabou-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      N7_DRY_RUN: '0'
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/n7
            ops_ftps_requests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify explicitly authorized bot-only UI fix
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('ops_ftps_requests/n7-unblock-chat.json').read_text())
          assert v=={
            'confirmation':'N7-UNBLOCK-LEGACY-POLL',
            'target':'/bot.piratecartography.com/n7-app/public/app.js',
            'preserve_pending_jobs':True,
            'do_not_touch_server':True,
            'rollback_required':True
          }
          PY
      - name: Backup, patch public app.js, verify HTTPS, or rollback
        run: python3 tools/n7/deploy_nonblocking_chat.py
