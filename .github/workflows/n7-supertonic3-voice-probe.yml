name: N7 Greek voice – Supertonic 3 independent probe
on:
  pull_request:
    paths:
      - '.github/workflows/n7-supertonic3-voice-probe.yml'
      - 'tools/n7_apex_preview/probe_supertonic3_greek.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  greek-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/n7_apex_preview/probe_supertonic3_greek.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-weight TTS runtime
        run: python -m pip install --disable-pip-version-check --no-input supertonic numpy
      - name: Generate real Greek speech on CPU without touching N7
        env:
          CUDA_VISIBLE_DEVICES: ''
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python tools/n7_apex_preview/probe_supertonic3_greek.py
