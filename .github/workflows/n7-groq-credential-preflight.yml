name: N7 Groq credential preflight (read only)

on:
  pull_request:
    paths:
      - .github/workflows/n7-groq-credential-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: nabou-production
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      EXISTING_GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
      EXISTING_N7_GROQ_KEY: ${{ secrets.N7_GROQ_API_KEY }}
    steps:
      - name: Inspect live N7 server compatibility over pinned FTPS (no writes)
        env:
          PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
          PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
          PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
          PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import ftplib,ssl,socket,os,hashlib
          root='/bot.piratecartography.com/n7-app'
          tls='linux3087.grserver.gr'
          host=os.environ.get('PCT_FTPS_HOST','')
          if not host or not os.environ.get('PCT_FTPS_USER') or not os.environ.get('PCT_FTPS_PASSWORD'):
            print('N7_FTPS_PREFLIGHT=NO_CREDENTIALS')
            raise SystemExit(0)
          ips=lambda h:set(r[4][0] for r in socket.getaddrinfo(h,int(os.environ.get('PCT_FTPS_PORT','21')),type=socket.SOCK_STREAM))
          if not ips(host).intersection(ips(tls)):
            print('N7_FTPS_PREFLIGHT=TLS_NAME_MISMATCH')
            raise SystemExit(1)
          ftp=ftplib.FTP_TLS(timeout=22,context=ssl.create_default_context())
          try:
            ftp.connect(host,int(os.environ.get('PCT_FTPS_PORT','21')))
            ftp.host=tls
            ftp.login(os.environ['PCT_FTPS_USER'],os.environ['PCT_FTPS_PASSWORD'])
            ftp.prot_p()
            ftp.cwd(root)
            chunks=[]
            ftp.retrbinary('RETR server.js',chunks.append)
            code=b''.join(chunks)
            markers={
              'direct_model_env':b'const MODEL = process.env.LLM_MODEL' in code,
              'direct_key_env':b'const API_KEY = process.env.LLM_API_KEY' in code,
              'direct_base_env':b'const BASE = (process.env.LLM_BASE_URL' in code,
              'private_queue_bridge':b'n7-queue-bridge' in code,
              'no_existing_groq_loader':b'.n7-groq-provider' not in code
            }
            print('N7_FTPS_SERVER_COMPAT='+str(markers))
            print('N7_FTPS_SERVER_SHA256='+hashlib.sha256(code).hexdigest())
            try:
              ftp.cwd(root+'/data')
              print('N7_FTPS_DATA_DIR=ACCESSIBLE')
            except ftplib.all_errors:
              print('N7_FTPS_DATA_DIR=NOT_ACCESSIBLE')
          finally:
            try:ftp.quit()
            except ftplib.all_errors:pass
          PY
      - name: Check existing key and read Groq model catalog (no model inference, no secret output)
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          key=os.environ.get('EXISTING_GROQ_KEY') or os.environ.get('EXISTING_N7_GROQ_KEY') or ''
          if not key.strip():
            print('N7_GROQ_KEY_STATUS=NOT_PRESENT_IN_NABOU_PRODUCTION')
            raise SystemExit(0)
          print('N7_GROQ_KEY_STATUS=PRESENT_IN_NABOU_PRODUCTION')
          try:
            req=urllib.request.Request('https://api.groq.com/openai/v1/models',
              headers={'Authorization':'Bearer '+key,'Accept':'application/json','User-Agent':'n7-readonly-groq-preflight/1'})
            with urllib.request.urlopen(req,timeout=15) as response:
              data=json.loads(response.read(500000))
              models=[item.get('id') for item in data.get('data',[]) if isinstance(item,dict)]
              print('N7_GROQ_MODELS_HTTP='+str(response.status))
              print('N7_GROQ_QWEN38_ACCESS='+('YES' if 'qwen/qwen3.8-27b' in models else 'NO'))
          except urllib.error.HTTPError as error:
            print('N7_GROQ_MODELS_HTTP='+str(error.code))
          except Exception as error:
            print('N7_GROQ_REQUEST_ERROR='+type(error).__name__)
          PY
