name: N7 read-only live source baseline
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/capture_n7_live_source.py'
      - 'tools/test_capture_n7_live_source.py'
      - 'tools/stage_n7_live_source.py'
      - 'tools/test_stage_n7_live_source.py'
      - 'config/n7-capture-recipient.pem'
      - '.github/workflows/n7-live-source-baseline.yml'
permissions:
  contents: write # source-only capture branch; main and the live application are never written
jobs:
  capture:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: nabou-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/capture_n7_live_source.py
            tools/test_capture_n7_live_source.py
            tools/stage_n7_live_source.py
            tools/test_stage_n7_live_source.py
            config/n7-capture-recipient.pem
      - name: Test source scope, secret refusal and concurrent-change detection
        run: |
          python3 tools/test_capture_n7_live_source.py
          python3 tools/test_stage_n7_live_source.py
      - name: Capture and re-read application source without any server writes
        env:
          PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
          PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
          PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
          PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
        run: python3 tools/capture_n7_live_source.py --destination "$RUNNER_TEMP/n7-live-source"
      - name: Stage only encrypted source in an isolated branch without artifact storage
        run: python3 tools/stage_n7_live_source.py --capture "$RUNNER_TEMP/n7-live-source" --recipient config/n7-capture-recipient.pem
      - uses: actions/upload-artifact@v4
        if: vars.N7_CAPTURE_ARTIFACTS == 'true'
        with:
          name: n7-private-live-source-${{ github.run_id }}
          path: ${{ runner.temp }}/n7-live-source/
          retention-days: 1
          if-no-files-found: error
