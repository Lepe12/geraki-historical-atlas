name: N7 verify single-image perception and deployment

on:
  pull_request:
    paths:
      - tools/n7/stream-attachments.js
      - tools/n7/stream-upload-ui.js
      - tools/n7/test_stream_attachments.cjs
      - tools/n7/deploy_vision_grounding.py
      - .github/workflows/n7-vision-grounding.yml
      - ops_ftps_requests/n7-vision-grounding.json
  push:
    branches: [main]
    paths:
      - ops_ftps_requests/n7-vision-grounding.json
permissions:
  contents: read
concurrency:
  group: n7-production-vision-hotfix
  cancel-in-progress: false
jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: nabou-production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
      N7_DRY_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/n7
            ops_ftps_requests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression test real multimodal image payload and grounding
        run: |
          node --check tools/n7/stream-attachments.js
          node --check tools/n7/stream-upload-ui.js
          node --test tools/n7/test_stream_attachments.cjs
          python3 -m py_compile tools/n7/deploy_vision_grounding.py
      - name: Read-only verify live Top.Host hotfix compatibility
        run: python3 tools/n7/deploy_vision_grounding.py
  deploy:
    if: github.event_name == 'push'
    needs: validate
    environment: nabou-production
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
      N7_DRY_RUN: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/n7
            ops_ftps_requests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check owner scope
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('ops_ftps_requests/n7-vision-grounding.json').read_text())=={
            'authorization':'N7-ONE-IMAGE-GROUNDING-FIX',
            'target':'/bot.piratecartography.com/n7-app',
            'preserve_model_data_and_conversations':True,
            'rollback':True
          }
          PY
      - name: Apply guarded live vision image-count fix
        run: python3 tools/n7/deploy_vision_grounding.py
