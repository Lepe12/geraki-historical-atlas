name: N7 security installation preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/n7-security-install-preflight.yml']
permissions:
  contents: read
jobs:
  private-runtime-preflight:
    runs-on: ubuntu-latest
    environment: nabou-production
    timeout-minutes: 10
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/n7
          persist-credentials: false
      - name: Fingerprint only the live runtime and security paths
        run: |
          PYTHONPATH=tools/n7 python3 - <<'PYCODE'
          import json
          from pathlib import Path
          import deploy_reconciled_runtime as d
          with d.connect() as ftp:
              paths=('server.js','n7-agents.js','n7-stream-attachments.js',
                     'n7-release-info.js','skills/registry.js','skills/mcp-client.js',
                     'skills/mcp-builtin-server.js','skills/mcp-builder-runtime.js',
                     'n7-security-agent.js','skills/cybersecurity-audit/SKILL.md')
              files={name:d.read(ftp,name,optional=True) for name in paths}
              for name,data in files.items():
                  print('N7_SECURITY_LIVE_FINGERPRINT',json.dumps({
                      'path':name,'sha256':d.sha(data) if data is not None else None}))
              server=files['server.js'] or b''
              stream=files['n7-stream-attachments.js'] or b''
              receipt=json.loads(d.read(ftp,'release-manifest.json'))
              print('N7_SECURITY_ROUTE_PREFLIGHT',json.dumps({
                  'chat_dispatch':b"require('./n7-agents.js').dispatch(history" in server,
                  'stream_dispatch':b"agents:require('./n7-agents.js')" in server and b'agents.dispatch(history' in stream,
                  'reporting_release':b"readReleaseInfo(__dirname)" in server,
                  'manifest_schema':receipt.get('schema'),
                  'manifest_files':len(receipt.get('files',{})),
                  'manifest_id':receipt.get('release_id')
              },sort_keys=True))

              from hashlib import sha256
              incoming = {'n7-security-agent.js': 'ba259213a7fa19d4e4e1bc38feaef5c1bd2a39c420b7b3c3f29b448d72c486cc', 'skills/cybersecurity-audit/SKILL.md': '19e2840d5ade84f6655d9b08ef7f611656db7034ebb78cf3a042a67569d58d3a', 'skills/mcp-builtin-server.js': 'c13aa699187b0b516853c9d29be002207080e158e9a576d0c9d108af198254db', 'skills/mcp-client.js': 'b52dd45f68c9496af73ba615efe884afb2505ea6f44212d3806fcdc9390aaaa3', 'n7-agents.js': 'c42d0a8b9c83579f129a0ea6f93d95d77dc726a44917a2eac2aef31beb8852f9'}
              predecessor = {'n7-security-agent.js': None, 'skills/cybersecurity-audit/SKILL.md': None, 'skills/mcp-builtin-server.js': '70bd1c4c65cc10b8c7e451136a623a59e5d1be961f4b4e07322c6246deb9ad99', 'skills/mcp-client.js': '77652e2170f80b0483faf03ede0bc264059ee711dc59bce8f98a423402aadc54', 'n7-agents.js': '38e3738cf099db6b433f4d6beeed28691ee9246b7f849fce483ce6541b3051a1'}
              expected_inventory = json.loads(Path('tools/n7/reconciled-runtime-contract.json').read_text())['files']
              if not set(receipt['files']) <= set(expected_inventory):
                  raise SystemExit('N7_SECURITY_UNKNOWN_MANIFEST_PATH')
              if any(
                  (d.sha(files[name]) if files[name] is not None else None) not in (before,incoming[name])
                  for name,before in predecessor.items()
              ):
                  raise SystemExit('N7_SECURITY_TARGET_DRIFT')
              preserved={}
              for name in sorted(set(receipt['files']) | (set(paths)-set(incoming))):
                  if name in incoming:
                      continue
                  data=files[name] if name in files else d.read(ftp,name)
                  if data is None:
                      raise SystemExit('N7_SECURITY_DEPENDENCY_NOT_AVAILABLE')
                  preserved[name]=d.sha(data)
              manifest={**preserved,**incoming}
              planned_release=sha256(json.dumps(manifest,sort_keys=True,separators=(',',':')).encode()).hexdigest()
              print('N7_SECURITY_READ_ONLY_DELTA',json.dumps({
                  'verified_predecessors':len(predecessor),'files_preserved':len(preserved),
                  'candidate_release_id':planned_release,'writes':0
              },sort_keys=True))
          PYCODE
