name: N7 security installation preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/n7-security-install-preflight.yml']
permissions:
  contents: read
jobs:
  private-runtime-preflight:
    runs-on: ubuntu-latest
    environment: nabou-production
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PCT_GITHUB_DISPATCH_TOKEN }}
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
      N7_CANONICAL_COMMIT: 61d172eb46287b2639cfc8d4d25cf8ff5e36b384
      N7_DRY_RUN: '1'
    steps:
      - name: Read GitHub scheduler diagnostics
        run: |
          set -euo pipefail
          repo=Lepe12/independent-ai-bot
          for pair in 'check-runs/135531674520/annotations annotations' 'actions/permissions permissions' 'environments/production environment' 'actions/runs/44515633558/jobs jobs' 'actions/runners runners' 'users/Lepe12/settings/billing/usage billing'; do
            read -r route label <<< "$pair"
            endpoint="repos/$repo/$route"
            if [[ "$label" == billing ]]; then endpoint="$route"; fi
            if gh api "$endpoint" > "$RUNNER_TEMP/n7-$label.json" 2>/dev/null; then
              case "$label" in
                annotations) jq -c '[.[] | {annotation_level, title, message}]' "$RUNNER_TEMP/n7-$label.json" ;;
                permissions) jq -c '{enabled,allowed_actions}' "$RUNNER_TEMP/n7-$label.json" ;;
                environment) jq -c '{name, rules:[.protection_rules[]?.type],deployment_branch_policy}' "$RUNNER_TEMP/n7-$label.json" ;;
                jobs) jq -c '[.jobs[] | {status,conclusion,runner_id,steps:(.steps|length)}]' "$RUNNER_TEMP/n7-$label.json" ;;
                runners) jq -c '{total_count}' "$RUNNER_TEMP/n7-$label.json" ;;
                billing) echo 'N7_BILLING_USAGE_ACCESSIBLE' ;;
              esac
            else
              echo "N7_DIAGNOSTIC_UNAVAILABLE $label"
            fi
          done
      - name: Fetch pinned private source only into this runner
        uses: actions/checkout@v4
        with:
          repository: Lepe12/independent-ai-bot
          ref: ${{ env.N7_CANONICAL_COMMIT }}
          token: ${{ secrets.PCT_GITHUB_DISPATCH_TOKEN }}
          persist-credentials: false
          path: private-n7
      - name: Check guarded installer without changing production
        working-directory: private-n7
        run: python3 tools/n7/deploy_reconciled_runtime.py
