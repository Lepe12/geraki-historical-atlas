name: N7 security installation preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/n7-security-install-preflight.yml']
permissions:
  contents: read
jobs:
  private-runtime-preflight:
    runs-on: ubuntu-latest
    environment: nabou-production
    timeout-minutes: 10
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/n7
          persist-credentials: false
      - name: Fingerprint only the live runtime and security paths
        run: |
          PYTHONPATH=tools/n7 python3 - <<'PYCODE'
          import json
          import deploy_reconciled_runtime as d
          with d.connect() as ftp:
              paths=('server.js','n7-agents.js','n7-stream-attachments.js',
                     'n7-release-info.js','skills/registry.js','skills/mcp-client.js',
                     'skills/mcp-builtin-server.js','skills/mcp-builder-runtime.js',
                     'n7-security-agent.js','skills/cybersecurity-audit/SKILL.md')
              files={name:d.read(ftp,name,optional=True) for name in paths}
              for name,data in files.items():
                  print('N7_SECURITY_LIVE_FINGERPRINT',json.dumps({
                      'path':name,'sha256':d.sha(data) if data is not None else None}))
              server=files['server.js'] or b''
              stream=files['n7-stream-attachments.js'] or b''
              receipt=json.loads(d.read(ftp,'release-manifest.json'))
              print('N7_SECURITY_ROUTE_PREFLIGHT',json.dumps({
                  'chat_dispatch':b"require('./n7-agents.js').dispatch(history" in server,
                  'stream_dispatch':b"agents:require('./n7-agents.js')" in server and b'agents.dispatch(history' in stream,
                  'reporting_release':b"readReleaseInfo(__dirname)" in server,
                  'manifest_schema':receipt.get('schema'),
                  'manifest_files':len(receipt.get('files',{})),
                  'manifest_id':receipt.get('release_id')
              },sort_keys=True))
          PYCODE
