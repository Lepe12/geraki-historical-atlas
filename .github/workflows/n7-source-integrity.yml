name: N7 canonical distribution integrity
on:
  pull_request:
    paths:
      - 'tools/n7/**'
      - 'tools/library/**'
      - 'n7-distribution.json'
      - 'tools/check_n7_distribution.py'
      - 'tools/test_n7_distribution.py'
      - '.github/workflows/n7-source-integrity.yml'
      - '.github/workflows/n7-source-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/n7
            tools/library
            tools/check_n7_distribution.py
            tools/test_n7_distribution.py
            n7-distribution.json
      - name: Verify every generated byte and immutable source pin
        id: source
        run: |
          python3 tools/test_n7_distribution.py
          python3 tools/check_n7_distribution.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('n7-distribution.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + manifest['commit'] + '\n')
          PY
