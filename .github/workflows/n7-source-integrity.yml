name: N7 canonical distribution integrity
on:
  pull_request:
    paths:
      - 'tools/n7/**'
      - 'tools/library/**'
      - 'n7-distribution.json'
      - 'tools/check_n7_distribution.py'
      - '.github/workflows/n7-source-integrity.yml'
      - '.github/workflows/n7-source-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: nabou-production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/n7
            tools/library
            tools/check_n7_distribution.py
            n7-distribution.json
      - name: Verify every generated byte and immutable source pin
        id: source
        run: |
          python3 tools/check_n7_distribution.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('n7-distribution.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + manifest['commit'] + '\n')
          PY
      - name: Require existing private cross-repository read connection
        env:
          N7_SOURCE_TOKEN: ${{ secrets.PCT_GITHUB_DISPATCH_TOKEN }}
        run: test -n "$N7_SOURCE_TOKEN"
      - name: Read authoritative N7 commit
        uses: actions/checkout@v4
        with:
          repository: Lepe12/independent-ai-bot
          ref: ${{ steps.source.outputs.commit }}
          token: ${{ secrets.PCT_GITHUB_DISPATCH_TOKEN }}
          persist-credentials: false
          path: .canonical-n7
      - name: Prove distribution matches the canonical repository
        run: python3 .canonical-n7/scripts/export_atlas_sources.py --destination "$GITHUB_WORKSPACE" --check
