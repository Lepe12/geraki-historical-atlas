name: NABOU workspace preview
on:
  pull_request:
    paths:
      # The preview also loads shared chamber modules and styles (research-ui.js,
      # chamber.css, ...), so any chamber change re-runs it.
      - 'jarvis-intelligence-chamber/**'
      - '.github/workflows/jarvis-workspace-preview.yml'
  push:
    branches: [main]
    paths:
      # The preview also loads shared chamber modules and styles (research-ui.js,
      # chamber.css, ...), so any chamber change re-runs it.
      - 'jarvis-intelligence-chamber/**'
      - '.github/workflows/jarvis-workspace-preview.yml'
permissions:
  contents: read
jobs:
  preview-browser:
    runs-on: ubuntu-latest
    # apt in "playwright install --with-deps" alone took 7.6 min on 2026-10-22
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # This job does not read research evidence; skip the multi-GB
          # evidence/ tree (see repo_size plan, option A).
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/
            !/backups/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preview syntax
        run: |
          node --check jarvis-intelligence-chamber/workspace-preview.js
          node --check jarvis-intelligence-chamber/workspace-preview-feed.js
          node --check jarvis-intelligence-chamber/workspace-preview-canvas.js
          node --check jarvis-intelligence-chamber/workspace-preview-renderer.js
          node --check jarvis-intelligence-chamber/workspace-preview-field.js
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify isolated preview interactions and responsive layout
        run: node jarvis-intelligence-chamber/workspace-preview.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nabou-workspace-preview
          path: jarvis-intelligence-chamber/screenshots/workspace-preview-*.png
          if-no-files-found: warn
