name: N7 acquire verified Niki CC0 Greek reference
on:
  pull_request:
    paths:
      - 'ops_ftps_requests/n7-niki-voice/**'
      - '.github/workflows/n7-niki-voice-acquire.yml'
  push:
    branches: [main]
    paths:
      - 'ops_ftps_requests/n7-niki-voice/owner-approved.json'
permissions:
  contents: write
concurrency:
  group: n7-niki-approved-voice-acquire
  cancel-in-progress: false
jobs:
  acquire-and-verify:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == 'refs/heads/main'
    environment: nabou-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PCT_FTPS_HOST: ${{ secrets.PCT_FTPS_HOST }}
      PCT_FTPS_USER: ${{ secrets.PCT_FTPS_USER }}
      PCT_FTPS_PASSWORD: ${{ secrets.PCT_FTPS_PASSWORD }}
      PCT_FTPS_PORT: ${{ vars.PCT_FTPS_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ops_ftps_requests/n7-niki-voice
            tools/n7_apex_preview/n7-voice-assets/niki
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU voice runtime for real Niki test
        run: python -m pip install --disable-pip-version-check --no-input pocket-tts numpy
      - name: Verify original reference SHA, CC0 license and synthesize actual Greek speech
        env:
          N7_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
          CUDA_VISIBLE_DEVICES: ''
        run: python ops_ftps_requests/n7-niki-voice/acquire.py
      - name: Acquire and permanently retain the verified CC0 Niki WAV in owner-controlled source branch
        if: github.event_name == 'push'
        env:
          N7_OFFLINE: '1'
          N7_SKIP_SYNTH: '1'
          N7_SAVE_SOURCE_DIR: tools/n7_apex_preview/n7-voice-assets/niki
        run: |
          set -euo pipefail
          python ops_ftps_requests/n7-niki-voice/acquire.py
          git config user.name "N7 voice source acquisition"
          git config user.email "n7-voice@users.noreply.github.com"
          git switch -c assets/n7-niki-cc0-20261119
          git add --sparse -f tools/n7_apex_preview/n7-voice-assets/niki/pocket_ref.wav tools/n7_apex_preview/n7-voice-assets/niki/source.json
          git commit -m "assets(N7): verified original Niki CC0 Pocket Greek reference"
          git push origin HEAD:refs/heads/assets/n7-niki-cc0-20261119
          echo "N7_NIKI_GITHUB_SOURCE_PERSISTED branch=assets/n7-niki-cc0-20261119 sha256=f9c67aa1d2951e6338af84245c1770e070cb6bc85960a6f249f7d7bf4357c3e0"
      - name: Read-only TopHost FTPS preflight
        env:
          N7_DRY_RUN: '1'
          N7_SKIP_SYNTH: '1'
        run: python ops_ftps_requests/n7-niki-voice/acquire.py
      - name: Stage exact Niki WAV under isolated N7 voice-assets without activating
        if: github.event_name == 'push'
        env:
          N7_DRY_RUN: '0'
          N7_SKIP_SYNTH: '1'
        run: python ops_ftps_requests/n7-niki-voice/acquire.py
