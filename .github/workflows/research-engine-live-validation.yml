name: Research engine live validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-engine-live-validation.yml'
      - 'tools/research_connector_probe.py'
permissions:
  contents: write
  models: read
jobs:
  endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            tools
            evidence/engine_validation
      - name: Install trusted certificates and public browser support
        run: |
          python3 -m pip install --quiet --upgrade certifi playwright
          python3 -m playwright install --with-deps chromium
          echo "SSL_CERT_FILE=$(python3 -m certifi)" >> "$GITHUB_ENV"
      - name: Inspect public endpoints and existing free model access
        env:
          SEARCHCULTURE_API_KEY: ${{ secrets.SEARCHCULTURE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/research_connector_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: engine-endpoint-validation
          path: evidence/engine_validation/${{ github.run_id }}/
      - name: Persist actual responses
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/engine_validation/
          git commit -m 'Record live archive endpoints and semantic availability'
          python3 tools/publish_research_outputs.py
