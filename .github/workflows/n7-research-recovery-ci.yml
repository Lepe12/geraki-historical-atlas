name: N7 research publication recovery regression

on:
  pull_request:
    paths:
      - 'tools/aggregate_source_genealogy.py'
      - 'tools/publish_research_outputs.py'
      - 'tools/n7_recovery_public_summary.py'
      - 'tools/test_n7_recovery_public_summary.py'
      - 'tools/test_publish_research_outputs.py'
      - 'tools/test_n7_research_recovery.py'
      - '.github/workflows/n7-recover-existing-evidence.yml'
      - '.github/workflows/n7-research-recovery-ci.yml'
      - '.github/workflows/pct-parallel-multi-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools
            .github/workflows/n7-recover-existing-evidence.yml
      - name: Compile and check deterministic recovery tests
        env:
          PYTHONPATH: tools
          PCT_LLM_PROVIDER: disabled
        run: |
          python3 -m py_compile tools/aggregate_source_genealogy.py tools/publish_research_outputs.py tools/research_lane_handoff.py tools/n7_recovery_public_summary.py tools/test_n7_research_recovery.py tools/test_n7_recovery_public_summary.py
          python3 -m unittest tools/test_n7_research_recovery.py tools/test_n7_recovery_public_summary.py tools/test_publish_research_outputs.py tools/test_research_lane_handoff.py -v
      - name: Verify recovery workflow never dispatches new archive searches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/n7-recover-existing-evidence.yml').read_text()
          assert 'actions/download-artifact@v4' in w
          assert 'research_lane_handoff.py merge' in w
          assert 'SOURCE_RUN' in w
          assert 'gh workflow run research-semantic-reanalysis.yml' in w
          assert 'skip_citation_acquisition=true' in w
          assert 'auto_continue=false' in w
          assert 'pct-parallel-multi-agent.yml' not in w
          assert 'RECOVERY_SUMMARY.json' in w
          assert 'publication_mode == \'full\'' in w
          print('N7_NO_RESEARCH_RESCAN_AND_NO_AUTOMATIC_CHAIN_PASS')
          PY
