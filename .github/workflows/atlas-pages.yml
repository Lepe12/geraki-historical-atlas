name: Deploy Historical Atlas to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "command-center/**"
      - "command-center-v3/**"
      - "command-center-v4/**"
      - "command-center-v5/**"
      - "jarvis-intelligence-chamber/**"
      - "lone-pirate/**"
      - "data.json"
      - "icons/**"
      - "generate_diorama_assets.py"
      - "tools/orchestrator/build_research_history.py"
      - ".github/workflows/atlas-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Finish the active deployment; replace only an older pending run.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job does not read research evidence; skip the multi-GB
          # evidence/ tree (see repo_size plan, option A).
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/
            !/backups/

      - name: Stage atlas
        run: |
          python3 tools/orchestrator/build_research_history.py
          mkdir -p _site/icons
          # Publish only the web site. Research evidence (evidence/, ~14 GB of run
          # corpora, OCR text and page images) and data backups (backups/) stay in
          # the repository but are not fetched by any page, so they are not uploaded
          # to GitHub Pages (artifact limit). Pages read live data from
          # command-center/live/, which is still published.
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude '/evidence/' --exclude '/backups/' \
            --exclude 'node_modules/' \
            ./ _site/

      - name: Build standalone JARVIS APEX Research Network preview
        shell: bash
        run: |
          set -euo pipefail
          cd command-center-v5
          npm install --no-audit --no-fund
          npm run build
          cd ..
          rm -rf _site/command-center-v5
          mkdir -p _site/command-center-v5
          cp -a command-center-v5/dist/. _site/command-center-v5/

      - name: Install Mercator settlement drawings
        shell: bash
        run: |
          set -euo pipefail
          URL="https://kmalexander.com/wp-content/uploads/2026/06/mercator-settlement-png-pack-1.1.zip"
          curl -L --fail --retry 3 --retry-delay 2 "$URL" -o /tmp/mercator.zip
          mkdir -p /tmp/mercator
          unzip -q /tmp/mercator.zip -d /tmp/mercator

          mapfile -t ALL < <(find /tmp/mercator -type f -iname '*.png' | sort)
          if [ "${#ALL[@]}" -lt 10 ]; then
            echo "Mercator PNG pack did not unpack as expected."
            exit 1
          fi

          pick_group () {
            local regex="$1"
            local prefix="$2"
            local count="$3"
            mapfile -t MATCHES < <(printf '%s\n' "${ALL[@]}" | grep -Ei "$regex" || true)
            if [ "${#MATCHES[@]}" -eq 0 ]; then
              echo "No Mercator assets matched: $regex"
              exit 1
            fi
            local i=1
            for src in "${MATCHES[@]}"; do
              cp "$src" "_site/icons/${prefix}-${i}.png"
              i=$((i+1))
              [ "$i" -gt "$count" ] && break
            done
            while [ "$i" -le "$count" ]; do
              cp "${MATCHES[0]}" "_site/icons/${prefix}-${i}.png"
              i=$((i+1))
            done
          }

          # Strict category separation: do not mix Small Town / Town / Large Town / City assets.
          mapfile -t SMALL < <(printf '%s\n' "${ALL[@]}" | grep -Ei 'small[ _-]*town' || true)
          mapfile -t LARGE < <(printf '%s\n' "${ALL[@]}" | grep -Ei 'large[ _-]*town' || true)
          mapfile -t CITY < <(printf '%s\n' "${ALL[@]}" | grep -Ei '/cities?/|[ _-]cit(y|ies)([ _.-]|$)' || true)
          mapfile -t UNIQUE < <(printf '%s\n' "${ALL[@]}" | grep -Ei 'unique[ _-]*settlement' || true)
          mapfile -t TOWN < <(printf '%s\n' "${ALL[@]}" | grep -Ei 'town' | grep -Eiv 'small[ _-]*town|large[ _-]*town' || true)

          copy_set () {
            local arr_name="$1"; local prefix="$2"; local count="$3"
            eval 'local vals=("${'"$arr_name"'[@]}")'
            if [ "${#vals[@]}" -eq 0 ]; then echo "Missing Mercator category: $arr_name"; exit 1; fi
            local i=1
            for src in "${vals[@]}"; do
              cp "$src" "_site/icons/${prefix}-${i}.png"
              i=$((i+1)); [ "$i" -gt "$count" ] && break
            done
            while [ "$i" -le "$count" ]; do cp "${vals[0]}" "_site/icons/${prefix}-${i}.png"; i=$((i+1)); done
          }

          copy_set SMALL mercator-village 4
          copy_set TOWN mercator-town 6
          copy_set LARGE mercator-city 4
          copy_set CITY mercator-capital 2
          copy_set UNIQUE mercator-unique 4

          printf '%s\n'             'Settlement artwork source: K. M. Alexander, Mercator Settlement PNG Pack 1.1.'             'Derived from Gerardus Mercator / early Hondius material; distributed CC0.'             'https://kmalexander.com/2026/06/30/mercator-settlement-a-free-16th-century-settlement-brush-set-for-fantasy-maps/'             > _site/icons/MERCATOR-SOURCE.txt

      - name: Generate diorama settlement assets
        run: |
          python -m pip install --quiet pillow
          python generate_diorama_assets.py

      - name: Bundle authentic 1662 Aegean map image for immediate viewing
        shell: bash
        run: |
          set -euo pipefail
          URL="https://upload.wikimedia.org/wikipedia/commons/7/74/1662_Portolan_chart_of_the_Aegean_Sea_and_the_Dardanelles_by_Fran%C3%A7ois_Ollive.jpg"
          TARGET="_site/jarvis-intelligence-chamber/assets"
          mkdir -p "$TARGET"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 100 "$URL" -o /tmp/nabou-ollive-original.jpg
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          original=Image.open("/tmp/nabou-ollive-original.jpg")
          original.thumbnail((1700,1400))
          path=Path("_site/jarvis-intelligence-chamber/assets/ollive-aegean-1662-preview.jpg")
          original.convert("RGB").save(path,quality=85,optimize=True)
          print("BUNDLED_AUTHENTIC_1662_MAP",original.size,path.stat().st_size)
          PY
          printf '%s\n' 'François Ollive, Aegean Sea and Dardanelles portolan, 1662.' \
            'Original: BnF Gallica btv1b59010993; redistributed via Wikimedia Commons.' \
            'Public Domain Mark 1.0; preview resized from the authentic source.' \
            "$URL" > "$TARGET/OLLive-1662-SOURCE.txt"

      - name: Check Pages artifact size
        shell: bash
        run: |
          set -euo pipefail
          find _site -type l -print -delete
          BYTES=$(du -sb _site | cut -f1)
          echo "PAGES_SITE_BYTES=$BYTES"
          du -sh _site/* | sort -h | tail -n 10
          LIMIT=$((1000 * 1000 * 1000))
          if [ "$BYTES" -gt "$LIMIT" ]; then
            echo "::error::Pages site is $BYTES bytes, above the 1 GB GitHub Pages limit. Exclude non-web data in the 'Stage atlas' step."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Atlas
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
