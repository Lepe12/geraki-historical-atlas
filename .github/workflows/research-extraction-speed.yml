name: Incremental reading and extraction speed
on:
  pull_request:
    paths:
      - 'tools/semantic_research_answer.py'
      - 'tools/research_checkpoint_compatibility.json'
      - 'tools/test_incremental_reading.py'
      - 'tools/benchmark_extraction_speed.py'
      - 'tools/test_benchmark_extraction_speed.py'
      - 'tools/research_cpu_cache.py'
      - 'tools/test_research_cpu_cache.py'
      - '.github/actions/research-model/action.yml'
      - 'data/research_benchmarks/extraction_speed.json'
      - '.github/workflows/research-extraction-speed.yml'
  push:
    branches: [main]
    paths:
      - 'inference_speed_requests/*.json'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Optional existing diagnostic run: review its preserved extraction outputs only'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  regression:
    outputs:
      source_run: ${{ steps.request.outputs.source_run }}
      publish_only: ${{ steps.request.outputs.publish_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            tools
            data
            .github
            inference_speed_requests
      - id: request
        name: Resolve an explicit comparison-only recovery request
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python3 - <<'PYREQUEST'
          import json,os,re,subprocess
          from pathlib import Path
          source=os.environ.get('SOURCE_RUN_ID','').strip()
          publish_only=False
          request='inference_speed_requests/review-existing-extraction.json'
          if os.environ['GITHUB_EVENT_NAME']=='push':
              changed=subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],text=True).splitlines()
              if request in changed:
                  value=json.loads(Path(request).read_text())
                  assert value['schema']=='research-extraction-review-resume-v1'
                  assert value['action'] in ('review_existing_extraction_only','publish_existing_comparison_only')
                  publish_only=value['action']=='publish_existing_comparison_only'
                  source=value['source_run_id']
          if source and not re.fullmatch(r'[0-9]+',source):raise ValueError('INVALID_SOURCE_RUN_ID')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('source_run='+source+'\n')
              out.write('publish_only='+str(publish_only).lower()+'\n')
          PYREQUEST
      - name: Verify incremental source reuse and unchanged extraction prompts
        env:
          PYTHONPATH: tools:tools/llm
        run: |
          python3 -m unittest tools.test_incremental_reading tools.test_benchmark_extraction_speed tools.test_research_cpu_cache tools.test_research_continuation tools.test_research_shard_replay tools.test_semantic_shards tools.test_semantic_research_answer -q
          python3 - <<'PY'
          import hashlib
          from benchmark_extraction_speed import load_fixture
          from semantic_research_answer import extraction_request
          fixture,_=load_fixture()
          for case in fixture['cases']:
              prompt,_=extraction_request([case['record']],case['question'],case['question_kind'])
              assert hashlib.sha256(prompt.encode()).hexdigest()==case['production_prompt_sha256']
          print('Frozen production extraction prompts are byte-identical')
          PY
  extract:
    needs: regression
    if: github.event_name != 'pull_request' && needs.regression.outputs.source_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: Qwen/Qwen3-8B-GGUF
            slug: baseline
          - model: Qwen/Qwen2.5-3B-Instruct-GGUF
            slug: candidate
    env:
      PCT_LLM_PROVIDER: local_llama_cpp
      PCT_LLM_MODEL: ${{ matrix.model }}
      PCT_LLM_EXTRACTOR_MODEL: ${{ matrix.model }}
      PCT_LOCAL_MODEL_REPOSITORY: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools
            data
            .github/actions/research-model
      - uses: ./.github/actions/research-model
      - name: Measure actual extraction on identical acquired OCR
        env:
          PYTHONPATH: tools:tools/llm
        run: python3 tools/benchmark_extraction_speed.py run --output extraction-result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extraction-${{ matrix.slug }}-${{ github.run_id }}
          path: extraction-result/
          if-no-files-found: error
          retention-days: 90
  compare:
    needs: [regression, extract]
    if: always() && github.event_name != 'pull_request' && needs.regression.result == 'success' && needs.regression.outputs.publish_only != 'true' && (needs.extract.result != 'skipped' || needs.regression.outputs.source_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PCT_LLM_PROVIDER: local_llama_cpp
      PCT_LLM_MODEL: Qwen/Qwen3-8B-GGUF
      PCT_LLM_ADVERSARIAL_MODEL: Qwen/Qwen3-8B-GGUF
      PCT_LOCAL_MODEL_REPOSITORY: Qwen/Qwen3-8B-GGUF
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            tools
            data
            .github/actions/research-model
            evidence/configuration/${{ needs.regression.outputs.source_run || github.run_id }}
            evidence/configuration/${{ github.run_id }}
      - uses: actions/download-artifact@v4
        if: needs.regression.outputs.source_run == ''
        with:
          pattern: extraction-*-${{ github.run_id }}
          path: extraction-results
      - name: Reuse durably preserved extraction reports without new extraction
        if: needs.regression.outputs.source_run != ''
        env:
          SOURCE_RUN_ID: ${{ needs.regression.outputs.source_run }}
        run: cp -R "evidence/configuration/$SOURCE_RUN_ID/extraction-speed/extraction-results" extraction-results
      - uses: ./.github/actions/research-model
      - name: Larger-model review and measured comparison (no automatic promotion)
        env:
          PYTHONPATH: tools:tools/llm
        run: python3 tools/benchmark_extraction_speed.py compare --incoming extraction-results --output "evidence/configuration/$GITHUB_RUN_ID/extraction-speed"
      - name: Preserve measured inputs and outputs with the comparison
        if: always()
        run: |
          destination="evidence/configuration/$GITHUB_RUN_ID/extraction-speed"
          mkdir -p "$destination"
          if [ -d extraction-results ]; then cp -R extraction-results "$destination/"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extraction-speed-comparison-${{ github.run_id }}
          path: evidence/configuration/${{ github.run_id }}/extraction-speed/
          retention-days: 90
      - name: Publish diagnostic receipts without changing research pointers or model defaults
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "evidence/configuration/$GITHUB_RUN_ID/extraction-speed/"
          if ! git diff --cached --quiet; then
            git commit -m "Record actual extraction speed and fidelity comparison $GITHUB_RUN_ID"
            python3 tools/publish_research_outputs.py
          fi

  publish-comparison:
    needs: regression
    if: github.event_name != 'pull_request' && needs.regression.outputs.publish_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_RUN_ID: ${{ needs.regression.outputs.source_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            tools
            data/research_benchmarks
            evidence/configuration/${{ needs.regression.outputs.source_run }}
      - name: Wait only for the explicitly requested saved comparison artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export ARTIFACT_NAME="extraction-speed-comparison-$SOURCE_RUN_ID"
          for attempt in $(seq 1 20); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == env.ARTIFACT_NAME)] | length')
            if [ "$count" = 1 ]; then exit 0; fi
            sleep 30
          done
          echo 'COMPARISON_ARTIFACT_NOT_AVAILABLE'
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: extraction-speed-comparison-${{ needs.regression.outputs.source_run }}
          run-id: ${{ needs.regression.outputs.source_run }}
          github-token: ${{ github.token }}
          path: evidence/configuration/${{ needs.regression.outputs.source_run }}/extraction-speed
      - name: Validate the saved diagnostic comparison before durable publication
        run: |
          python3 - <<'PYPRESERVE'
          import hashlib,json,os
          from pathlib import Path
          root=Path('evidence/configuration')/os.environ['SOURCE_RUN_ID']/'extraction-speed'
          report=json.loads((root/'comparison.json').read_text())
          expected=hashlib.sha256(Path('data/research_benchmarks/extraction_speed.json').read_bytes()).hexdigest()
          assert report['schema']=='research-extraction-speed-comparison-v1'
          assert report['fixture_sha256']==expected
          assert report['active_model_changed'] is False
          assert report['historical_verified'] is False
          print(json.dumps({k:report[k] for k in ('seconds','candidate_baseline_ratio','quality','recommendation','active_model_changed')}))
          PYPRESERVE
      - name: Publish and verify the saved comparison without any model call
        timeout-minutes: 4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "evidence/configuration/$SOURCE_RUN_ID/extraction-speed/"
          if ! git diff --cached --quiet; then
            git commit -m "Preserve completed extraction comparison $SOURCE_RUN_ID without repeating inference"
            python3 tools/publish_research_outputs.py
          fi
