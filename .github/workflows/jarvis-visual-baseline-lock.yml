name: JARVIS Visual Baseline Lock

on:
  push:
    branches: ["main"]
    paths:
      - "jarvis-intelligence-chamber/index.html"
      - "jarvis-intelligence-chamber/chamber.css"
      - "jarvis-intelligence-chamber/chamber.js"
      - "jarvis-intelligence-chamber/gpu-field.js"
      - ".github/workflows/jarvis-visual-baseline-lock.yml"
  pull_request:
    paths:
      - "jarvis-intelligence-chamber/index.html"
      - "jarvis-intelligence-chamber/chamber.css"
      - "jarvis-intelligence-chamber/chamber.js"
      - "jarvis-intelligence-chamber/gpu-field.js"
      - ".github/workflows/jarvis-visual-baseline-lock.yml"
  workflow_dispatch:

jobs:
  protect-approved-visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify approved JARVIS visual baseline
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="5223d9176e9d4f03bceccee0b32d94090024bd37"
          git cat-file -e "$BASELINE^{commit}"
          git diff --exit-code "$BASELINE" HEAD --             jarvis-intelligence-chamber/index.html             jarvis-intelligence-chamber/chamber.css             jarvis-intelligence-chamber/chamber.js             jarvis-intelligence-chamber/gpu-field.js || {
              echo "::error::JARVIS visual baseline is LOCKED. Approved visual files differ from canonical commit $BASELINE."
              echo "::error::Unlock/re-approve the baseline intentionally before changing these files."
              exit 1
            }
          echo "JARVIS visual baseline matches canonical commit $BASELINE."
