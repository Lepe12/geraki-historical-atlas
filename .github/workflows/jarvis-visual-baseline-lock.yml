name: JARVIS 3D Core Lock

on:
  push:
    branches: ["main"]
    paths:
      - "jarvis-intelligence-chamber/chamber.js"
      - "jarvis-intelligence-chamber/gpu-field.js"
      - ".github/workflows/jarvis-visual-baseline-lock.yml"
  pull_request:
    paths:
      - "jarvis-intelligence-chamber/chamber.js"
      - "jarvis-intelligence-chamber/gpu-field.js"
      - ".github/workflows/jarvis-visual-baseline-lock.yml"
  workflow_dispatch:

jobs:
  protect-approved-3d:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify approved JARVIS 3D core
        shell: bash
        run: |
          set -euo pipefail
          # Startup lifecycle and live agent integration; renderer geometry and GPU layer remain protected.
          BASELINE="a6dfc8ca96153bc6168705d23e631217dd43f8bb"
          git cat-file -e "$BASELINE^{commit}"
          git diff --exit-code "$BASELINE" HEAD --             jarvis-intelligence-chamber/chamber.js             jarvis-intelligence-chamber/gpu-field.js || {
              echo "::error::JARVIS 3D core is LOCKED. Renderer files differ from canonical commit $BASELINE."
              echo "::error::Unlock/re-approve the 3D baseline intentionally before changing these files."
              exit 1
            }
          echo "JARVIS 3D core matches canonical commit $BASELINE."
