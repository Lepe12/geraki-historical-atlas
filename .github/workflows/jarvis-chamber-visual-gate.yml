name: JARVIS Chamber 3D Visual Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'jarvis-intelligence-chamber/**'
      - '.github/workflows/jarvis-chamber-visual-gate.yml'
  push:
    branches: [main]
    paths:
      - 'jarvis-intelligence-chamber/**'
      - '.github/workflows/jarvis-chamber-visual-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # This job does not read research evidence; skip the multi-GB
          # evidence/ tree (see repo_size plan, option A).
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/evidence/
            !/backups/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and references
        run: |
          node --check jarvis-intelligence-chamber/chamber.js
          node --check jarvis-intelligence-chamber/gpu-field.js
          grep -q 'src="./chamber.js' jarvis-intelligence-chamber/index.html
          grep -q 'src="./gpu-field.js' jarvis-intelligence-chamber/index.html
          ! grep -q 'src="./world3d.js"' jarvis-intelligence-chamber/index.html
      - name: Verify source content search and research state
        run: node --test jarvis-intelligence-chamber/source-search.test.cjs jarvis-intelligence-chamber/live-bridge.test.cjs jarvis-intelligence-chamber/research-export.test.cjs jarvis-intelligence-chamber/assistant/assistant-intents.test.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify Historical Map Lab in actual headless Chromium
        run: node jarvis-intelligence-chamber/historical-map-browser.test.cjs
      - name: Verify original map image and manual GCP review in actual headless Chromium
        run: node jarvis-intelligence-chamber/historical-map-review-browser.test.cjs
      # The current four-destination workspace replaces the legacy cinematic and voice shell.
      # Each browser suite starts its own isolated server and never dispatches production work.
      - name: Verify renderer, workspace navigation and responsive layout
        env:
          NABOU_SCREENSHOT_DIR: jarvis-intelligence-chamber/screenshots
        run: node jarvis-intelligence-chamber/workspace-layout.test.cjs
      - name: Verify research dossier, dispatch correlation and history recovery
        env:
          NABOU_SCREENSHOT_DIR: jarvis-intelligence-chamber/screenshots
        run: node jarvis-intelligence-chamber/research-flow.test.cjs
      - name: Verify immediate startup feedback and real agent preparation
        run: node jarvis-intelligence-chamber/startup-feedback.test.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-chamber-3d-visual-evidence
          path: |
            jarvis-intelligence-chamber/screenshots/*.png
            jarvis-intelligence-chamber/screenshots/*.json
          if-no-files-found: warn
