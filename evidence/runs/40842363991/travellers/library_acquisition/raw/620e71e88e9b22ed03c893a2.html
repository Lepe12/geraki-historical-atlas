y="og:image:alt" content="Women, Sex and Marriage in Early Modern Venice"><meta property="books:isbn" content="9781315233574"><meta property="books:page_count" content="282"><meta name="audience" content="all"><meta name="distribution" content="global"><meta name="citation_title" content="Women, Sex and Marriage in Early Modern Venice"><meta name="citation_publication_date" content="2017/05/15"><meta name="citation_isbn" content="9781315233574"><meta name="citation_publisher" content="Routledge"><meta name="citation_pdf_url" content="https://api.taylorfrancis.com/content/books/mono/download?identifierName=doi&amp;identifierValue=10.4324/9781315233574&amp;type=googlepdf"><meta name="citation_doi" content="10.4324/9781315233574"><meta name="citation_abstract" content="Women, Sex, and Marriage in Early Modern Venice is the first study to investigate systematically the moral policies of both Church and State in the age of Counter-Reformation confessionalisation in Venice. Examining ecclesiastical and civil lawsuits related to illicit sex, broken marriage promises and disrupted marriages of artisan and ordinary women and men, Daniela Hacke can convincingly show how central sexual morality was to the patriarchal society of sixteenth and seventeenth century Venice. Drawing on a wide range of archival sources, the author skilfully reconstructs what gender difference meant in daily life, in courtship rituals, marital disputes, and in sexual relations. In the streets and in the courts, women and men fought not only over proper gender behaviour within and outside marriage, but also about the meaning of conjugality and of domestic patriarchy. Neighbours played an active role in mediating between distressed partners and between children and parents. Their interventions and perceptions reveal much about the moral values and the networks of support within a fascinatingly heterogeneous community such as early modern Venice. The study makes important contributions to the fields of gender history, social history and the history of crime and sexuality."><meta property="citation_author" content="Daniela Hacke"><meta name="citation_xml_url" content="https://api.taylorfrancis.com/content/books/mono/download?identifierName=doi&amp;identifierValue=10.4324/9781315233574&amp;type=bookxml"><meta property="books:author" content="Daniela Hacke"></head>

q;subtitle&q;:null,&q;description&q;:&q;Women, Sex, and Marriage in Early Modern Venice is the first study to investigate systematically the moral policies of both Church and State in the age of Counter-Reformation confessionalisation in Venice. Examining ecclesiastical and civil lawsuits related to illicit sex, broken marriage promises and disrupted marriages of artisan and ordinary women and men, Daniela Hacke can convincingly show how central sexual morality was to the patriarchal society of sixteenth and seventeenth century Venice.   Drawing on a wide range of archival sources, the author skilfully reconstructs what gender difference meant in daily life, in courtship rituals, marital disputes, and in sexual relations. In the streets and in the courts, women and men fought not only over proper gender behaviour within and outside marriage, but also about the meaning of conjugality and of domestic patriarchy. Neighbours played an active role in mediating between distressed partners and between children and parents. Their interventions and perceptions reveal much about the moral values and the networks of support within a fascinatingly heterogeneous community such as early modern Venice.   The study makes important contributions to the fields of gender history, social history and the history of crime and sexuality.&q;,&q;publisherImprint&q;:&q;Routledge&q;,&q;publicationDate&q;:&q;2017-05-15T00:00:00.000Z&q;,&q;copyright&q;:{&q;holder&q;:&q;Daniela Hacke&q;,&q;year&q;:2004,&q;statement&q;:&q;Copyright © 2004 Daniela Hacke&q;},&q;edition&q;:1,&q;doiRegistrationStatus&q;:true,&q;firstPublishedYear&q;:&q;2004&q;,&q;plannedPublicationDate&q;:&q;2017-03-28T00:00:00.000Z&q;,&q;abstracts&q;:[],&q;citation&q;:&q;Hacke, D. (2004). Women, Sex and Marriage in Early Modern Venice (1st ed.). Routledge. https://doi.org/10.4324/9781315233574&q;,&q;bindingStyle&q;:&q;eBook - General&q;,&q;bindingStyleCode&q;:&q;EBGE&q;,&q;publicationLocation&q;:&q;London&q;,&q;formerImprints&q;:[{& rom&q;:null},{&q;name&q;:&q;EBRALL&q;,&q;code&q;:&q;EBRALL&q;,&q;text&q;:&q;Institutional, retail and Atypon&q;,&q;type&q;:&q;access&q;,&q;description&q;:null,&q;validTo&q;:null,&q;validFrom&q;:null},{&q;name&q;:&q;NORIGHTSMOB&q;,&q;code&q;:&q;NORIGHTSMOB&q;,&q;text&q;:&q;No Mobi&q;,&q;type&q;:&q;access&q;,&q;description&q;:null,&q;validTo&q;:null,&q;validFrom&q;:null}],&q;audience&q;:[],&q;chapter&q;:{&q;pageStart&q;:&q;89&q;,&q;pageEnd&q;:&q;118&q;,&q;label&q;:&q;5&q;,&q;license&q;:null,&q;fundingGroups&q;:[{&q;fundingStatement&q;:null,&q;awardGroupDetails&q;:[{&q;name&q;:&q;funderName&q;,&q;value&q;:null}]}],&q;groupOfCompany&q;:&q;OBB&q;,&q;podSuitable&q;:false,&q;subtitle&q;:null,&q;description&q;:null,&q;publisherImprint&q;:&q;Routledge&q;,&q;publicationDate&q;:&q;2017-05-15T00:00:00.000Z&q;,&q;copyright&q;:{},&q;edition&q;:1,&q;doiRegistrationStatus&q;:false,&q;firstPublishedYear&q;:&q;2004&q;,&q;plannedPublicationDate&q;:&q;2017-03-28T00:00:00.000Z&q;,&q;inLanguage&q;:&q;eng&q;,&q;abstracts&q;:[{&q;type&q;:&q;xml&q;,&q;position&q;:0,&q;caption&q;:null,&q;transcript&q;:null,&q;textType&q;:&q;enriched&q;,&q;value&q;:&q;&l;p&g;In early modern societies, the &s;proper&s; making of the conjugal bond involved a &s;precarious balance&s; between the canonical model of consensual marriage and parental authority. When parents and children were in open conflict, the will of the children and parental authority constituted forceful opponents, disrupting domestic and neighbourhood life. When different or even opposing interests had to be negotiated, marriage formation, as the authors have seen, carried a potential for household conflict: patrician parents, in particular, had property transactions, social and political networks and social status in mind when marrying their children. Descriptions of the characters involved in the litigation also reinforced this impression: plaintiffs and witnesses portrayed parents as cruel, vindictive and frightening, and as ruling over shy, intimidated and frightened children. Litigants&s; narratives and complaints about extreme violence, physical coercion and unsound marital plans did not end here. In the end the &s;fear and force&s; through which parents and guardians attempted to realise their marital plans often backfired.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781315233574-7&q;,&q;chapterId&q;:&q;chapter5&q;,&q;sku&q;:null},&q;label&q;:&q;5&q;,&q;pageStart&q;:&q;89&q;,&q;pageEnd&q;:&q;118&q;,&q;parentId&q;:&q;94858e8c-8c13-4e65-9ea3-6d1d40c4869f&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;2b268705-29c4-49c4-a7dc-d7a83706052f&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1183,&q;location&q;:null},{&q;_id&q;:&q;f86c7668-1c96-4dd2-8920-a341cbb87484&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:160457,&q;location&q;:null},{&q;_id&q;:&q;c4d903d1-2ab6-4e10-824c-7daf55e399d5&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:13906,&q;location&q;:&q;https://images.tandf.co.uk/common/jackets/crclarge/978131523/9781315233574.jpg&q;},{&q;_id&q;:&q;75f5f9da-fa5f-4337-8c49-3c047c91904a&q;,&q;type&q;:&q;dbitsxml&q;,&q;size&q;:113974,&q;location&q;:null}],&q;level&q;:2,&q;position&q;:1,&q;availability&q;:[{&q;name&q;:&q;EDI-EBSCO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EDI-Apollo&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;DigitalScience&q;,&q;status&q;:[&q;VALID&q;],&q;errors&q;:[],&q;type&q;:&q;content&q;},{&q;name&q;:&q;LOGPRO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;SF OMS&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EDI-Amazon&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EBSCO&q;,&q;status&q;:[&q iarchal authority. Although canon law restricted the right to grant separations on grounds of cruelty and deep hatred, women&s;s allegations did not end here, for a husband&s;s moral integrity was an essential aspect of good household government.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781315233574-8&q;,&q;chapterId&q;:&q;chapter6&q;,&q;sku&q;:null},&q;label&q;:&q;6&q;,&q;pageStart&q;:&q;119&q;,&q;pageEnd&q;:&q;143&q;,&q;parentId&q;:&q;94858e8c-8c13-4e65-9ea3-6d1d40c4869f&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;7c69be9e-f438-4aa7-b584-9d8cb53b4098&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1057,&q;location&q;:null},{&q;_id&q;:&q;b6b3079c-e580-4792-abe3-8d7665a47dc5&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:163974,&q;location&q;:null},{&q;_id&q;:&q;27c72813-6217-421c-a913-1e37093b0e5c&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:13906,&q;location&q;:&q;https://images.tandf.co.uk/common/jackets/crclarge/978131523/9781315233574.jpg&q;},{&q;_id&q;:&q;93395ae5-9e75-40fe-a819-423e5a1a5a26&q;,&q;type&q;:&q;dbitsxml&q;,&q;size&q;:98364,&q;location&q;:null}],&q;level&q;:2,&q;position&q;:2,&q;availability&q;:[{&q;name&q;:&q;EDI-EBSCO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EDI-Apollo&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;DigitalScience&q;,&q;status&q;:[&q;VALID&q;],&q;errors&q;:[],&q;type&q;:&q;content&q;},{&q;name&q;:&q;LOGPRO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;SF OMS&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EDI-Amazon&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EBSCO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;NOT_RHO_COLLECTION ion drawn between emotional relationships and the success or failure of sexual practices is striking in trials on impotence, and feelings and emotions gained in relevance in disputes between spouses. Not only the relationship between husband and wife but also attitudes towards sexuality had changed from the Middle Ages to the early modern period.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781315233574-9&q;,&q;chapterId&q;:&q;chapter7&q;,&q;sku&q;:null},&q;label&q;:&q;7&q;,&q;pageStart&q;:&q;144&q;,&q;pageEnd&q;:&q;174&q;,&q;parentId&q;:&q;94858e8c-8c13-4e65-9ea3-6d1d40c4869f&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;f43222aa-c6c7-40ca-a868-36f685205c94&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1095,&q;location&q;:null},{&q;_id&q;:&q;3af15cd4-7281-475f-b43e-d206305ef5f8&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:183110,&q;location&q;:null},{&q;_id&q;:&q;aa9dbdcd-5db2-427d-bc2f-20551bdfbb1b&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:13906,&q;location&q;:&q;https://images.tandf.co.uk/common/jackets/crclarge/978131523/9781315233574.jpg&q;},{&q;_id&q;:&q;4aaf5b3b-d0e2-43aa-89fc-e869edb71ff5&q;,&q;type&q;:&q;dbitsxml&q;,&q;size&q;:134140,&q;location&q;:null}],&q;level&q;:2,&q;position&q;:3,&q;availability&q;:[{&q;name&q;:&q;EDI-EBSCO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EDI-Apollo&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;DigitalScience&q;,&q;status&q;:[&q;VALID&q;],&q;errors&q;:[],&q;type&q;:&q;content&q;},{&q;name&q;:&q;LOGPRO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;SF OMS&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EDI-Amazon&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:  of sexual activities that secular government legislation treated as crimes was extensive&s;. Although research on both Venetian legislation and legal practice is extensive, what is still missing is a gender-specific approach to premarital sexuality and sexual crimes. At the beginning of the sixteenth century the Venetian secular authorities increasingly attempted to protect respectable Venetian citizens against accusations made by an &s;infamous&s; woman who demanded dowry payment after having consented to premarital sexuality and after having lost her virginity. In legal practice the Executors against Blasphemy had to be convinced that sexual intercourse had occurred under the pretext of marriage, or that virginity had been taken with fraud and violence.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781315233574-11&q;,&q;chapterId&q;:&q;chapter8&q;,&q;sku&q;:null},&q;label&q;:&q;9&q;,&q;pageStart&q;:&q;177&q;,&q;pageEnd&q;:&q;200&q;,&q;parentId&q;:&q;0fd073f6-4d89-488b-8c0c-39e30562e69f&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;c11f129d-2f77-4ae8-8352-dfee668f0a2c&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1179,&q;location&q;:null},{&q;_id&q;:&q;c460f6fb-85d4-4177-bc57-39946d1f9ca9&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:155426,&q;location&q;:null},{&q;_id&q;:&q;89ba29fa-0334-464b-9661-2a58f616ad63&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:13906,&q;location&q;:&q;https://images.tandf.co.uk/common/jackets/crclarge/978131523/9781315233574.jpg&q;},{&q;_id&q;:&q;67b4e032-90fd-4b64-9c4f-acd80480c676&q;,&q;type&q;:&q;dbitsxml&q;,&q;size&q;:96881,&q;location&q;:null}],&q;level&q;:2,&q;position&q;:1,&q;availability&q;:[{&q;name&q;:&q;EDI-EBSCO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EDI-Apollo&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;Digita  on the grounds of adultery alone. Adultery reflected failed conjugality, feeble household rule and the collapse of the household economy in very direct ways; equally, it raised questions about male honour, gender hierarchy and, more broadly, social and political order. When husbands abused their authority they threatened conjugality, domestic harmony and, finally, household order and neighbourhood peace. Sexual prowess, so central to early modern notions of a legally valid marriage was an issue indirectly addressed in adultery suits as well as one that carried emotional, social, cultural and, finally, legal weight. In the most drastic way, it testified to the loss of ownership over a wife.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781315233574-12&q;,&q;chapterId&q;:&q;chapter9&q;,&q;sku&q;:null},&q;label&q;:&q;9&q;,&q;pageStart&q;:&q;201&q;,&q;pageEnd&q;:&q;229&q;,&q;parentId&q;:&q;0fd073f6-4d89-488b-8c0c-39e30562e69f&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;f5628c7f-2790-4a00-9920-252b6e1d3668&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:995,&q;location&q;:null},{&q;_id&q;:&q;876b5645-321e-4e7a-bbab-faa945f138b4&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:341556,&q;location&q;:null},{&q;_id&q;:&q;d739fc86-871e-4da9-a296-9b272e8a33ab&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:13906,&q;location&q;:&q;https://images.tandf.co.uk/common/jackets/crclarge/978131523/9781315233574.jpg&q;},{&q;_id&q;:&q;6d94d331-a736-4fc5-bae7-62af984534f3&q;,&q;type&q;:&q;dbitsxml&q;,&q;size&q;:109038,&q;location&q;:null}],&q;level&q;:2,&q;position&q;:2,&q;availability&q;:[{&q;name&q;:&q;EDI-EBSCO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EDI-Apollo&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;DigitalScience&q;,&q;status&q;:[&q;VALID&q;],&q;errors&q;:[],&q;type&q;:&
