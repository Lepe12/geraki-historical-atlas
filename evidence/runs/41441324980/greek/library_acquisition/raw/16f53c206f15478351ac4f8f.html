nedPublicationDate&q;:&q;2000-03-30T00:00:00.000Z&q;,&q;inLanguage&q;:&q;eng&q;,&q;abstracts&q;:[{&q;type&q;:&q;xml&q;,&q;position&q;:0,&q;caption&q;:null,&q;transcript&q;:null,&q;textType&q;:&q;first-paragraph&q;,&q;value&q;:&q;&l;p&g;When I was a boy growing up in 1950s America, one of the figures who\ncame in and out of my life was an older brother of my mother. Uncle Harold\nwould appear every three or four months, frequently with some new toy for\nme, so that his visits were always happy occasions. As I grew older, however,\nI heard more, usually in overheard remarks of my mother and my\ngrandmother-remarks filled with sadness that spoke of Uncle Harold’s\ndrinking, his inability to keep a job, the emptiness of a life without a woman’s\nlove. I also learned that my uncle had spent two years in the Pacific as an\narmy sergeant in New Guinea and that the experience had changed him\nradically: from an eager youth who had finished high school, who had a car,\njob, and girl before going off to war, to a shell of a man who seemed unable\nto get back on track after confronting the violence, the killing of war in the\nSouth Pacific. His troubles were shared by his brother Clarence, who had\nserved in the merchant marine (because he was too tall and skinny for the\nMarines) and was torpedoed several times. He was later drafted into the\narmy and served in Korea (1951-52), where he was wounded and contracted\ntuberculosis. This experience transformed him too and left him a recluse and\nalcohol dependent. These were my earliest contacts with the legacy of war\nand violence, but they would not be my last. My own turn in the line, so to\nspeak, would come, and while I would try to shut the experience out of my\nmind for a quarter of a century, when I returned to it, I found it as vivid as\never.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Supplementary (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9780203462485-3&q;,&q;chapterId&q;:&q;chapter003&q;,&q;sku& n spear-won concubine, Chryseis, to appease the gods,\nforced Achilles to yield Briseis to him. In great anger Achilles retired from the\nfighting, with the result that Hector and his Trojans inflicted defeat upon\ndefeat, leaving the demoralized Achaeans reeling. As this crisis grew,\nAgamemnon received a divine dream one night, suggesting that he test the\nspirit of his disheartened men by asking them, in an assembly, if they should\nyield to the Trojan might and return home. At dawn he convened this assembly\nand could say no more than the magical word “home” before his men were\nracing to their boats to do just that. Of course, this was not what he and the\nother kings or chiefs-Odysseus, Nestor, Menelaus-had in mind! With some\ndifficulty order was restored and the reluctant warriors were herded back\ninto assembly. It was at this point that Thersites spoke, rebuking Agamemnon\nfor his bankrupt leadership.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Supplementary (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9780203462485-4&q;,&q;chapterId&q;:&q;chapter004&q;,&q;sku&q;:null},&q;label&q;:&q;2&q;,&q;pageStart&q;:&q;28&q;,&q;pageEnd&q;:&q;49&q;,&q;parentId&q;:null,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;b913d36e-4fd1-4daa-a754-ebdae82b5287&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1514,&q;location&q;:null},{&q;_id&q;:&q;5eb188ab-bcd5-412f-ba7b-2c773055858c&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:645792,&q;location&q;:null},{&q;_id&q;:&q;d6cd0406-8661-4a7e-b24c-f68aaf42c8ea&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:18390,&q;location&q;:&q;https://images.tandf.co.uk/common/jackets/crclarge/978041521/9780415217576.jpg&q;},{&q;_id&q;:&q;0051c89a-2c84-42b1-9d9b-3cce833b0c66&q;,&q;type&q;:&q;dbitsxml&q;,&q;size&q;:66213,&q;location&q;:null}],&q;level&q;:1,&q;position&q;:2,&q;availability&q;:[{&q;name&q;:&q;EDI-EBSCO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EDI &q;position&q;:0,&q;caption&q;:null,&q;transcript&q;:null,&q;textType&q;:&q;first-paragraph&q;,&q;value&q;:&q;&l;p&g;During the course of nearly eleven months in Vietnam, I encountered a\nnumber of men, both officers and enlisted men, who were serving their\nsecond or third tours, or had been “in country,” as the phrase went,\ncontinuously for two or three years. Such a man was Sergeant X, who had\nbeen fighting in different parts of Vietnam for the previous three years and\nwho clearly enjoyed the experience. Once during a firefight with the Viet\nCong, he calmly stood upright in the middle of the fight and fired off a long\nburst of machine gun fire at the enemy. At the time I thought these men\nwere simply crazy or stupid and probably both. Now upon reflection I\nunderstand that they had become “hooked” on violence. In a sense they\nloved war, much like Marrow, the antagonist in John Hersey’s 1959 novel\nThe War Lover, and, long before that, Clearchus, the veteran Spartan soldier,\nwhom Xenophon in his Anabasis described as philopolemos, a “lover of\nwar.”&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Supplementary (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9780203462485-6&q;,&q;chapterId&q;:&q;chapter006&q;,&q;sku&q;:null},&q;label&q;:&q;4&q;,&q;pageStart&q;:&q;71&q;,&q;pageEnd&q;:&q;94&q;,&q;parentId&q;:null,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;c99cf108-0a29-4ee6-939f-da86a3584d33&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1330,&q;location&q;:null},{&q;_id&q;:&q;398489e6-c09d-45d3-85a6-5f4c7941a8da&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:909748,&q;location&q;:null},{&q;_id&q;:&q;2ca60127-e97a-4316-9fc4-218b9f846599&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:18390,&q;location&q;:&q;https://images.tandf.co.uk/common/jackets/crclarge/978041521/9780415217576.jpg&q;},{&q;_id&q;:&q;5e1a3f27-4d46-482f-8984-b1d462aef913&q;,&q;type&q;:&q;dbitsxml&q;,&q;size&q;:70443,&q;location&q;:null}],&q;level&q;:1,&q;position&q;:4,&q;ava . Aristophanes’ references to the “Marathon-fighters” supports Epizelus’\ntalkativeness, but later generations of Athenians heard similar stories too.3 In\nhis Memorabilia, Xenophon introduces an Athenian citizen-soldier named\nNicomachides, who complains to Socrates about the Athenian electorate\npreferring an untried businessman, Antisthenes, to him for the office of general.\nNicomachides goes on to recount the many wounds that he had received in\nthe line of duty, which he believed demonstrated his courage and suitability\nfor office. Xenophon’s concern is to discuss in Socratic fashion what makes a\ngood commander, and in the following discussion Socrates tells Nicomachides\nthat surely Antisthenes’ business skills qualify him for the command.4&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Supplementary (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9780203462485-12&q;,&q;chapterId&q;:&q;chapter012&q;,&q;sku&q;:null},&q;label&q;:&q;10&q;,&q;pageStart&q;:&q;200&q;,&q;pageEnd&q;:&q;214&q;,&q;parentId&q;:null,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;f8f52ab6-9608-421d-9e9f-3fd28366f0f5&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1444,&q;location&q;:null},{&q;_id&q;:&q;f16a3b19-a5d6-406b-8a47-7083b8325764&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:77438,&q;location&q;:null},{&q;_id&q;:&q;8cd2d4f4-6878-412f-a59b-b560d726056e&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:18390,&q;location&q;:&q;https://images.tandf.co.uk/common/jackets/crclarge/978041521/9780415217576.jpg&q;},{&q;_id&q;:&q;4b0d1f64-6f45-46e2-81e1-9bb6456fb5b2&q;,&q;type&q;:&q;dbitsxml&q;,&q;size&q;:49327,&q;location&q;:null}],&q;level&q;:1,&q;position&q;:10,&q;availability&q;:[{&q;name&q;:&q;EDI-EBSCO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EDI-Apollo&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;DigitalScience&q;,&q;status&q;:[&q;VALID&q;]
