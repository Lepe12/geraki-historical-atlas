/10.4324/9780203079140-91/greek-insurrection-judith-cochran"><script type="application/ld+json" id="jsonld">{"@context":"https://schema.org","@type":"Chapter","@id":"10.4324/9780203079140-91","bookFormat":"Ebook","datePublished":"2021-07-09T00:00:00.000Z","bookEdition":"1st Edition","url":"https://www.taylorfrancis.com/chapters/edit/10.4324/9780203079140-91/greek-insurrection-judith-cochran","author":{"@type":"Person","givenName":"Judith","familyName":"Cochran"},"genre":"Area Studies, Humanities, Politics & International Relations","name":"The Greek Insurrection","numberOfPages":null,"description":"The sixty Greek patriots who assembled at Epidaurus on 12 January 1822 and declared the independence of the “Greek nation”, have carved out for themselves a","image":"https://images.tandf.co.uk/common/jackets/agentjpg/978020307/9780203079140.jpg","publisher":{"@type":"Organization","name":"Taylor & Francis","logo":"https://taylorfrancis.com/assets/img/tfgroup-logo.svg","url":"https://taylorfrancis.com"},"publisherImprint":{"@type":"Organization","name":"Routledge","location":{"@type":"Place","address":""}},"identifier":{"@type":"PropertyValue","propertyID":"DOI","value":"10.4324/9780203079140-91"}}</script><meta property="og:url" content="https://www.taylorfrancis.com/chapters/edit/10.4324/9780203079140-91/greek-insurrection-judith-cochran"><meta property="og:type" content="books.book"><meta property="og:site_name" content="Taylor &amp; Francis"><meta property="og:description" content="The sixty Greek patriots who assembled at Epidaurus on 12 January 1822 and declared the independence of the “Greek nation”, have carved out for themselves a"><meta property="og:image" content="http://images.tandf.co.uk/common/jackets/agentjpg/978020307/9780203079140.jpg"><meta property="og:image:secure_url" content="https://images.tandf.co.uk/common/jackets/agentjpg/978020307/9780203079140.jpg"><meta property="og:image:alt" content="The Greek Insurrection"><meta name="audience" content="all"><meta name="distribution" content="global"><meta name="citation_title" content="The Greek Insurrection"><meta name="citation_publication_date" content="2021/07/09"><meta name="citation_publisher" content="Routledge"><meta name="citation_pdf_url" content="https://api.taylorfrancis.com/content/chapters/edit/download?identifierName=doi&amp;identifierValue=10.4324/9780203079140-91&amp;type=chapterpdf"><meta name="citation_doi" content="10.4324/9780203079140-91"><meta name="citation_abstract" content="The sixty Greek patriots who assembled at Epidaurus on 12 January 1822 and declared the independence of the “Greek nation”, have carved out for themselves a permanent place in the international hall of fame. In a word, the Concert of Europe was thrown out of tune because the Greek patriots had dared to speak of liberty thereby striking a discordant note in the harmony which then prevailed. The islands of the Greek Archipelago are, in many cases, separated from one another by a narrow passage-way. These conditions enabled the islanders to co-operate with the marauders and converted the Greek coast into a network of pirate havens and corsair retreats. If the Bourbons supported Islam against Christendom, the French Ministry knew that there were Frenchmen in the Greek army."><meta property="citation_author" content="Judith Cochran"><meta name="citation_xml_url" content="https://api.taylorfrancis.com/content/chapters/edit/download?identifierName=doi&amp;identifierValue=10.4324/9780203079140-91&amp;type=chapterxml"><meta name="citation_inbook_title" content="Routledge Library Editions: Egypt"><meta name="citation_firstpage" content="Vol8:51"><meta name="citation_lastpage" content="Vol8:62"></head>
