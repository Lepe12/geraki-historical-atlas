s/crclarge/978020311/9780203111550.jpg"><meta property="og:image:alt" content="Frames, Humanitarianism, and Legitimacy"><meta name="audience" content="all"><meta name="distribution" content="global"><meta name="citation_title" content="Frames, Humanitarianism, and Legitimacy : Explaining the Anti-Piracy Regime in the Gulf of Aden"><meta name="citation_publication_date" content="2013/05/07"><meta name="citation_publisher" content="Routledge"><meta name="citation_pdf_url" content="https://api.taylorfrancis.com/content/chapters/edit/download?identifierName=doi&amp;identifierValue=10.4324/9780203111550-9&amp;type=chapterpdf"><meta name="citation_doi" content="10.4324/9780203111550-9"><meta name="citation_abstract" content="Piracy off the coast of Somalia has alarmingly escalated in both scope and violence during the past several years, with the Gulf of Aden now constituting the most dangerous waters anywhere in the world. 2 States and nonstate actors have responded in unprecedented fashion. More than twenty countries formed the maritime Combined Task Force (CTF-151), while the European Union (EU) and North Atlantic Treaty Organization (NATO) each launched separate multilateral operations. The United Nations (UN) has also taken historic steps to combat piracy in the Gulf of Aden, including invoking Chapter VII. 3 However, rather than averring piracy exclusively as a security concern, the UN Security Council has repeatedly called upon member states and regional organizations to use “all necessary means” against piracy to protect the vital humanitarian “lifeline” consisting of food aid and logistical support for millions of at-risk Somalis. 4 As piracy off the coast of Somalia threatens a range of commercial and strategic interests, why have key actors framed their collective efforts with reference to protecting humanitarian aid and human rights? Particularly given the long legacy of humanitarian failure in Somalia, why would actors continually frame anti-piracy measures as humanitarianism when more traditional material interests are at stake? 5"><meta property="citation_author" content="Kevin McGahan"><meta property="citation_author" content="Terence Lee"><meta name="citation_xml_url" content="https://api.taylorfrancis.com/content/chapters/edit/download?identifierName=doi&amp;identifierValue=10.4324/9780203111550-9&amp;type=chapterxml"><meta name="citation_inbook_title" content="Maritime Piracy and the Construction of Global Governance"><meta name="citation_firstpage" content="149"><meta name="citation_lastpage" content="167"></head>

;:null,&q;validTo&q;:null,&q;validFrom&q;:null},{&q;name&q;:&q;EBRALL&q;,&q;code&q;:&q;EBRALL&q;,&q;text&q;:&q;Institutional, retail and Atypon&q;,&q;type&q;:&q;access&q;,&q;description&q;:null,&q;validTo&q;:null,&q;validFrom&q;:null},{&q;name&q;:&q;NORIGHTSMOB&q;,&q;code&q;:&q;NORIGHTSMOB&q;,&q;text&q;:&q;No Mobi&q;,&q;type&q;:&q;access&q;,&q;description&q;:null,&q;validTo&q;:null,&q;validFrom&q;:null}],&q;rights&q;:[],&q;chapter&q;:{&q;pageStart&q;:&q;149&q;,&q;pageEnd&q;:&q;167&q;,&q;license&q;:{&q;type&q;:null,&q;description&q;:null,&q;location&q;:null},&q;fundingGroups&q;:[{&q;fundingStatement&q;:null,&q;awardGroupDetails&q;:[{&q;name&q;:&q;funderName&q;,&q;value&q;:null}]}],&q;subtitle&q;:&q;Explaining the Anti-Piracy Regime in the Gulf of Aden&q;,&q;description&q;:null,&q;publisherImprint&q;:&q;Routledge&q;,&q;publicationDate&q;:&q;2013-05-07T00:00:00.000Z&q;,&q;copyright&q;:{&q;holder&q;:&q;Taylor &a; Francis&q;,&q;year&q;:2013,&q;statement&q;:&q;© 2013 Taylor &a; Francis&q;},&q;edition&q;:1,&q;doiRegistrationStatus&q;:false,&q;firstPublishedYear&q;:&q;2013&q;,&q;plannedPublicationDate&q;:&q;2012-10-17T00:00:00.000Z&q;,&q;abstracts&q;:[{&q;type&q;:&q;xml&q;,&q;position&q;:0,&q;caption&q;:null,&q;transcript&q;:null,&q;textType&q;:&q;first-paragraph&q;,&q;value&q;:&q;&l;p&g;Piracy off the coast of Somalia has alarmingly escalated in both scope and violence during the past several years, with the Gulf of Aden now constituting the most dangerous waters anywhere in the world.&l;xref ref-type=\&q;fn\&q; rid=\&q;fn7_2\&q;&g;\n                           &l;sup&g;2&l;/sup&g;\n                        &l;/xref&g; States and nonstate actors have responded in unprecedented fashion. More than twenty countries formed the maritime Combined Task Force (CTF-151), while the European Union (EU) and North Atlantic Treaty Organization (NATO) each launched separate multilateral operations. The United Nations (UN) has also taken historic steps to combat piracy in the Gulf of Aden, including invoking Chapter VII.&l;xref ref-type=\&q;fn\&q; rid=\&q;fn7_3\&q;&g;\n                           &l;sup&g;3&l;/sup&g;\n                        &l;/xref&g; However, rather than averring piracy exclusively as a security concern, the UN Security Council has repeatedly called upon member states and regional organizations to use “all necessary means” against piracy to protect the vital humanitarian “lifeline” consisting of food aid and logistical support for millions of at-risk Somalis.&l;xref ref-type=\&q;fn\&q; rid=\&q;fn7_4\&q;&g;\n                           &l;sup&g;4&l;/sup&g;\n                        &l;/xref&g; As piracy off the coast of Somalia threatens a range of commercial and strategic interests, why have key actors framed their collective efforts with reference to protecting humanitarian aid and human rights? Particularly given the long legacy of humanitarian failure in Somalia, why would actors continually frame anti-piracy measures as humanitarianism when more traditional material interests are at stake?&l;xref ref-type=\&q;fn\&q; rid=\&q;fn7_5\&q;&g;\n                           &l;sup&g;5&l;/sup&g;\n                        &l;/xref&g;\n                     &l;/p&g;&q;}],&q;citation&q;:&q;McGahan, K., &a; Lee, T. (2013). Frames, Humanitarianism, and Legitimacy: Explaining the Anti-Piracy Regime in the Gulf of Aden. Maritime Piracy and the Construction of Global Governance (pp. 149-167). Routledge. https://doi.org/10.4324/9780203111550-9&q;,&q;textType&q;:&q;Monograph (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9780203111550-9&q;,&q;chapterId&q;:&q;chapter7&q;,&q;sku&q;:null},&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;48e7362a-6d99-4918-8471-bc959e2f6b63&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1843,&q;location&q;:null},{&q;_id&q;:&q;89bcb953-d308-4a92-aced-b7d6590b0327&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:229184,&q;location&q;:null},{&q;_id&q;:&q;c173a186-aeb7-4ce8-b3f4-8274c78a322a&q;,&q;type&q;:&q;coverima
