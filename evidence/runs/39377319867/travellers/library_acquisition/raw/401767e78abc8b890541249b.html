tent="Mediterranean Voyages"><meta property="books:isbn" content="9781315424774"><meta property="books:page_count" content="324"><meta name="audience" content="all"><meta name="distribution" content="global"><meta name="citation_title" content="Mediterranean Voyages : The Archaeology of Island Colonisation and Abandonment"><meta name="citation_publication_date" content="2016/07/01"><meta name="citation_isbn" content="9781315424774"><meta name="citation_publisher" content="Routledge"><meta name="citation_pdf_url" content="https://api.taylorfrancis.com/content/books/mono/download?identifierName=doi&amp;identifierValue=10.4324/9781315424774&amp;type=googlepdf"><meta name="citation_doi" content="10.4324/9781315424774"><meta name="citation_abstract" content="Islands are ideal case studies for exploring social connectivity, episodes of colonisation, abandonment, and alternating phases of cultural interaction and isolation. Their societies display different attitudes toward the land and the sea, which in turn cast light on group identities. This volume advances theoretical discussions of island archaeology by offering a comparative study of the archaeology of colonisation, abandonment, and resettlement of the Mediterranean islands in prehistory. This comparative and thematic study encourages anthropological reflections on the archaeology of the islands, ultimately focusing on people rather than geographical units, and specifically on the relations between islanders, mainlanders, and the creation of islander identities. This volume has significance for scholars interested in Mediterranean archaeology, as well as those interested more broadly in colonisation and abandonment."><meta property="citation_author" content="Helen Dawson"><meta name="citation_xml_url" content="https://api.taylorfrancis.com/content/books/mono/download?identifierName=doi&amp;identifierValue=10.4324/9781315424774&amp;type=bookxml"><meta property="books:author" content="Helen Dawson"></head>

mentation and hyperspecialisation of Mediterranean studies that equally stigmatises. This work addresses the changing nature of colonisation and abandonment in the Mediterranean islands by making the most of switching between different scales of enquiry. Evidence suggests that Bronze Age colonisers inhabited the islands for considerably shorter periods than did their Neolithic counterparts. Mediterranean islands, island archaeology, environmental data, theoretical framework, colonisation theories, Bronze Age colonisers, neolithic counterparts.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Supplementary (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781315424774-1&q;,&q;chapterId&q;:&q;chapter1&q;,&q;sku&q;:null},&q;label&q;:&q;1&q;,&q;pageStart&q;:&q;13&q;,&q;pageEnd&q;:&q;21&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;f616b7df-8ee7-4746-a849-fbdc43265de0&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1250,&q;location&q;:null},{&q;_id&q;:&q;ccbbc313-0289-49e5-adf0-c55d6bdc57fa&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:96411,&q;location&q;:null},{&q;_id&q;:&q;05468965-7ea6-4f88-844f-a3473261e19f&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:33104,&q;location&q;:&q;https://images.tandf.co.uk/common/jackets/crclarge/978131542/9781315424774.jpg&q;},{&q;_id&q;:&q;55345871-20cb-4f94-9761-bcc3d608c3b2&q;,&q;type&q;:&q;dbitsxml&q;,&q;size&q;:38800,&q;location&q;:null}],&q;level&q;:1,&q;position&q;:1,&q;availability&q;:[{&q;name&q;:&q;EDI-EBSCO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EDI-Apollo&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;DigitalScience&q;,&q;status&q;:[&q;VALID&q;],&q;errors&q;:[],&q;type&q;:&q;content&q;},{&q;name&q;:&q;LOGPRO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;SF OMS&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID n, and geology all affect the availability of resources, as do rainfall, water sources, and the extent of agricultural soil. The pull of an uninhabited place like Cyprus would have been strong&s; as competition over resources intensified in the mainland.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Supplementary (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781315424774-2&q;,&q;chapterId&q;:&q;chapter2&q;,&q;sku&q;:null},&q;label&q;:&q;2&q;,&q;pageStart&q;:&q;22&q;,&q;pageEnd&q;:&q;41&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;f5d1614a-2d80-4347-8010-97aed15d1b4b&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1209,&q;location&q;:null},{&q;_id&q;:&q;e2741e77-1546-4800-a8ae-7e6683fe5279&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:610542,&q;location&q;:null},{&q;_id&q;:&q;07569db3-3c7d-40f7-9cb7-8d6b7f31e63e&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:33104,&q;location&q;:&q;https://images.tandf.co.uk/common/jackets/crclarge/978131542/9781315424774.jpg&q;},{&q;_id&q;:&q;82f31188-250a-4746-911d-bd07d28c4045&q;,&q;type&q;:&q;dbitsxml&q;,&q;size&q;:74314,&q;location&q;:null}],&q;level&q;:1,&q;position&q;:2,&q;availability&q;:[{&q;name&q;:&q;EDI-EBSCO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EDI-Apollo&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;DigitalScience&q;,&q;status&q;:[&q;VALID&q;],&q;errors&q;:[],&q;type&q;:&q;content&q;},{&q;name&q;:&q;LOGPRO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;SF OMS&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EDI-Amazon&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:&q;product&q;},{&q;name&q;:&q;EBSCO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;NOT_RHO_COLLECTION&q;],&q;type&q;:&q;content&q;},{&q;name&q;:&q;BM s&q;:[{&q;fundingStatement&q;:null,&q;awardGroupDetails&q;:[{&q;name&q;:&q;funderName&q;,&q;value&q;:null}]}],&q;groupOfCompany&q;:&q;OBB&q;,&q;podSuitable&q;:false,&q;subtitle&q;:null,&q;description&q;:null,&q;publisherImprint&q;:&q;Routledge&q;,&q;publicationDate&q;:&q;2016-07-01T00:00:00.000Z&q;,&q;copyright&q;:{},&q;edition&q;:1,&q;doiRegistrationStatus&q;:false,&q;firstPublishedYear&q;:&q;2014&q;,&q;plannedPublicationDate&q;:&q;2016-06-13T00:00:00.000Z&q;,&q;inLanguage&q;:&q;eng&q;,&q;abstracts&q;:[{&q;type&q;:&q;xml&q;,&q;position&q;:0,&q;caption&q;:null,&q;transcript&q;:null,&q;textType&q;:&q;enriched&q;,&q;value&q;:&q;&l;p&g;The chapter explores the degree to which our knowledge regarding island colonisation has changed in the last two decades. Archaeological investigations in recent years have highlighted the potential for finding early evidence for island colonisation when research focuses on the right places. The islands here are located along the shores of Mediterranean Morocco and western Algeria. Pantelleria obsidian, or Pantellerite&s;, is readily distinguishable from other western Mediterranean sources because of its chemical content, which makes it look greenish. The Maltese islands have been considered amongst the most isolated islands in the Mediterranean after the Balearics. It is worth restating that there remains considerable controversy surrounding our understanding of the colonisation not just of small islands but also of some of the largest islands in the western Mediterranean. As more modern investigative techniques are employed, in tandem with more established field and excavation methods, traditional chronologies are being debunked, leading to a radical reassessment of colonisation dynamics.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Supplementary (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781315424774-4&q;,&q;chapterId&q;:&q;chapter4&q;,&q;sku&q;:null},&q;label&q;:&q;4&q;,&q;pageStart&q;:&q;69&q;,&q;pageEnd&q;:&q;1 ,&q;podSuitable&q;:false,&q;subtitle&q;:null,&q;description&q;:null,&q;publisherImprint&q;:&q;Routledge&q;,&q;publicationDate&q;:&q;2016-07-01T00:00:00.000Z&q;,&q;copyright&q;:{},&q;edition&q;:1,&q;doiRegistrationStatus&q;:false,&q;firstPublishedYear&q;:&q;2014&q;,&q;plannedPublicationDate&q;:&q;2016-06-13T00:00:00.000Z&q;,&q;inLanguage&q;:&q;eng&q;,&q;abstracts&q;:[{&q;type&q;:&q;xml&q;,&q;position&q;:0,&q;caption&q;:null,&q;transcript&q;:null,&q;textType&q;:&q;enriched&q;,&q;value&q;:&q;&l;p&g;This chapter discusses the earliest colonisation data in the eastern Mediterranean islands. The Ionian group comprises eight main islands: Corfu, Paxos, Lefkas, Kefalonia, Ithaka, and Zakynthos; officially, it also includes Kythera and its satellite Antikythera. The earliest colonisation of these islands in the Neolithic and the subsequent development of Early Bronze Age Cycladic cultures have been considered in fine detail by Broodbank in his book &l;italic&g;An Island Archaeology of the Early Cyclades&l;/italic&g;. Cherry argues that it is quite possible that humans encountered the last survivors of the island&s;s endemic fauna but unlikely that they were responsible for their systematic depletion over the whole island. He concludes that many of the islands of the southeast Aegean, both large and small, seem to have been settled during the later stages of the Neolithic&s;. The evidence reviewed highlights the difficulties in correlating diagnostic artefacts and colonisation activities, but also that settlement is but one type of colonisation.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Supplementary (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781315424774-5&q;,&q;chapterId&q;:&q;chapter5&q;,&q;sku&q;:null},&q;label&q;:&q;5&q;,&q;pageStart&q;:&q;123&q;,&q;pageEnd&q;:&q;145&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;f9b9c6c8-3c06-4b5e-9c28-476a933ef053&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1101,&q;location&q;:null},{&q;_id&q;: &q;:1,&q;doiRegistrationStatus&q;:false,&q;firstPublishedYear&q;:&q;2014&q;,&q;plannedPublicationDate&q;:&q;2016-06-13T00:00:00.000Z&q;,&q;inLanguage&q;:&q;eng&q;,&q;abstracts&q;:[{&q;type&q;:&q;xml&q;,&q;position&q;:0,&q;caption&q;:null,&q;transcript&q;:null,&q;textType&q;:&q;enriched&q;,&q;value&q;:&q;&l;p&g;This chapter provides the key results from the earlier studies in light of the new data, starting with a revision of colonisation cumulative plot for the whole Mediterranean, and compare rates of island colonisation per period and area. Cherry&s;s work focuses on biogeographical and cultural variables in the Mediterranean islands and highlighted some useful correlations with other island regions. It identifies cultural variables for comparative study, focusing on sites which provide good evidence for certain cultural features or illustrate particular cultural processes, such as island visitation/utilisation, permanent settlement, and establishment. The sites discussed here have been chosen as illustrating island colonisation in pre-Neolithic and post-Neolithic contexts and as showing parallels and differences between these and Neolithic colonisation activities, specifically their settlement, which are frequently acknowledged colonisation activity. The data confirm the fact that the Neolithic was a key period for colonisation. This is partly because colonisation is often considered the ultimate goal of human activity on islands.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Supplementary (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781315424774-6&q;,&q;chapterId&q;:&q;chapter6&q;,&q;sku&q;:null},&q;label&q;:&q;6&q;,&q;pageStart&q;:&q;146&q;,&q;pageEnd&q;:&q;179&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;e6b72215-ba40-42da-9156-23e965187c23&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1196,&q;location&q;:null},{&q;_id&q;:&q;425c16fc-2a24-4ce3-9375-66705086ac89&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:460214,&q;location&q;: 00Z&q;,&q;inLanguage&q;:&q;eng&q;,&q;abstracts&q;:[{&q;type&q;:&q;xml&q;,&q;position&q;:0,&q;caption&q;:null,&q;transcript&q;:null,&q;textType&q;:&q;enriched&q;,&q;value&q;:&q;&l;p&g;This chapter presents the applicability of both environmental and sociocultural explanations of abandonment to Mediterranean islands. It exposes the functionalist emphasis prevalent in abandonment studies. Understanding abandonment ultimately clarifies aspects of colonisation, and vice versa, as both are fundamental components of a cyclical process. Schiffer pointed out that the ethnographic literature explains abandonment consists of scattered observations: such information remains to be synthesized, systematized and tested&s;, and Wobst cautioned us about the tyranny of the ethnographic record&s;. Bowdler explains initial abandonment by insularisation, and subsequent abandonment by cultural and environmental factors: increased physical isolation from the mainland, the abandonment&s; of watercraft technology, and decreased reliance on marine resources. Factors of a contingent nature can complicate matters even further, as shown vividly by the abandonment of many Mediterranean islands in the historic period, often as a result of both pirates and parasites.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Supplementary (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781315424774-7&q;,&q;chapterId&q;:&q;chapter7&q;,&q;sku&q;:null},&q;label&q;:&q;7&q;,&q;pageStart&q;:&q;180&q;,&q;pageEnd&q;:&q;208&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;a3665592-0470-4b1c-ad45-c200802505ad&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1119,&q;location&q;:null},{&q;_id&q;:&q;8b1e0930-54a3-423b-8895-a224bc708991&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:220033,&q;location&q;:null},{&q;_id&q;:&q;029987de-c9d1-439d-baa1-368f7f5a24df&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:33104,&q;location&q;:&q;https://images.tandf.co.uk/common/jackets/crclarge/978131542/9781315424774.jpg&  fixed parameter determining colonisation. While geographical characteristics are important, it should be evident at this point and consider islands not just in space but also in time. In practical terms, this entails piecing together the evidence for initial colonisation, abandonment, and recolonisation from the islands and interpreting it in light of the theories. The islands selected to put all this into practice are Kythera; Melos, Kea, and Naxos; Cyprus; Palagrua and Hvar; Ibiza and Formentera; the Aeolian Islands; Malta; Jerba; Pantelleria; Palmarola; and the Tremiti Islands. Some important parallels were identified between the Pitiussae/Balearics and the Lipari and Tremiti islands, in terms of expansion and contraction strategies within an archipelago, and the effects of contingent factors. Focusing on individual islands shows that there are difficulties with establishing whether gaps in the data correspond to actual instances of island-wide abandonment.&l;/p&g;&q;}],&q;citation&q;:&q;&q;,&q;textType&q;:&q;Supplementary (DRM-Free)&q;},&q;identifiers&q;:{&q;doi&q;:&q;10.4324/9781315424774-8&q;,&q;chapterId&q;:&q;chapter8&q;,&q;sku&q;:null},&q;label&q;:&q;8&q;,&q;pageStart&q;:&q;209&q;,&q;pageEnd&q;:&q;259&q;,&q;isFree&q;:false,&q;associatedMedia&q;:[{&q;_id&q;:&q;096d9851-2db5-404a-936b-4bf6c72e9f89&q;,&q;type&q;:&q;chapterabstractxml&q;,&q;size&q;:1100,&q;location&q;:null},{&q;_id&q;:&q;36e77568-c77d-465f-b32f-c0051af3e475&q;,&q;type&q;:&q;chapterpdf&q;,&q;size&q;:1023085,&q;location&q;:null},{&q;_id&q;:&q;efe7f481-e720-461e-90de-7edbb3d5269a&q;,&q;type&q;:&q;coverimage&q;,&q;size&q;:33104,&q;location&q;:&q;https://images.tandf.co.uk/common/jackets/crclarge/978131542/9781315424774.jpg&q;},{&q;_id&q;:&q;3d3b80e2-4fce-4021-8a16-476170657087&q;,&q;type&q;:&q;dbitsxml&q;,&q;size&q;:356923,&q;location&q;:null}],&q;level&q;:1,&q;position&q;:8,&q;availability&q;:[{&q;name&q;:&q;EDI-EBSCO&q;,&q;status&q;:[&q;INVALID&q;],&q;errors&q;:[&q;INVALID_FORMAT&q;],&q;type&q;:
