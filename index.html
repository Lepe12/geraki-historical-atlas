<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ιστορικός Άτλας της Μεσογείου</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=GFS+Didot&family=IM+Fell+English:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0}body{font-family:'Plus Jakarta Sans',sans-serif;background:#0a0d12;color:#e5ded3;overflow:hidden}
.font-cinzel{font-family:'Cinzel',serif}.font-didot{font-family:'GFS Didot',serif}.font-archival{font-family:'IM Fell English',serif}
.glass-dark{background:rgba(18,16,13,.92);backdrop-filter:blur(14px);border-color:rgba(207,163,94,.28)!important}
.parchment-panel{background:#e9d5b7;color:#2b1f17;box-shadow:inset 0 0 100px rgba(83,51,22,.18),-14px 0 34px rgba(0,0,0,.40)}
#realMap{position:absolute;inset:0;background:#557c82}
.leaflet-tile-pane{filter:sepia(.28) saturate(.82) contrast(1.16) brightness(.94) hue-rotate(-8deg)}
.leaflet-container{background:#547f86;font-family:'GFS Didot',serif}
.leaflet-control-attribution{background:rgba(20,17,13,.74)!important;color:#c8b28d!important}
.leaflet-control-attribution a{color:#e0bd7b!important}
.map-wash{position:absolute;inset:0;z-index:450;pointer-events:none;background:
radial-gradient(circle at 49% 42%,rgba(255,241,199,.06) 0 28%,transparent 58%),
linear-gradient(rgba(77,55,32,.03),rgba(38,28,20,.10));mix-blend-mode:multiply}
.settlement-wrap{position:relative;transform:translate(-50%,-78%);pointer-events:auto}
.settlement-img{display:block;width:110px;height:auto;filter:drop-shadow(0 6px 6px rgba(31,21,14,.36));transition:transform .18s ease}
.settlement-wrap:hover .settlement-img{transform:scale(1.08)}
.settlement-wrap.village .settlement-img{width:76px}.settlement-wrap.coastal-village .settlement-img{width:82px}.settlement-wrap.town .settlement-img{width:92px}.settlement-wrap.city .settlement-img{width:108px}.settlement-wrap.capital .settlement-img{width:122px}.settlement-wrap.port .settlement-img{width:100px}
.settlement-label{position:absolute;left:50%;top:76%;transform:translateX(-50%);white-space:nowrap;padding:2px 6px;background:rgba(232,211,171,.92);border:1px solid rgba(75,51,28,.34);color:#2e2117;font:700 12px/1.1 'GFS Didot',serif;box-shadow:0 2px 5px rgba(30,20,12,.18)}
.label-only{white-space:nowrap;color:#3a2b20;font:700 12px/1.2 'GFS Didot',serif;text-shadow:0 1px 0 #f3dfb8,0 0 5px #f3dfb8}
.route-hit{cursor:pointer}
.panel-scroll::-webkit-scrollbar{width:6px}.panel-scroll::-webkit-scrollbar-thumb{background:rgba(124,83,43,.4);border-radius:5px}
.book-btn.active,.year-btn.active{background:rgba(217,119,6,.32);border-color:rgba(245,158,11,.72);color:#fde8ba}
#sidePanel.closed{transform:translateX(100%)}
</style>
</head>
<body class="h-screen w-screen flex flex-col">
<header class="h-16 z-[1200] glass-dark flex items-center justify-between px-5 md:px-7 border-b shrink-0">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-full border border-amber-500/45 bg-amber-950/50 flex items-center justify-center text-amber-400"><i class="fa-solid fa-compass text-xl"></i></div>
    <div><div class="font-cinzel text-[17px] font-bold tracking-[.14em] text-amber-100">ΙΣΤΟΡΙΚΟΣ ΑΤΛΑΣ</div><div class="font-cinzel text-[9px] tracking-[.28em] text-amber-500">ΤΗΣ ΜΕΣΟΓΕΙΟΥ</div></div>
  </div>
  <nav class="hidden lg:flex items-center gap-5 font-cinzel text-[11px] tracking-wider">
    <button class="text-amber-300 border-b-2 border-amber-400 py-2">ΧΑΡΤΗΣ</button><button class="text-stone-400">ΠΕΡΙΟΔΟΙ</button><button class="text-stone-400">ΘΕΜΑΤΑ</button><button class="text-stone-400">ΠΡΟΣΩΠΑ</button><button class="text-stone-400">ΠΗΓΕΣ</button>
  </nav>
  <div class="relative w-52 sm:w-72 md:w-80">
    <input id="searchInput" class="w-full bg-stone-900/85 border border-amber-800/45 text-amber-100 text-xs rounded-md py-2 pl-9 pr-8 outline-none" placeholder="Αναζήτηση τόπων, προσώπων..." oninput="searchPlaces(this.value)">
    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-amber-500/70"></i>
    <div id="searchResults" class="hidden absolute top-full mt-2 left-0 right-0 bg-stone-900/95 border border-amber-700/40 rounded-md shadow-2xl max-h-72 overflow-y-auto z-[1600]"></div>
  </div>
</header>

<main class="relative flex-1 min-h-0">
  <div id="realMap"></div><div class="map-wash"></div>
  <div class="absolute top-5 left-5 z-[800] flex flex-col gap-1 glass-dark p-1.5 rounded-md border">
    <button onclick="atlasMap.zoomIn()" class="w-8 h-8 text-amber-300 hover:bg-amber-500/15 rounded"><i class="fa-solid fa-plus"></i></button>
    <button onclick="atlasMap.zoomOut()" class="w-8 h-8 text-amber-300 hover:bg-amber-500/15 rounded"><i class="fa-solid fa-minus"></i></button>
    <button onclick="fitAll()" class="w-8 h-8 text-amber-300 hover:bg-amber-500/15 rounded"><i class="fa-solid fa-arrows-to-dot"></i></button>
  </div>
  <div class="absolute bottom-5 left-6 z-[800] hidden sm:block pointer-events-none">
    <div class="w-24 h-24 rounded-full border border-dashed border-amber-500/45 flex items-center justify-center text-amber-300 relative">
      <span class="absolute top-1 text-[10px]">N</span><span class="absolute right-1 text-[10px]">E</span><span class="absolute bottom-1 text-[10px]">S</span><span class="absolute left-1 text-[10px]">W</span><i class="fa-regular fa-compass text-5xl opacity-90"></i>
    </div>
  </div>

  <aside id="sidePanel" class="closed absolute z-[1300] right-0 top-0 bottom-0 w-full sm:w-[430px] lg:w-[470px] parchment-panel border-l border-amber-900/40 transition-transform duration-300 flex flex-col">
    <div class="p-5 border-b border-amber-900/25 flex justify-between items-start">
      <div><div id="panelSubtitle" class="font-cinzel text-[10px] tracking-[.16em] text-amber-900/75"></div><h2 id="panelTitle" class="font-didot text-4xl text-stone-900 leading-none mt-1"></h2></div>
      <button onclick="closePanel()" class="w-9 h-9 rounded-full hover:bg-amber-900/10 text-amber-950"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <div class="panel-scroll flex-1 overflow-y-auto p-5">
      <div id="panelHero" class="h-44 rounded-md border border-amber-900/30 bg-gradient-to-br from-amber-200 to-stone-400 flex items-center justify-center text-amber-950/65 font-archival italic">Εικόνα τεκμηρίωσης μη διαθέσιμη</div>
      <p id="panelDescription" class="font-didot text-[16px] leading-relaxed text-stone-800 mt-5"></p>
      <div class="mt-5 space-y-2" id="panelRows"></div>
      <div id="panelNote" class="mt-4 text-xs leading-relaxed text-stone-700 border-l-2 border-amber-800/50 pl-3"></div>
    </div>
  </aside>
</main>

<footer class="h-20 z-[1200] glass-dark border-t shrink-0 px-5 flex items-center justify-between gap-4">
  <div class="flex items-center gap-2 overflow-x-auto">
    <span class="font-cinzel text-[10px] text-amber-500 mr-1">ΒΙΒΛΙΟ</span>
    <button class="book-btn active px-3 py-2 rounded border border-amber-800/40 text-xs text-stone-300" data-book="All">Όλα</button>
    <button class="book-btn px-3 py-2 rounded border border-amber-800/40 text-xs text-stone-300" data-book="Book I">Book I</button>
    <button class="book-btn px-3 py-2 rounded border border-amber-800/40 text-xs text-stone-300" data-book="Book II">Book II</button>
    <button class="book-btn px-3 py-2 rounded border border-amber-800/40 text-xs text-stone-300" data-book="Book III">Book III</button>
  </div>
  <div class="flex items-center gap-2 overflow-x-auto">
    <span class="font-cinzel text-[10px] text-amber-500 mr-1">ΕΤΟΣ</span>
    <button class="year-btn active px-3 py-2 rounded border border-amber-800/40 text-xs text-stone-300" data-year="All">Όλα</button>
    <button class="year-btn px-3 py-2 rounded border border-amber-800/40 text-xs text-stone-300" data-year="1574">1574</button>
    <button class="year-btn px-3 py-2 rounded border border-amber-800/40 text-xs text-stone-300" data-year="1577">1577</button>
    <button class="year-btn px-3 py-2 rounded border border-amber-800/40 text-xs text-stone-300" data-year="1578">1578</button>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let DATA={places:[],routes:[]},state={book:"All",year:"All"},atlasMap,placeLayer,routeLayer;
const byId=new Map();
const symbolAsset=s=>({
  village:"diorama-village.webp","coastal-village":"diorama-coastal.webp",
  town:"diorama-town.webp",city:"diorama-city.webp",capital:"diorama-city.webp",
  port:"diorama-port.webp"
}[s]||"diorama-town.webp");

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function initMap(){
  atlasMap=L.map("realMap",{zoomControl:false,minZoom:3,maxZoom:13,zoomSnap:.5,preferCanvas:true}).setView([39.0,18.5],5);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}",{maxNativeZoom:13,maxZoom:13,attribution:"Relief © Esri"}).addTo(atlasMap);
  placeLayer=L.layerGroup().addTo(atlasMap);routeLayer=L.layerGroup().addTo(atlasMap);
}
function bookHit(x){return state.book==="All"||(x.books||[]).includes(state.book)}
function yearHit(x){return state.year==="All"||(x.period||"").includes(state.year)}
function placeVisible(p){return Number.isFinite(p.lat)&&Number.isFinite(p.lon)&&bookHit(p)&&yearHit(p)}
function routeVisible(r){return bookHit(r)&&yearHit(r)&&!r.atlasHidden}
function markerFor(p){
  const symbol=(p.atlasSymbol||p.type||"town").toLowerCase();
  if(["sea-label","region-label","island-label"].includes(symbol)){
    return L.marker([p.lat,p.lon],{icon:L.divIcon({className:"",html:`<div class="label-only">${esc(p.place)}</div>`,iconSize:[140,22],iconAnchor:[70,11]})});
  }
  const asset=symbolAsset(symbol);
  return L.marker([p.lat,p.lon],{
    icon:L.divIcon({className:"",html:`<div class="settlement-wrap ${esc(symbol)}"><img class="settlement-img" src="./icons/${asset}" alt=""><div class="settlement-label">${esc(p.place)}</div></div>`,iconSize:[130,110],iconAnchor:[65,80]})
  });
}
function routePoints(r){
  const a=byId.get(r.from?.[0]?.id),b=byId.get(r.to?.[0]?.id); if(!a||!b)return [];
  const start=Array.isArray(r.displayStart)?r.displayStart:[a.lat,a.lon],end=Array.isArray(r.displayEnd)?r.displayEnd:[b.lat,b.lon];
  const pts=[start];(r.waypoints||[]).forEach(w=>Array.isArray(w)&&pts.push(w));pts.push(end);return pts;
}
function routeStyle(r){
  if(r.type==="INTELLIGENCE / NETWORK")return{color:"#8e7b63",weight:1,opacity:.38,dashArray:"2 10"};
  if(r.type==="PLANNED — NOT EXECUTED")return{color:"#a38660",weight:1,opacity:.38,dashArray:"3 11"};
  if(r.type==="STRONG RECONSTRUCTION")return{color:"#d8c291",weight:1.2,opacity:.64,dashArray:"4 9"};
  if(r.medium==="land")return{color:"#6e4a32",weight:1.3,opacity:.7,dashArray:"4 8"};
  return{color:"#f0dfb5",weight:1.6,opacity:.9,dashArray:"6 8"};
}
function render(){
  placeLayer.clearLayers();routeLayer.clearLayers();
  DATA.routes.filter(routeVisible).forEach(r=>{
    const pts=routePoints(r); if(pts.length<2)return;
    const line=L.polyline(pts,{...routeStyle(r),interactive:true,className:"route-hit"}).addTo(routeLayer);
    line.on("click",()=>showRoute(r));
  });
  DATA.places.filter(placeVisible).forEach(p=>{
    const m=markerFor(p).addTo(placeLayer);m.on("click",()=>showPlace(p));
  });
}
function row(icon,label,val){if(!val)return"";return `<div class="p-3 rounded-md bg-amber-950/5 border border-amber-900/15 flex gap-3"><div class="w-8 h-8 rounded bg-amber-900/10 flex items-center justify-center text-amber-900"><i class="fa-solid ${icon}"></i></div><div><div class="font-cinzel text-[9px] tracking-wider text-amber-900/75 uppercase">${esc(label)}</div><div class="font-didot text-sm text-stone-900 mt-1">${esc(val)}</div></div></div>`}
function openPanel(){document.getElementById("sidePanel").classList.remove("closed")}
function closePanel(){document.getElementById("sidePanel").classList.add("closed")}
function showPlace(p){
  document.getElementById("panelTitle").textContent=p.place||"";
  document.getElementById("panelSubtitle").textContent=p.historicalNames||p.modernName||"";
  document.getElementById("panelDescription").textContent=p.historicalContext||p.trilogyRole||"";
  document.getElementById("panelRows").innerHTML=row("fa-hourglass-half","Περίοδος",p.period)+row("fa-user-group","Πρόσωπα",p.characters)+row("fa-compass","Ρόλος",p.trilogyRole)+row("fa-landmark","Εξουσία / έλεγχος",p.authority)+row("fa-scroll","Τεκμηρίωση",p.sources||p.historicalStatus);
  document.getElementById("panelNote").textContent=p.notes||"";
  openPanel();
}
function showRoute(r){
  const from=(r.from||[]).map(x=>x.name).join(", "),to=(r.to||[]).map(x=>x.name).join(", ");
  document.getElementById("panelTitle").textContent=r.name||"Διαδρομή";
  document.getElementById("panelSubtitle").textContent=r.character||"";
  document.getElementById("panelDescription").textContent=r.evidence||"";
  document.getElementById("panelRows").innerHTML=row("fa-hourglass-half","Περίοδος",r.period)+row("fa-location-dot","Από",from)+row("fa-location-dot","Προς",to)+row("fa-ship","Μέσο",r.medium)+row("fa-scroll","Τεκμηρίωση",r.status||r.type);
  document.getElementById("panelNote").textContent=r.note||"";
  openPanel();
}
function fitAll(){const pts=DATA.places.filter(placeVisible).map(p=>[p.lat,p.lon]);if(pts.length)atlasMap.fitBounds(pts,{padding:[70,70],maxZoom:6})}
function searchPlaces(q){
  const box=document.getElementById("searchResults");q=q.trim().toLowerCase();
  if(!q){box.classList.add("hidden");box.innerHTML="";return}
  const m=DATA.places.filter(p=>[p.place,p.historicalNames,p.modernName,p.characters].some(v=>String(v||"").toLowerCase().includes(q))).slice(0,12);
  box.innerHTML=m.map(p=>`<button class="w-full text-left p-3 border-b border-stone-800 hover:bg-amber-900/20" onclick="focusPlace('${p.id}')"><div class="text-amber-200 text-xs font-bold">${esc(p.place)}</div><div class="text-stone-400 text-[10px]">${esc(p.historicalNames||p.modernName||"")}</div></button>`).join("");
  box.classList.remove("hidden");
}
function focusPlace(id){const p=byId.get(id);if(!p)return;atlasMap.setView([p.lat,p.lon],7);showPlace(p);document.getElementById("searchResults").classList.add("hidden")}
document.querySelectorAll(".book-btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".book-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.book=b.dataset.book;render();fitAll()});
document.querySelectorAll(".year-btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".year-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.year=b.dataset.year;render();fitAll()});
(async function(){
  initMap();
  DATA=await fetch("./data.json?v=20261006-real-data-ui-1").then(r=>r.json());
  DATA.places.forEach(p=>byId.set(p.id,p));
  render();fitAll();
})();
</script>
</body>
</html>
