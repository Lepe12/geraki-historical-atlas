<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" fill="none">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="coast" x1="180" y1="210" x2="1430" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6FE4F2" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#8BEAF3" stop-opacity=".52"/>
      <stop offset="1" stop-color="#6FE4F2" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="route" x1="260" y1="390" x2="1370" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8BE7A" stop-opacity=".04"/>
      <stop offset=".48" stop-color="#E8BE7A" stop-opacity=".28"/>
      <stop offset="1" stop-color="#E8BE7A" stop-opacity=".04"/>
    </linearGradient>
  </defs>

  <!-- northern Mediterranean coastline: Iberia -> France -> Italy -> Adriatic -> Greece -> Anatolia/Levant -->
  <path d="M150 252 L188 230 L232 236 L272 219 L325 225 L365 207 L414 214 L458 232
           L495 221 L528 234 L548 263 L567 290 L592 307 L611 326 L624 354
           L642 374 L661 352 L671 320 L688 299 L702 270 L720 250 L739 255
           L748 282 L765 299 L783 315 L801 302 L821 281 L845 276 L866 290
           L884 312 L902 304 L922 287 L944 296 L963 321 L980 347 L1002 355
           L1022 338 L1044 324 L1067 330 L1088 350 L1112 360 L1136 349
           L1160 330 L1187 320 L1215 329 L1243 347 L1270 352 L1294 340
           L1322 345 L1349 361 L1377 367 L1404 359 L1434 371"
        stroke="url(#coast)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- southern Mediterranean coastline: Morocco -> Algeria -> Tunisia -> Libya -> Egypt -->
  <path d="M167 486 L209 470 L251 463 L296 468 L338 457 L384 454 L431 462 L475 458
           L520 466 L562 454 L603 446 L644 449 L687 463 L728 471 L772 474 L817 466
           L862 468 L907 479 L950 484 L996 480 L1043 471 L1090 466 L1137 469
           L1181 481 L1224 489 L1267 486 L1311 476 L1352 468 L1396 471"
        stroke="url(#coast)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- islands / peninsulas -->
  <path d="M548 263 L531 291 L536 321 L553 344 L567 366 M592 307 L577 330 L582 357 L596 378" stroke="#85E6F1" stroke-opacity=".26" stroke-width="1.6"/>
  <path d="M686 386 C704 373 722 375 741 386 C727 395 706 398 686 386Z" stroke="#85E6F1" stroke-opacity=".25" stroke-width="1.4"/>
  <path d="M822 365 C838 358 854 360 868 368 C855 376 839 378 822 365Z" stroke="#85E6F1" stroke-opacity=".22" stroke-width="1.2"/>
  <path d="M949 383 C960 375 974 376 985 383 C973 390 960 391 949 383Z" stroke="#85E6F1" stroke-opacity=".20" stroke-width="1.1"/>

  <!-- maritime intelligence routes -->
  <path d="M252 408 C470 338 664 405 853 371 C1010 343 1170 362 1368 405" stroke="url(#route)" stroke-width="1.2" stroke-dasharray="7 15"/>
  <path d="M431 393 C595 425 756 416 904 390 C1055 364 1166 401 1274 421" stroke="#64DCEB" stroke-opacity=".10" stroke-width="1" stroke-dasharray="3 12"/>

  <!-- hubs -->
  <g fill="#73E3EF" filter="url(#glow)">
    <circle cx="510" cy="289" r="3.1"/><circle cx="675" cy="348" r="3.1"/>
    <circle cx="906" cy="333" r="3.1"/><circle cx="1028" cy="350" r="3.1"/>
    <circle cx="1191" cy="332" r="3.1"/><circle cx="1306" cy="347" r="3.1"/>
    <circle cx="603" cy="448" r="3.1"/><circle cx="1032" cy="470" r="3.1"/>
  </g>
  <g fill="#E8BE7A" opacity=".52">
    <circle cx="675" cy="348" r="1.8"/><circle cx="1028" cy="350" r="1.8"/><circle cx="603" cy="448" r="1.8"/>
  </g>
</svg>